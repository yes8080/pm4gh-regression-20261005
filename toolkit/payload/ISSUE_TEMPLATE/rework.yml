name: 返修（Rework）
description: 验收/评审未通过后的返修记录；用于第 3 次打回时的升级决策
title: "[Rework] "
labels: ["type/task", "src/rework"]
body:
  - type: markdown
    attributes:
      value: |
        **默认不要建本 Issue**：返修应在原切片分支上继续提交、原 PR 上重新评审（见 `docs/PLAYBOOK.md` W9）。
        只有以下情况才建：①原切片已合并，验收后发现不达标；②同一切片第 3 次被打回，需要 PM 做重切/澄清决策。

  - type: input
    id: origin
    attributes:
      label: 来源 Issue / PR
      placeholder: "#12 / PR #34"
    validations:
      required: true

  - type: dropdown
    id: round
    attributes:
      label: 第几轮返修
      options:
        - "第 1 轮"
        - "第 2 轮"
        - "第 3 轮（触发升级：必须重切或澄清需求）"
    validations:
      required: true

  - type: textarea
    id: findings
    attributes:
      label: 返修清单
      description: 逐条可核对；每条给出"当前表现 / 期望表现 / 判定方式"
      placeholder: |
        - [ ] 1) 当前：… 期望：… 判定：…
    validations:
      required: true

  - type: textarea
    id: root_cause
    attributes:
      label: 根因判断
      description: 需求不清 / 实现缺陷 / 验收标准不可判定 / 环境差异 —— 直接影响后续是否要改流程
    validations:
      required: true

  - type: textarea
    id: escalation
    attributes:
      label: 第 3 轮升级决策（仅第 3 轮填写）
      description: 由 PM 记录：重切切片 / 澄清需求 / 降级范围 / 取消，及理由
    validations:
      required: false

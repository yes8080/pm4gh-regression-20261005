name: Spike（技术验证）
description: 为消除不确定性而做的限时验证；产出是"结论与决策"，通常不产出生产代码
title: "[Spike] "
labels: ["type/spike", "role/dev"]
body:
  - type: textarea
    id: question
    attributes:
      label: 要回答的问题
      description: 必须是可用"是/否 + 证据"回答的问题，而不是"研究一下 X"
      placeholder: |
        个人账号能否创建自定义 Issue Type？依据必须是官方文档或可回滚实验。
    validations:
      required: true

  - type: input
    id: timebox
    attributes:
      label: 时间盒
      description: 超时即停止并输出当前结论，禁止无限探索
      placeholder: "0.5 天"
    validations:
      required: true

  - type: textarea
    id: method
    attributes:
      label: 验证方法
      description: 官方文档路径 / 可回滚实验步骤 / 需要的最小权限
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: 产出物
      description: 决策记录（ADR）/ 文档更新 / 探针脚本；以及若结论为"不可用"时的降级方案
    validations:
      required: true

  - type: checkboxes
    id: rules
    attributes:
      label: Spike 纪律
      options:
        - label: 不把 Spike 分支合并进 main（只合并结论/文档）
          required: true
        - label: 实验若涉及写操作，必须可回滚并在 Issue 中记录回滚方式
          required: true

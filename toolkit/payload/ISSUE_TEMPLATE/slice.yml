name: 切片（Slice）
description: 可独立验收的最小交付单元：1 个切片 = 1 个 Issue = 1 个分支 = 1 个 PR
title: "[E<n>-S<k>] "
labels: ["type/task", "role/dev"]
body:
  - type: markdown
    attributes:
      value: |
        **DoR 五项必须全部填满才可以从 `Backlog` 进入 `Ready`**（见 `docs/GOVERNANCE.md` §DoR）。
        切片粒度：1~3 个工作日、单个 PR 可评审、可独立回滚。

  - type: input
    id: parent_epic
    attributes:
      label: 父 Epic
      description: 该切片所属 Epic 的 Issue 编号（用 sub-issue 关系挂接，不要只写编号）
      placeholder: "#1"
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: ① 价值
      description: 一句话说明这个切片交付什么价值。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: ② 验收标准
      description: 可判定条目（Given/When/Then 或等价）。禁止"优化一下""完善体验"。
      placeholder: |
        - [ ] Given … When … Then …
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: ③ 边界（明确不改什么）
      description: 列出本次改动不涉及的模块/行为，供评审人核对是否越界。
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: ④ 依赖与契约
      description: 阻塞项（建成 blocked by 关系）、已冻结的接口/契约、需要的权限或密钥
      placeholder: |
        - blocked by #3
        - 需要 project scope
    validations:
      required: true

  - type: textarea
    id: estimate
    attributes:
      label: ⑤ 估算与归属
      description: Size 估值（1/2/3/5/8）、执行者、目标日期
      placeholder: |
        Size: 3（约 1 天）
        执行者: @@OWNER_MENTION@@
        目标: 2026-10-08
    validations:
      required: true

  - type: textarea
    id: evidence_plan
    attributes:
      label: 验收证据计划
      description: 打算用什么证明"做完了"？（命令、测试名、截图、日志）PR 正文里的验收证据必须与此对应。
    validations:
      required: true

  - type: checkboxes
    id: dor_check
    attributes:
      label: DoR 自查
      options:
        - label: 五项规定内容全部填写
          required: true
        - label: 已确认它不需要再拆成多个切片
          required: true
        - label: 已确认它可独立回滚（不依赖其他未合并切片）
          required: true

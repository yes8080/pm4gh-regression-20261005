# qa/acceptance —— 验收**审计**检查（独立工作流，**非必需检查**）
#
# ⚠️ 重要定位变更（Bug #13，2026-10-04 实测）：本检查**故意不进入规则集的必需清单**。
#
#   原因：必需状态检查一旦在某个 SHA 上留下**失败结论**，后续同名检查通过也**无法**解除阻塞
#   （已用两个决定性实验确认：关闭 require_code_owner_review 仍 BLOCKED；移除本必需项后立刻可合并）。
#   而验收判据在 PR 打开时**必然先失败**（此时尚无批准），批准后复检才通过 —— 这种
#   "先失败后通过"模式与必需检查机制根本冲突，会导致**每个 PR 永久 BLOCKED**。
#
#   因此验收的机器门禁回归官方原生规则（见 .github/rulesets/main-protection.json 的 pull_request）：
#     · required_approving_review_count: 1
#     · require_last_push_approval: true
#     · dismiss_stale_reviews_on_push: true
#   本工作流保留为**审计证据**：在 PR 上如实显示"是否已有授权非作者身份的批准"，
#   失败时不影响合并，但会留下可见记录，供 W7/W8 与工具切换演练核对。
#
# 其他两条设计约束（仍然成立）：
#   1. 判据是"授权非作者身份的 APPROVED 评审"而不是 `/accept` 评论 —— 官方：
#      `issue_comment` 触发的 job 不满足必需检查，评论无法作为机器判据；`/accept` 保留为人工审计证据。
#   2. 拆成独立工作流：否则每次评审提交都会把 ci/*、policy/* 全部重跑（Actions 分钟数浪费）。
#
# 未来扩项提醒：若启用 Merge Queue（官方门控：私有仓库需 GitHub Enterprise Cloud），
# 必须把本 job 接入 `merge_group` 事件，否则合并队列会因必需检查未上报而永久卡住。

name: acceptance-check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: acceptance-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: qa/acceptance
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: 存在授权非作者身份的 APPROVED 评审
        run: |
          set -euo pipefail
          PR='${{ github.event.pull_request.number }}'
          REPO='${{ github.repository }}'
          author='${{ github.event.pull_request.user.login }}'
          gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '.[] | select(.state=="APPROVED") | .user.login' | sort -u > /tmp/approved.txt || true
          echo "已批准身份："; cat /tmp/approved.txt || true
          allow="$(grep -vE '^[[:space:]]*(#|$)' @@KIT_GOVERNANCE_DIR@@/authorized-identities.txt || true)"
          ok=0
          while IFS= read -r who; do
            [ -n "$who" ] || continue
            if [ "$who" = "$author" ]; then
              echo "跳过：${who} 是 PR 作者本人（自我批准不构成独立验收）"
              continue
            fi
            if grep -qx "$who" /tmp/approved.txt; then
              echo "✅ 验收人：${who}（作者：${author}，身份独立）"
              ok=1
            fi
          done <<< "$allow"
          if [ "$ok" != 1 ]; then
            echo "::error::尚无授权独立身份提交 APPROVED 评审。官方限制：issue_comment 触发的检查不满足必需检查，/accept 评论无法作为机器判据；请由 @@KIT_GOVERNANCE_DIR@@/authorized-identities.txt 中的身份执行 gh pr review <n> --approve。"
            exit 1
          fi

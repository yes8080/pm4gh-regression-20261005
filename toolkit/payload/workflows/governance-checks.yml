# 必需状态检查（机器门禁）
#
# 为什么存在本文件（官方限制，见 docs/项目管理方案.md §1.2.1 / §8）：
#   个人 Pro 的规则集**无法**表达以下规范，只能落成"必需状态检查"：
#     · 强制分支命名 / 提交信息格式 → 属 Enterprise 的提交元数据限制
#     · "PR 必须关联 Issue" → GitHub 没有任何原生规则或分支保护选项
#     · 验收记录 → 无原生门禁
#
# 三条必须遵守的官方约束（违反会让 PR 永久卡死）：
#   1. 必需检查的 context 等于 **job 的 name**（不是 workflow 名、不是 job id）→ 下方 name 精确写死，
#      一旦被规则集引用为必需项就**不得改名**（改名会让所有 PR 永久 pending）。
#   2. 必需检查的工作流**不得**配置 paths / branches 过滤：被跳过的工作流，其检查会永久 pending。
#   3. `issue_comment` 触发的检查**不满足**必需检查 —— 官方仅认可由 push / pull_request /
#      pull_request_review / pull_request_target / deployment / deployment_status（合并队列再加
#      merge_group）触发的 job。
#
# 分工：本工作流（命名空间：.github/workflows/governance-*.yml）只在 pull_request / merge_group 上跑"静态门禁"（ci/* 与 policy/*）。
# 需要在评审后复检的 `qa/acceptance` **拆到 acceptance-check.yml**，避免每次提交评审
# 都把 5 个必需检查 job 全部重跑（Actions 分钟数浪费，见方案 §13 风险表）。
# 注：D5 后 qa/acceptance 已降级为非必需审计检查并拆到 acceptance-check.yml，故本文件为 5 个 job。

name: governance-checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: governance-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ci/lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 脚本语法与 bash 3.2 兼容性
        run: |
          set -euo pipefail
          # 覆盖面 = **全部被跟踪的 shell 脚本**（Bug #51）：早期只 glob `scripts/*.sh`，
          # toolkit/*.sh、toolkit/tests/*.sh 的 bash 3.2 兼容性完全没被检查（等于静默漏检）。
          # 改用 git ls-files（与下方「JSON 文件有效性」同一惯例）后，新增脚本目录无需再改本文件。
          files=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            files[${#files[@]}]="$f"
          done < <(git ls-files '*.sh')
          # 覆盖面补强：不带 .sh、但**以 bash/sh shebang 开头**的被跟踪文件（例如套件 CLI 门面
          # `toolkit/governance`）也必须进覆盖面。否则这类脚本会完全逃过语法与 bash 3.2 检查 ——
          # 又一次"覆盖面静默为空"（与 #61 F2/F3 同型的形态）。
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in *.sh) continue ;; esac
            [ -f "$f" ] || continue
            head -n 1 "$f" 2>/dev/null | grep -qE '^#!.*(bash|/sh)([[:space:]]|$)' || continue
            files[${#files[@]}]="$f"
          done < <(git ls-files)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::git ls-files '*.sh' 未返回任何脚本 —— 覆盖面为空，检查形同虚设"
            exit 1
          fi
          fail=0

          # 1) bash 语法
          for f in "${files[@]}"; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash 语法错误"
              fail=1
            fi
          done

          # 2) 只检查**代码行**：注释里出现这些字样是允许的
          #    （本仓库的脚本注释正是用它们来说明为什么禁用）
          #    注意必须用 -H 强制输出文件名前缀，否则只有一个文件时输出为 "行号:内容"，
          #    下面的剥离逻辑会失效，导致注释行被误判为违规（本 PR 首次 CI 就是这样假失败的）。
          code_hits() {
            grep -nHP "$1" "${files[@]}" 2>/dev/null | awk -F: '{
              c = $0
              sub(/^[^:]*:[0-9]+:/, "", c)
              if (c !~ /^[[:space:]]*#/) print $0
            }' || true
          }

          h1="$(code_hits '\b(mapfile|readarray)\b|declare[[:space:]]+-A|\$\{[A-Za-z_][A-Za-z0-9_]*(,,|\^\^)')"
          if [ -n "$h1" ]; then
            printf '%s\n' "$h1"
            echo "::error::脚本使用了 bash 4 特性（mapfile / readarray / declare -A / \${var,,}）。macOS 自带 bash 3.2 会直接失败，违背『换台机器也能跑』。"
            fail=1
          fi

          h2="$(code_hits '\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]')"
          if [ -n "$h2" ]; then
            printf '%s\n' "$h2"
            echo "::error::检测到『\$VAR 紧跟非 ASCII 字符』。bash 3.2 会把多字节字节序列并入变量名 → unbound variable（本项目已实际踩到两次）。请写成 \${VAR}。"
            fail=1
          fi

          [ "$fail" = 0 ] && echo "✅ 脚本语法与 bash 3.2 兼容性通过"
          exit $fail
      - name: JSON 文件有效性
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! jq -e . "$f" >/dev/null; then
              echo "::error file=$f::非法 JSON"
              fail=1
            fi
          done < <(git ls-files '*.json')
          [ "$fail" = 0 ] && echo "✅ JSON 全部有效"
          exit $fail

  test:
    name: ci/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 标签定义可解析且格式正确（缺失资产必须显式失败）
        run: |
          set -euo pipefail
          # Bug #61 F2 + F3（P0）的修复点。旧写法：
          #     bash scripts/sync-labels.sh --dry-run | tail -1
          # 两个缺陷：
          #   ① F2：引用宿主仓库私有的、**既不在 manifest 登记也不被安装**的脚本；
          #      目标仓库里没有它 → 步骤"看起来在跑"其实什么都没验。
          #   ② F3：Actions 的 run shell 是 `bash -e {0}`（**无 pipefail**），管道退出码取最后一个
          #      命令（tail = 0）→ 脚本缺失（127）也**退出码 0 = 假绿**。
          # 修复：解析器移入套件（toolkit/scripts/labels.sh，manifest 的 objects.kit 已登记、
          # install.sh 随套件安装）+ 显式存在性守卫 + **去掉管道**（无管道即无假绿空间）。
          f=@@KIT_GOVERNANCE_DIR@@/labels.yml
          p=@@KIT_ROOT@@/scripts/labels.sh
          if [ ! -f "$f" ]; then
            echo "::error file=$f::标签定义文件缺失 —— 套件未安装或已被卸载；本步骤拒绝静默按通过处理"
            exit 1
          fi
          if [ ! -f "$p" ]; then
            echo "::error file=$p::套件资产缺失（manifest 的 objects.kit 未登记或 install.sh 未执行）—— 该步骤必须显式失败，不得静默跳过"
            exit 1
          fi
          bash "$p" --check "$f"
      - name: 规则集不变量（目标分支不得用通配符）
        run: |
          set -euo pipefail
          f=@@RULESET_DECL_PATH@@
          jq -e . "$f" >/dev/null
          ok=1
          while IFS= read -r pat; do
            [ -n "$pat" ] || continue
            if [ "$pat" != "~DEFAULT_BRANCH" ]; then
              echo "::error file=$f::目标分支应为 ~DEFAULT_BRANCH，当前为 '$pat'"
              ok=0
            fi
          done < <(jq -r '.conditions.ref_name.include[]' "$f")
          if jq -r '.conditions.ref_name.include[]' "$f" | grep -q '\*'; then
            echo "::error file=$f::目标含通配符 * —— 官方明确：分支保护/仓库规则可能阻止『自动删除头分支』"
            ok=0
          fi
          [ "$ok" = 1 ] || exit 1
          echo "✅ 规则集目标为 ~DEFAULT_BRANCH 且无通配符"
      - name: 代码责任人包含两个独立身份
        run: |
          set -euo pipefail
          ids="@@CODE_OWNER_IDS@@"
          if [ -z "$ids" ]; then
            echo "✅ 采用者侧不启用 code-owner 评审（NFR-17：套件不改写用户 CODEOWNERS；规则集 require_code_owner_review=false）—— 本项无需检查"
            exit 0
          fi
          for id in $ids; do
            grep -q -- "$id" @@CODEOWNERS_PATH@@ || { echo "::error file=@@CODEOWNERS_PATH@@::缺少 $id"; exit 1; }
          done
          echo "✅ CODEOWNERS 含主身份与评审身份"
      - name: PR 模板六段齐备
        run: |
          set -euo pipefail
          n="$(grep -cE '^## [1-6]\.' .github/PULL_REQUEST_TEMPLATE.md || true)"
          if [ "$n" -ne 6 ]; then
            echo "::error file=.github/PULL_REQUEST_TEMPLATE.md::需要 6 段（摘要/影响面/回滚/验收证据/DoD 自查/风险），当前 $n"
            exit 1
          fi
          echo "✅ PR 模板六段齐备"
      - name: 授权评审身份清单有效且不含作者
        run: |
          set -euo pipefail
          f=@@KIT_GOVERNANCE_DIR@@/authorized-identities.txt
          [ -s "$f" ] || { echo "::error file=$f::授权身份清单为空"; exit 1; }
          grep -vE '^[[:space:]]*(#|$)' "$f" | grep -q . || { echo "::error file=$f::清单里没有任何身份"; exit 1; }
          if grep -vE '^[[:space:]]*(#|$)' "$f" | grep -qx '@@OWNER@@'; then
            echo "::error file=$f::作者本人不得进入授权验收身份清单（否则可自我验收，门禁失效）"
            exit 1
          fi
          echo "✅ 授权身份清单有效：$(grep -vE '^[[:space:]]*(#|$)' "$f" | tr '\n' ' ')"
      - name: 状态标签合法且互斥（开放 Issue 至多一个 status/*）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO='${{ github.repository }}'
          # 决策 D9：Projects 已移除，状态由 status/* 标签承载 —— 标签的唯一性就是状态机的完整性
          allowed="status/ready status/in-progress status/in-review status/acceptance status/rework"
          gh issue list -R "$REPO" --state open --limit 200 --json number,labels \
            --jq '.[] | "\(.number)\t\([.labels[].name | select(startswith("status/"))] | join(","))"' > /tmp/status-labels.tsv
          bad=0
          while IFS="$(printf '\t')" read -r n labels; do
            [ -n "$n" ] || continue
            cnt=0
            if [ -n "$labels" ]; then cnt="$(printf '%s' "$labels" | tr ',' '\n' | grep -c . || true)"; fi
            if [ "$cnt" -gt 1 ]; then
              echo "::error::Issue #${n} 有多个状态标签（${labels}）—— 状态必须唯一，用 scripts/status.sh 修正"
              bad=1
              continue
            fi
            if [ "$cnt" -eq 1 ]; then
              case " ${allowed} " in
                *" ${labels} "*) : ;;
                *) echo "::error::Issue #${n} 使用了未定义的状态标签 ${labels}"; bad=1 ;;
              esac
            fi
          done < /tmp/status-labels.tsv
          [ "$bad" = 0 ] || exit 1
          echo "✅ 状态标签合法且互斥"

      - name: toolkit 自检（install/eject 语义：存在即执行、缺失即失败）
        run: |
          set -euo pipefail
          # 契约（Issue #57）：
          #   ① 存在即执行 —— 该步骤真实跑 toolkit/tests/self-test.sh，失败即本门禁失败，
          #      **不得**用 `|| true` / 静默跳过把它吞掉（失败案例库头号主因：
          #      「全绿测试掩盖缺陷」—— pm4java-v3 S03.01 删掉一条断言后 summary 仍 27/27 PASS）。
          #   ② 缺失即失败 —— 脚本被删除或改名时**报错退出**，绝不当作"没找到就跳过"；
          #      否则覆盖面会被静默清零，门禁看起来仍是绿的。
          # 断言条数会随切片增长，故不写死在步骤名里（避免文档/名称漂移），运行时打印实际值。
          f=@@KIT_ROOT@@/tests/self-test.sh
          if [ ! -f "$f" ]; then
            echo "::error file=$f::toolkit 自检脚本不存在（被删除或改名？）—— 它属于必需检查 ci/test 的覆盖面，不得为空"
            exit 1
          fi
          out=""; rc=0
          out="$(bash "$f" 2>&1)" || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error file=$f::toolkit 自检失败（退出码 ${rc}）—— 详见上方 [FAIL] 行"
            exit 1
          fi
          # 反"空跑"护栏：退出 0 但连汇总行都没有 → 视为未真正执行（例如脚本被换成 `exit 0`）
          if ! printf '%s' "$out" | grep -qE 'PASS=[0-9]+ FAIL=[0-9]+'; then
            echo "::error file=$f::toolkit 自检未输出 PASS=/FAIL= 汇总行 —— 视为未真正执行"
            exit 1
          fi
          printf '✅ toolkit 自检通过：%s\n' "$(printf '%s' "$out" | grep -oE 'PASS=[0-9]+ FAIL=[0-9]+' | tail -1)"
      - name: 套件不变量（门禁自包含 / 命名空间 / 不覆盖用户 CODEOWNERS / 门禁覆盖）
        run: |
          set -euo pipefail
          # Issue #69 S-A 的机器断言（与 payload 同一步骤，仅路径不同）：
          #   · 不变量 B「门禁自包含」：payload 引用集 ⊆ 安装集（NFR-07 / AC-06；
          #     S3 的 F2 就是"装出去的必需检查引用了未安装的资产"）
          #   · 命名空间归属：受管对象必须在 .github/governance/** / governance-*.yml /
          #     gov/ / governance-* 里，豁免必须逐条写理由
          #   · 不装不可满足的门禁：套件不改写采用者 CODEOWNERS → 规则集不得开 code-owner 评审
          #   · 门禁覆盖：规则集里的必需检查必须都有受管 workflow 的 job（否则永久 pending）
          # 缺失即失败（不得静默跳过；失败案例库头号主因：全绿掩盖缺陷）
          f=@@KIT_ROOT@@/scripts/check-invariants.sh
          if [ ! -f "$f" ]; then
            echo "::error file=$f::不变量检查脚本不存在（被删除或改名？）—— 它属于必需检查 ci/test 的覆盖面"
            exit 1
          fi
          bash "$f" --check invariant-b --check namespace --check codeowners --check gates
      - name: 未提交任何凭据
        run: |
          set -euo pipefail
          if git grep -nE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ; then
            echo "::error::检测到疑似凭据被提交进仓库"
            exit 1
          fi
          echo "✅ 未发现凭据"
      - name: 每个必需检查都有对应的工作流 job
        run: |
          set -euo pipefail
          # 官方：必需检查一旦被规则集引用，**改名会让所有 PR 永久 pending**。
          # 因此不变量是：规则集里的每个 required context 都必须在某个工作流里存在同名 job。
          #
          # 注意方向是**子集**（必需项 ⊆ 工作流 job 名），不是相等：
          # qa/acceptance 是有意保留的**非必需审计检查**（见 Bug #13 —— 必需检查不能采用
          # "先失败后通过"模式），因此它出现在工作流里但不进必需清单。
          wf="$(grep -hE '^[[:space:]]+name: (ci|policy|qa)/' @@WORKFLOWS_GLOB@@ | sed 's/.*name: //' | sort -u)"
          rs="$(jq -r '.rules[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context' @@RULESET_DECL_PATH@@ | sort -u)"
          missing="$(comm -23 <(printf '%s\n' "$rs") <(printf '%s\n' "$wf"))"
          if [ -n "$missing" ]; then
            echo "::error::以下必需检查在规则集里被引用，但没有任何工作流 job 会产生它 —— 这会让所有 PR 永久 pending："
            printf '  %s\n' "$missing"
            echo "--- 工作流可见的检查名 ---"; printf '%s\n' "$wf"
            exit 1
          fi
          printf '✅ 规则集引用的必需检查全部有对应 job：%s\n' "$(printf '%s' "$rs" | tr '\n' ' ')"

  linked-issue:
    name: policy/linked-issue
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: PR 必须关联同仓库 Issue
        run: |
          set -euo pipefail
          PR='${{ github.event.pull_request.number }}'
          REPO='${{ github.repository }}'
          body="$(gh pr view "$PR" -R "$REPO" --json body --jq .body)"
          if ! printf '%s' "$body" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*#[0-9]+'; then
            echo "::error::PR 正文缺少关闭关键字（例如 Closes #12）。官方限制：关键字只在 PR **正文或提交信息**中生效，**PR 标题无效**。"
            exit 1
          fi
          refs="$(gh pr view "$PR" -R "$REPO" --json closingIssuesReferences --jq '[.closingIssuesReferences[].number] | join(",")')"
          if [ -z "$refs" ]; then
            echo "::error::GitHub 未解析出关闭关系。官方限制：关闭关键字**只在 PR 目标是仓库默认分支时**才被解析，其他目标分支会被完全忽略。"
            exit 1
          fi
          echo "✅ 关联 Issue：#$refs"

  branch-name:
    name: policy/branch-name
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 分支命名符合规范且指向存在的 Issue
        run: |
          set -euo pipefail
          REPO='${{ github.repository }}'
          head='${{ github.event.pull_request.head.ref }}'
          if [[ ! "$head" =~ ^(slice|fix|hotfix|spike|chore)/[0-9]+-[a-z0-9-]+$ ]]; then
            echo "::error::分支名 '$head' 不符合 <type>/<issue#>-<slug>；type ∈ {slice,fix,hotfix,spike,chore}，slug 只允许小写字母、数字、连字符"
            exit 1
          fi
          num="${head#*/}"; num="${num%%-*}"
          state="$(gh issue view "$num" -R "$REPO" --json state --jq .state)"
          echo "分支指向 Issue #${num}（state=${state}）"
          if [ "$state" != "OPEN" ]; then
            echo "::error::Issue #${num} 已关闭，不应对它再开新 PR（若是返修，请重开原 Issue 或新建 Bug Issue）"
            exit 1
          fi
          # 状态机闸门（决策 D9，对应方案 §5 第 8 条）：必须已进入状态机（至少一个 status/* 标签），
          # 不能从 Backlog 直接开 PR —— 否则 DoR 形同虚设
          slabel="$(gh issue view "$num" -R "$REPO" --json labels \
            --jq '[.labels[].name | select(startswith("status/"))] | length')"
          if [ "$slabel" -eq 0 ]; then
            echo "::error::Issue #${num} 处于 Backlog（无 status/* 标签）。请先进入状态机：scripts/status.sh ${num} ready 或 in-progress，再由 scripts/start.sh 开工"
            exit 1
          fi
          echo "✅ 分支命名合规；Issue #${num} 处于 OPEN 且已进入状态机"

  template:
    name: policy/template
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: PR 正文按模板六段填写
        run: |
          set -euo pipefail
          PR='${{ github.event.pull_request.number }}'
          REPO='${{ github.repository }}'
          gh pr view "$PR" -R "$REPO" --json body --jq .body > /tmp/pr-body.md
          ok=1
          for i in 1 2 3 4 5 6; do
            if ! grep -qE "^## ${i}\." /tmp/pr-body.md; then
              echo "::error::缺少第 ${i} 节 —— 请使用 .github/PULL_REQUEST_TEMPLATE.md 的六段结构（1.变更摘要 2.影响面 3.回滚方式 4.验收证据 5.DoD自查 6.风险与破坏性变更）"
              ok=0
            fi
          done
          [ "$ok" = 1 ] || exit 1
          echo "✅ 六段齐备"


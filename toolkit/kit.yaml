# kit.yaml —— 可移植治理套件的出厂声明（Issue #69 / E2-S-A）
#
# 本文件由人维护、进版本库、可 diff；运行时**只读**。
# 解析器：toolkit/scripts/yaml2json.py（严格 YAML 子集；不支持的构造一律报错，不猜测）。
# 「实际创建了什么」写在 <root>/.git/governance-ledger.json（不进版本库）。

declaration_version: 2
kit:
  name: "portable-governance-toolkit"
  version: "0.3.0"
  slice: "E2-S-A"
  declaration: "kit.yaml"
  description: "可移植治理套件的**出厂声明**（进版本库、可审计、可 diff）：只定义「本套件管什么」（受管对象清单、命名空间、参数占位符、卸载语义）。它必须与目标仓库无关，因此运行时**绝不被写入** —— 「本次安装实际创建了什么」属于运行时状态，一律写进 ledger（见本文件的 ledger 段）。"
namespace:
  why: "每个由套件创建的对象都必须能**自证归属**，不依赖 ledger（设计 #68 §2.2，依据 Kubernetes ownerReferences）。这样「ledger 丢失」只丢历史细节，不丢卸载能力。"
  managed_files: ".github/governance/"
  managed_workflows: ".github/workflows/governance-"
  ownership_labels: "gov/"
  managed_rulesets: "governance-"
  file_exemptions:
    - path: ".github/ISSUE_TEMPLATE/"
      reason: "GitHub 只从固定的 .github/ISSUE_TEMPLATE/ 读取 Issue 模板，官方无配置项可改路径 —— 属**平台强制路径**，无法纳入命名空间。"
    - path: ".github/PULL_REQUEST_TEMPLATE.md"
      reason: "GitHub 只从固定的 .github/PULL_REQUEST_TEMPLATE.md 读取 PR 模板，同上。"
  label_exemptions:
    - prefix: "status/"
      reason: "状态机契约（GOVERNANCE §4 / 决策 D9）：状态唯一源就是 status/* 标签，改名会让 ci/test 的「状态标签合法且互斥」与 policy/branch-name 的状态机闸门同时失效。"
    - prefix: "type/"
      reason: "Issue 模板（.github/ISSUE_TEMPLATE/**）按名字引用这些标签；改名属治理变更，不在 S-A 范围。"
    - prefix: "role/"
      reason: "同上：套件流程契约标签，被 Issue 模板与分支策略引用。"
    - prefix: "area/"
      reason: "同上：套件流程契约标签。"
    - prefix: "prio/"
      reason: "同上：正交维度标签（决策 D9 后由标签承载 Priority）。"
    - prefix: "size/"
      reason: "同上：正交维度标签（决策 D9 后由标签承载 Size）。"
    - prefix: "src/"
      reason: "度量口径契约（GOVERNANCE §8 返修率分子 = 带 src/rework 的 Issue）。"
    - prefix: "risk/"
      reason: "同上：套件流程契约标签。"
  label_exemption_note: "**这是对设计 P-5「标签 gov/」的显式偏离**：流程契约标签保持原名（改名会同时破坏状态机、Issue 模板与度量口径，属治理变更）。`gov/` 命名空间对**套件自有的归属标记标签**生效；本切片结束时套件不新增任何此类标签，故 exemptions 覆盖全部受管标签。偏离已在本切片 PR 与 Issue #69 中如实登记，请 PM 追认。"
  ruleset_rationale: "规则集用 governance- 前缀（目标仓库内新建的规则集一律带前缀，自证归属）。**本套件源码仓库自身**的线上规则集名为 main-protection（建仓时创建，改名属**线上仓库设置变更**，须由 dispatcher 按 PLAYBOOK §9 实测执行，不在 AI 作者权限内），因此源码仓库自身的 .github/rulesets/main-protection.json 保持原名，与 payload 仅差 name 字段（由自检断言）。"
ledger:
  what: "安装器的**事务账**：记录本次安装/卸载对远端对象实际做了什么。它不是任务/状态账本（任务与状态仍只在 GitHub：status/* 标签 + Issue 开关 + Milestone），因此不违反 NFR-14。"
  path: "<root>/.git/governance-ledger.json"
  path_rationale: "放 .git/ 而不放版本库：① 状态混进分发物会直接弄红套件自带的 ci/test（Bug #60 实证 PASS=141 FAIL=13）；② ledger 必须在 `git clean -fdx` 下存活 —— gitignore 方案下它是未跟踪文件，会被一条常规清理命令抹掉。代价：它对人不被发现（既不在 git status 也不在任何 diff 里），因此**必须**提供 `governance ledger show` 读取命令与本文档说明。"
  env: "TOOLKIT_LEDGER"
  flag: "--ledger"
  read_command: "toolkit/governance ledger show"
  rebuild_command: "toolkit/governance ledger rebuild"
  phases:
    - name: "planned"
      meaning: "已登记创建意图（写前落账）。命令报错但对象其实已创建时，下次运行仍能正确归属（失败案例库 D6）。"
    - name: "observed"
      meaning: "每次运行**现读线上实况**，绝不用上一次运行的记账代替观测。"
    - name: "owned"
      meaning: "本套件创建或明确接管；pre_existing=true 表示装机前已存在（不覆盖、不接管、卸载时也不删）。"
  missing_is_error: "install.sh --check / eject.sh --check|--apply 在记账缺失时**明确报错**（退出码 2），绝不静默按「全部装机前已存在」处理（Bug #60 追加要求）；`governance ledger show` 会给出重建指引，`ledger rebuild` 用命名空间归属 + 出厂内容指纹重新 snapshot 线上对象来重建账本。"
  must_survive: "ledger 必须活过 `git clean -fdx`（这是选 <root>/.git/ 的硬理由，也是设计 #68 §2.1.1 的正面论证）。"
placeholders:
  why: "payload 内工作流引用的**具体安装路径**。写成占位符，本套件源码仓库自身的同名工作流写具体路径 —— 这样两处差异只有占位符（PLAYBOOK §4 的同步铁律），且不变量 B 能用本表把占位符解析回真实路径再断言 ⊆ 安装集。"
  KIT_ROOT: ".github/governance/kit"
  KIT_GOVERNANCE_DIR: ".github/governance"
  RULESET_DECL_PATH: ".github/governance/rulesets/governance-main-protection.json"
  CODEOWNERS_PATH: ".github/CODEOWNERS"
  WORKFLOWS_GLOB: ".github/workflows/governance-*.yml"
parameters:
  REPO:
    env: "REPO"
    flag: "--repo"
    detect: "gh repo view --json nameWithOwner"
    placeholder: "@@REPO@@"
    description: "目标仓库 owner/name（不得硬编码）"
  DEFAULT_BRANCH:
    env: "DEFAULT_BRANCH"
    flag: "--default-branch"
    detect: "gh repo view --json defaultBranchRef"
    placeholder: "@@DEFAULT_BRANCH@@"
    description: "默认分支名（不得硬编码）"
  OWNER:
    env: "OWNER"
    flag: "--owner"
    detect: "REPO 的 owner 部分"
    placeholder: "@@OWNER@@"
    description: "仓库 owner / 主身份账号（dispatcher）"
    placeholders:
      - "@@OWNER@@（裸登录名）"
      - "@@OWNER_MENTION@@（@登录名）"
  AUTHOR_ACCOUNT:
    env: "AUTHOR_ACCOUNT"
    flag: "--author-account"
    detect: "读取凭据文件对应身份（默认 .secrets/developer.pat）"
    placeholder: "@@AUTHOR_ACCOUNT@@"
    description: "作者身份账号（建分支/提交/开 PR；不参与评审）"
  REVIEWER_ACCOUNT:
    env: "REVIEWER_ACCOUNT"
    flag: "--reviewer-account"
    detect: "读取凭据文件对应身份（默认 .secrets/reviewer.pat）"
    placeholder: "@@REVIEWER_ACCOUNT@@"
    description: "独立评审/验收身份账号"
    placeholders:
      - "@@REVIEWER_ACCOUNT@@（裸登录名）"
      - "@@REVIEWER_MENTION@@（@登录名）"
  KIT_ROOT:
    env: "KIT_ROOT"
    flag: "--kit-root"
    detect: "套件安装位置（安装时的 objects.kit.path）"
    placeholder: "@@KIT_ROOT@@"
    description: "套件自身在目标仓库内的根目录（命名空间内），供装出来的工作流引用套件资产（避免 F2：必需检查引用未安装的资产）"
  KIT_GOVERNANCE_DIR:
    env: "KIT_GOVERNANCE_DIR"
    flag: "--kit-governance-dir"
    detect: "namespace.managed_files 去掉末尾斜杠"
    placeholder: "@@KIT_GOVERNANCE_DIR@@"
    description: "受管文件的命名空间目录（默认 .github/governance），供装出来的工作流引用受管数据文件（labels.yml / authorized-identities.txt）"
  CODE_OWNER_IDS:
    env: "CODE_OWNER_IDS"
    flag: "--code-owner-ids"
    detect: "默认空（采用者侧不使用 code-owner 评审：套件不改写用户 CODEOWNERS）"
    placeholder: "@@CODE_OWNER_IDS@@"
    description: "本套件源码仓库自身的 CODEOWNERS 身份清单；采用者侧留空 → 装出来的工作流打印「不启用 code-owner 评审」而不是去查用户文件（NFR-17）"
objects:
  files:
    description: "写入目标仓库的文件；template=true 时先按 parameters 做占位符替换（@@NAME@@）（路径一律落在 .github/governance/**，平台强制路径除外）"
    entries:
      - id: "file:.github/governance/labels.yml"
        path: ".github/governance/labels.yml"
        source: "payload/labels.yml"
        template: false
      - id: "file:.github/governance/rulesets/governance-main-protection.json"
        path: ".github/governance/rulesets/governance-main-protection.json"
        source: "payload/main-protection.json"
        template: false
        namespace: "规则集声明副本；规则集对象名 = governance-main-protection"
      - id: "file:.github/governance/authorized-identities.txt"
        path: ".github/governance/authorized-identities.txt"
        source: "payload/authorized-identities.txt"
        template: true
      - id: "file:.github/PULL_REQUEST_TEMPLATE.md"
        path: ".github/PULL_REQUEST_TEMPLATE.md"
        source: "payload/PULL_REQUEST_TEMPLATE.md"
        template: false
        namespace_exempt: "平台强制路径（见 namespace.file_exemptions）"
      - id: "file:.github/ISSUE_TEMPLATE/bug.yml"
        path: ".github/ISSUE_TEMPLATE/bug.yml"
        source: "payload/ISSUE_TEMPLATE/bug.yml"
        template: false
        namespace_exempt: "平台强制路径（见 namespace.file_exemptions）"
      - id: "file:.github/ISSUE_TEMPLATE/config.yml"
        path: ".github/ISSUE_TEMPLATE/config.yml"
        source: "payload/ISSUE_TEMPLATE/config.yml"
        template: true
        namespace_exempt: "平台强制路径（见 namespace.file_exemptions）"
      - id: "file:.github/ISSUE_TEMPLATE/epic.yml"
        path: ".github/ISSUE_TEMPLATE/epic.yml"
        source: "payload/ISSUE_TEMPLATE/epic.yml"
        template: false
        namespace_exempt: "平台强制路径（见 namespace.file_exemptions）"
      - id: "file:.github/ISSUE_TEMPLATE/rework.yml"
        path: ".github/ISSUE_TEMPLATE/rework.yml"
        source: "payload/ISSUE_TEMPLATE/rework.yml"
        template: false
        namespace_exempt: "平台强制路径（见 namespace.file_exemptions）"
      - id: "file:.github/ISSUE_TEMPLATE/slice.yml"
        path: ".github/ISSUE_TEMPLATE/slice.yml"
        source: "payload/ISSUE_TEMPLATE/slice.yml"
        template: true
        namespace_exempt: "平台强制路径（见 namespace.file_exemptions）"
      - id: "file:.github/ISSUE_TEMPLATE/spike.yml"
        path: ".github/ISSUE_TEMPLATE/spike.yml"
        source: "payload/ISSUE_TEMPLATE/spike.yml"
        template: false
        namespace_exempt: "平台强制路径（见 namespace.file_exemptions）"
  labels:
    description: "标签（值取自 source 的严格 name/color/description 三行格式）"
    source: "payload/labels.yml"
    entries:
      - id: "label:type/feature"
        name: "type/feature"
      - id: "label:type/task"
        name: "type/task"
      - id: "label:type/bug"
        name: "type/bug"
      - id: "label:type/spike"
        name: "type/spike"
      - id: "label:type/chore"
        name: "type/chore"
      - id: "label:type/hotfix"
        name: "type/hotfix"
      - id: "label:role/dev"
        name: "role/dev"
      - id: "label:role/review"
        name: "role/review"
      - id: "label:role/qa"
        name: "role/qa"
      - id: "label:role/release"
        name: "role/release"
      - id: "label:area/process"
        name: "area/process"
      - id: "label:area/ci"
        name: "area/ci"
      - id: "label:area/project"
        name: "area/project"
      - id: "label:area/docs"
        name: "area/docs"
      - id: "label:area/scripts"
        name: "area/scripts"
      - id: "label:src/rework"
        name: "src/rework"
      - id: "label:src/bug"
        name: "src/bug"
      - id: "label:src/tech-debt"
        name: "src/tech-debt"
      - id: "label:prio/P0"
        name: "prio/P0"
      - id: "label:prio/P1"
        name: "prio/P1"
      - id: "label:prio/P2"
        name: "prio/P2"
      - id: "label:prio/P3"
        name: "prio/P3"
      - id: "label:size/1"
        name: "size/1"
      - id: "label:size/2"
        name: "size/2"
      - id: "label:size/3"
        name: "size/3"
      - id: "label:size/5"
        name: "size/5"
      - id: "label:size/8"
        name: "size/8"
      - id: "label:status/ready"
        name: "status/ready"
      - id: "label:status/in-progress"
        name: "status/in-progress"
      - id: "label:status/in-review"
        name: "status/in-review"
      - id: "label:status/acceptance"
        name: "status/acceptance"
      - id: "label:status/rework"
        name: "status/rework"
      - id: "label:risk/breaking"
        name: "risk/breaking"
      - id: "label:risk/security"
        name: "risk/security"
      - id: "label:risk/data"
        name: "risk/data"
  rulesets:
    description: "仓库规则集（值取自 source；期望参数为 source 的子集，线上多出的平台默认字段只报告）；对象名带 governance- 前缀（命名空间归属）"
    entries:
      - id: "ruleset:governance-main-protection"
        name: "governance-main-protection"
        source: "payload/main-protection.json"
        logical_name: "main-protection"
  workflows:
    description: "工作流文件与其产生的检查名（checks 必须能在文件中找到同名 job，否则该必需检查会永久 pending）；文件路径一律落在 .github/workflows/governance-*.yml"
    entries:
      - id: "workflow:.github/workflows/governance-checks.yml"
        path: ".github/workflows/governance-checks.yml"
        source: "payload/workflows/governance-checks.yml"
        template: true
        checks:
          - "ci/lint"
          - "ci/test"
          - "policy/branch-name"
          - "policy/linked-issue"
          - "policy/template"
      - id: "workflow:.github/workflows/governance-acceptance.yml"
        path: ".github/workflows/governance-acceptance.yml"
        source: "payload/workflows/governance-acceptance.yml"
        template: true
        checks:
          - "qa/acceptance"
      - id: "workflow:.github/workflows/governance-state.yml"
        path: ".github/workflows/governance-state.yml"
        source: "payload/workflows/governance-state.yml"
        template: true
        checks:
          - "ci/state"
        why: "补「无 PR 时门禁停摆」缺口：5 项必需检查只在 pull_request/merge_group 触发，仓库里没有开放 PR 时**从不运行**，因此状态漂移（例如受管资产被删、命名空间被破坏）无人发现。本工作流在 push 到默认分支与 workflow_dispatch 上运行同一套不变量断言（非必需检查，不改变必需检查集合）。"
  collaborators:
    description: "协作者与权限（持久权限：卸载时须询问式处理，见 S2）"
    entries:
      - id: "collaborator:@@AUTHOR_ACCOUNT@@"
        account: "@@AUTHOR_ACCOUNT@@"
        permission: "push"
        role: "作者（建分支/提交/开 PR）"
      - id: "collaborator:@@REVIEWER_ACCOUNT@@"
        account: "@@REVIEWER_ACCOUNT@@"
        permission: "push"
        role: "独立评审/验收"
  kit:
    description: "套件自身的运行文件：整树装配进目标仓库的命名空间目录 .github/governance/kit/，使装出来的必需检查具备**自足覆盖面** —— ci/lint 需要至少一个被跟踪的 *.sh，ci/test 需要 <KIT_ROOT>/tests/self-test.sh 与 <KIT_ROOT>/scripts/labels.sh（Bug #61 F2：必需检查不得引用未安装的资产）。归属按整树指纹记录在 ledger；用户既有的同名文件不覆盖、不接管（冲突即报告）。"
    entries:
      - id: "kit:toolkit"
        path: ".github/governance/kit"
        source: "."
        required:
          - "kit.yaml"
          - "governance"
          - "install.sh"
          - "eject.sh"
          - "lib.sh"
          - "ledger.sh"
          - "scripts/labels.sh"
          - "scripts/check-invariants.sh"
          - "scripts/yaml2json.py"
          - "tests/self-test.sh"
          - "tests/stub-gh.sh"
        description: "套件根目录整树；required 列出的文件缺失即视为清单损坏（它们正是必需检查的依赖资产）"
report_only:
  description: "本套件**只报告、不写入**的对象。NFR-17：不得就地改写用户既有文件。"
  codeowners:
    what: "CODEOWNERS 建议行"
    rule: "CODEOWNERS 一律不改写（NFR-17 + 命名空间归属）；安装时把建议追加的行打印在报告里，由采用者自行决定。"
    suggested_lines:
      - "* @@OWNER_MENTION@@ @@REVIEWER_MENTION@@"
      - "/.github/ @@OWNER_MENTION@@ @@REVIEWER_MENTION@@"
      - "/docs/ @@OWNER_MENTION@@ @@REVIEWER_MENTION@@"
    why_not_write: "S3 演练的 F4（Bug #62）实证：CODEOWNERS 以**最后匹配**为准，追加 `*` 会静默覆盖用户更早的窄规则（例：`/legacy/ @owner`）—— 那正是 NFR-17 要防的「就地改写用户既有文件」。"
    require_code_owner_review: "因此采用者侧**不使用** require_code_owner_review（套件不能在别人的 CODEOWNERS 里登记自己，一旦开启即永久不可合并 —— 我们自己的 Bug #13 实证）。payload 规则集里该开关渲染为 false，由不变量检查断言二者一致。"
eject:
  description: "卸载语义（E2-S-A）：与 install 共用 toolkit/lib.sh 的归属/漂移判据；--dry-run/--check 零写入。"
  only_owned_and_undrifted: "只删 ledger 里 owned=true（或留有 create 意图）且内容/参数与期望一致的对象"
  drift_default_keep: "漂移对象默认保留并报告；显式 --force 才删（--apply 此时退出码 1 = 需人工决定）"
  collaborators_ask: "协作者属持久权限：默认保留 + 报告 + 打印手动撤销命令；只有显式 --revoke-collaborators 才撤销，绝不静默撤销"
  tombstone: "<root>/.git/governance-eject-tombstone.json（计划 + 装机前 baseline + 可恢复锚点）+ 同名 .oplog/.backup + …-record.md；任何删除之前写入，中断后重跑即续跑"
  resume: "续跑依据是每次重新读线上实况（不是上次运行的记账，D6）；baseline 沿用首次 tombstone 的，不重新打底"
  delete_order:
    - "kit"
    - "files"
    - "workflows"
    - "labels"
    - "rulesets"
    - "collaborators"
  admin_required:
    - "rulesets"
    - "collaborators"
  staged_uninstall:
    why: "Bug #60 追加要求：卸载必须先通过 PR 落地「受管文件 / workflow / 套件目录」，再删受管标签，**最后**才移除规则集与协作者 —— 否则卸载过程本身会制造一个无门禁窗口。"
    stage_1: "受管文件 / workflow / 套件目录（工作区）→ 由 PR 落地（此时规则集仍生效）"
    stage_2: "受管标签（平台对象，PR 合并后删，避免破坏 policy/branch-name 依赖的 status/* 标签）"
    stage_3: "规则集（门禁本体，最后删）"
    stage_4: "协作者（持久权限，询问式）"
    no_usable_gate: "若默认分支没有被任何规则集保护（或必需检查的输入正是被删除的对象）→ **显式报告**「本次卸载将在无门禁状态下推送」，不静默直推。"

name: 切片（Slice）
description: 可独立验收的最小交付单元：1 个切片 = 1 个 Issue = 1 个分支 = 1 个 PR
title: "[Slice] "
labels: ["type/task", "role/dev"]
body:
  - type: markdown
    attributes:
      value: |
        **DoR 五项全部填满，才可以从 Backlog 进入 `ready`。**
        判定与步骤见 `references/flow.md`（W1 领片）。
        粒度：单个 PR 可评审、可独立回滚、1~3 个工作日。

  - type: textarea
    attributes:
      label: ① 价值
      description: 一句话说明这个切片交付什么价值（不要写"完善体验""优化一下"）。
    validations:
      required: true

  - type: textarea
    attributes:
      label: ② 验收标准
      description: 可判定条目。PR 的第 4 节必须逐条给证据。
      placeholder: |
        - [ ] Given … When … Then …
    validations:
      required: true

  - type: textarea
    attributes:
      label: ③ 边界（明确不改什么）
      description: 列出本次不涉及的模块/行为，供评审人核对是否越界。
    validations:
      required: true

  - type: textarea
    attributes:
      label: ④ 依赖与契约
      description: 阻塞项（用 blocked by 关系建立）、已冻结的接口、需要的权限或凭据
      placeholder: |
        - blocked by #12
        - 需要作者凭据含 workflow scope
    validations:
      required: true

  - type: textarea
    attributes:
      label: ⑤ 估算与归属
      description: Size（1/2/3/5/8）、执行者、目标日期
      placeholder: |
        Size: 3（约 1 天）
        执行者: @yes8080-dev-bot
        目标: 2026-10-08
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: DoR 自查
      options:
        - label: 五项内容全部填写
          required: true
        - label: 已确认不需要再拆成多个切片
          required: true
        - label: 已确认可独立回滚（不依赖其他未合并切片）
          required: true

name: Bug（缺陷）
description: 缺陷同样走完整流程（Issue → 分支 → PR → 必需检查 → 评审 → 合并），禁止"口头修一下直接提交"
title: "[Bug] "
labels: ["type/bug", "role/dev"]
body:
  - type: markdown
    attributes:
      value: |
        **轨道判定（见 `docs/WORKFLOW.md` W1/W2）：**
        - 切片**尚未合并**时发现 → 不要建本 Issue，直接在原切片分支上按返修流程处理
        - 切片**已合并**后 → 建本 Issue，分支用 `fix/<issue#>-<slug>`
        - 线上故障 → 建本 Issue 并标 `prio/P0`，分支用 `hotfix/<issue#>-<slug>` 从 main 拉出
        - ⚠️ 下面的「轨道」下拉**不会**打 `type/hotfix` 标签（表单只能预置固定的 `labels:`）：线上故障请
          **手动**给 Issue 加 `type/hotfix`，开工一律用 `scripts/start.sh <issue#> --type hotfix --as author`；
          两者都漏时热修会静默退化成 `fix/`

  - type: dropdown
    attributes:
      label: 轨道
      options:
        - 开发期缺陷（已合并后新开 Issue）
        - 线上故障（Hotfix）
        - 依赖/安全扫描自动发现
    validations:
      required: true

  - type: dropdown
    attributes:
      label: 严重级别
      options:
        - P0 阻塞（线上不可用 / 数据风险）
        - P1 高（主流程受损，有临时绕过）
        - P2 中（局部受损）
        - P3 低（体验 / 文案）
    validations:
      required: true

  - type: textarea
    attributes:
      label: 复现步骤
      description: 从干净状态开始的确定性步骤，给出命令与输入
      placeholder: |
        1. …
        2. …
    validations:
      required: true

  - type: textarea
    attributes:
      label: 期望 vs 实际
      placeholder: |
        期望：
        实际：
    validations:
      required: true

  - type: input
    attributes:
      label: 影响版本 / 提交
      description: 首次出现的版本或 commit SHA，用于界定回归范围
    validations:
      required: true

  - type: textarea
    attributes:
      label: 证据
      description: 日志、失败检查名、运行链接、截图
    validations:
      required: true

  - type: textarea
    attributes:
      label: 回滚 / 临时缓解
      description: 线上故障必填：立即可用的缓解手段
    validations:
      required: false

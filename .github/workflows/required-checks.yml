name: required-checks

# ★ 本文件是仓库全部 **5 个必需状态检查**的唯一来源。硬约束（违反会让所有 PR 永久卡住）：
#   1. 每个 job 的 `name:` 就是必需检查的 context（官方：context = job 的 name，不是文件名、
#      不是 workflow 的 name）。一旦被规则集引用就**不得改名**。
#   2. 本文件**不得**配置 paths / branches 过滤：被跳过的工作流，其检查会永久 pending。
#   3. 只监听 pull_request —— 官方认可的必需检查事件之一（`issue_comment` 等不算）。
#   4. 不要在这里加"先失败后通过"的检查：必需检查一旦在某个 SHA 上留下失败结论，
#      后续同名检查通过也无法解除阻塞（见 references/traps.md 陷阱 1）。
#   5. 若将来启用 Merge Queue，必须同时给这 5 个 job 接上 merge_group 事件。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: required-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: ci/lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 脚本语法 + bash 3.2 兼容性（覆盖全部被跟踪脚本）
        run: |
          set -euo pipefail
          # 覆盖面 = **全部被跟踪的 shell 脚本**（*.sh 与带 bash/sh shebang 的文件）。
          # 用 git ls-files 而不是 glob：新增脚本目录无需改本文件，也不会静默漏检。
          list=/tmp/tracked-scripts.txt
          : > "$list"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ ! -f "$f" ]; then continue; fi
            case "$f" in
              *.sh) printf '%s\n' "$f" >> "$list" ;;
              *)
                if grep -qE '^#!.*(bash|/sh)([[:space:]]|$)' <<<"$(head -n 1 "$f" 2>/dev/null)"; then
                  printf '%s\n' "$f" >> "$list"
                fi
                ;;
            esac
          done < <(git ls-files)
          sort -u "$list" -o "$list"
          if [ ! -s "$list" ]; then
            echo "::error::git ls-files 没有产出任何脚本 —— 覆盖面为空，检查形同虚设"
            exit 1
          fi
          printf '覆盖脚本：\n'; cat "$list"
          fail=0
          # 1) bash 语法
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! bash -n "$f"; then
              echo "::error file=$f::bash 语法错误"
              fail=1
            fi
          done < "$list"
          # 2) bash 3.2 兼容性：只在**代码行**里查（注释行允许出现这些字样）
          files="$(tr '\n' ' ' < "$list")"
          code_hits() {
            grep -nHP "$1" $files 2>/dev/null | awk -F: '{
              c = $0
              sub(/^[^:]*:[0-9]+:/, "", c)
              if (c !~ /^[[:space:]]*#/) print $0
            }' || true
          }
          h1="$(code_hits '\b(mapfile|readarray)\b|declare[[:space:]]+-A|\$\{[A-Za-z_][A-Za-z0-9_]*(,,|\^\^)')"
          if [ -n "$h1" ]; then
            printf '%s\n' "$h1"
            echo "::error::使用了 bash 4 特性（mapfile / readarray / declare -A / 变量大小写改写）。macOS 自带 bash 3.2 会直接失败。"
            fail=1
          fi
          h2="$(code_hits '\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]')"
          if [ -n "$h2" ]; then
            printf '%s\n' "$h2"
            echo "::error::检测到「\$VAR 紧跟非 ASCII 字符」：bash 3.2 会把多字节序列并入变量名 → unbound variable。请写成 \${VAR}。"
            fail=1
          fi
          if [ "$fail" = 0 ]; then echo "✅ 脚本语法与 bash 3.2 兼容性通过"; fi
          exit "$fail"
      - name: JSON 文件有效性
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! jq -e . "$f" >/dev/null; then
              echo "::error file=$f::非法 JSON"
              fail=1
            fi
          done <<EOF
          $(git ls-files '*.json')
          EOF
          if [ "$fail" = 0 ]; then echo "✅ JSON 全部有效"; fi
          exit "$fail"

  test:
    name: ci/test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: 选择唯一 skill 入口与 CI 临时治理视图
        run: |
          set -euo pipefail
          count=0
          skill_root=""
          for candidate in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.agents/skills/pm4gh"; do
            if [ -f "$candidate/SKILL.md" ]; then
              count=$((count + 1)); skill_root="$candidate"
            fi
          done
          [ "$count" -eq 1 ] || { echo "::error::需要且仅允许一个 pm4gh skill 入口，实际 $count"; exit 1; }
          for script in preflight start status deliver review closeout abort; do
            [ -x "$skill_root/scripts/$script.sh" ] || { echo "::error::缺少可执行 skill 脚本 $script"; exit 1; }
          done
          if [ "$skill_root" != "$GITHUB_WORKSPACE" ]; then
            # CI-only view: no tracked governance copy inside the installed skill.
            [ ! -e "$skill_root/.github" ] && [ ! -L "$skill_root/.github" ] || { echo "::error::skill 目录不能包含重复 .github 治理"; exit 1; }
            ln -s "$GITHUB_WORKSPACE/.github" "$skill_root/.github"
          fi
          printf 'PM4GH_SKILL_ROOT=%s\n' "$skill_root" >> "$GITHUB_ENV"
          printf 'Skill root: %s; project root: %s\n' "$skill_root" "$GITHUB_WORKSPACE"
      - name: 必需检查的 5 个 context 与工作流 job 名精确一致
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          # 官方：必需检查的 context = job 的 name；改名 = 所有 PR 永久 pending。
          # 所以这里要求三方**集合相等**（不是子集）：工作流产出的检查名 == 规则集引用集 == 这 5 个字面量。
          rs=.github/rulesets/main-protection.json
          expected="$(printf '%s\n' ci/lint ci/test policy/linked-issue policy/branch-name policy/template | sort -u)"
          wf="$(grep -hE '^[[:space:]]+name: (ci|policy)/' .github/workflows/*.yml \
            | sed -E 's/^[[:space:]]*name:[[:space:]]*//' | sort -u)"
          got="$(jq -r '.rules[]|select(.type=="required_status_checks")|.parameters.required_status_checks[].context' "$rs" | sort -u)"
          bad=0
          if [ "$wf" != "$expected" ]; then
            echo "::error file=$rs::工作流产出的检查名与 5 个必需 context 不一致"
            bad=1
          fi
          if [ "$got" != "$expected" ]; then
            echo "::error file=$rs::规则集引用的必需 context 与 5 个必需 context 不一致"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then
            echo "--- 期望 ---"; printf '%s\n' "$expected"
            echo "--- 工作流实际 ---"; printf '%s\n' "$wf"
            echo "--- 规则集实际 ---"; printf '%s\n' "$got"
            exit 1
          fi
          echo "✅ 5 个必需检查逐字一致：$(printf '%s' "$expected" | tr '\n' ' ')"
      - name: 规则集结构不变量
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          f=.github/rulesets/main-protection.json
          pr() { jq -r ".rules[]|select(.type==\"pull_request\")|.parameters.$1" "$f"; }
          bad=0
          if [ "$(jq -r .enforcement "$f")" != "active" ]; then echo "::error file=$f::enforcement 应为 active"; bad=1; fi
          if [ "$(jq -r '.bypass_actors|length' "$f")" != "0" ]; then echo "::error file=$f::bypass 名单必须为空（无人可绕过）"; bad=1; fi
          refs="$(jq -r '.conditions.ref_name.include[]' "$f")"
          if [ "$refs" != "~DEFAULT_BRANCH" ]; then echo "::error file=$f::目标分支必须只有 ~DEFAULT_BRANCH（当前：${refs}）"; bad=1; fi
          case "$refs" in *'*'*) echo "::error file=$f::目标含通配符 * —— 官方：会导致合并后无法自动删除头分支"; bad=1 ;; esac
          if [ "$(pr required_approving_review_count)" != "1" ]; then echo "::error file=$f::required_approving_review_count 应为 1"; bad=1; fi
          if [ "$(pr require_code_owner_review)" != "true" ]; then echo "::error file=$f::require_code_owner_review 应为 true（三身份隔离靠它）"; bad=1; fi
          if [ "$(pr require_last_push_approval)" != "true" ]; then echo "::error file=$f::require_last_push_approval 应为 true"; bad=1; fi
          if [ "$(pr require_extra_approval_for_unattributed_changes)" != "true" ]; then
            echo "::error file=$f::require_extra_approval_for_unattributed_changes 应为 true（线上真实值；含无法归属到 GitHub 身份的提交时需额外批准）"
            bad=1
          fi
          if [ "$(jq -rc '.rules[]|select(.type=="pull_request")|.parameters.required_reviewers' "$f")" != '[]' ]; then
            echo "::error file=$f::required_reviewers 应为 []（线上真实值：不指定具体评审人）"
            bad=1
          fi
          if [ "$(pr dismiss_stale_reviews_on_push)" != "true" ]; then echo "::error file=$f::dismiss_stale_reviews_on_push 应为 true"; bad=1; fi
          if [ "$(jq -rc '.rules[]|select(.type=="pull_request")|.parameters.allowed_merge_methods' "$f")" != '["squash"]' ]; then
            echo "::error file=$f::allowed_merge_methods 只能是 [\"squash\"]"
            bad=1
          fi
          if [ "$(jq -r '.rules[]|select(.type=="required_status_checks")|.parameters.strict_required_status_checks_policy' "$f")" != "true" ]; then
            echo "::error file=$f::strict_required_status_checks_policy 应为 true"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "✅ 规则集结构不变量通过"
      - name: 规则集全量 diff 判据唯一 + 文件全量键齐备（与 preflight.sh 同一判据）
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          sh=scripts/preflight.sh
          f=.github/rulesets/main-protection.json
          # 判据必须与 scripts/preflight.sh 里的 RULESET_CANON_JQ **逐字一致**：
          # preflight.sh 用它对线上规则集做整份 diff，这里断言不存在第二套实现。
          # 新增/删除线上键时，两个地方一起改（并同步下面的全量键集），这是有意的摩擦。
          # RULESET_CANON_JQ:BEGIN
          RULESET_CANON_JQ='def canon: with_entries(select(.key|startswith("_comment")|not)) | del(.id,.node_id,.source_type,.source,.created_at,.updated_at,.current_user_can_bypass,._links) | .conditions.ref_name.include = ((.conditions.ref_name.include // [])|sort) | .conditions.ref_name.exclude = ((.conditions.ref_name.exclude // [])|sort) | .bypass_actors = ((.bypass_actors // [])|sort_by(.actor_id|tostring)) | .rules = ((.rules // []) | map(if (.type == "required_status_checks" and .parameters) then .parameters.required_status_checks = ((.parameters.required_status_checks // [])|sort_by(.context)) else . end) | sort_by(.type)); canon'
          # RULESET_CANON_JQ:END
          sh_jq="$(sed -n '/RULESET_CANON_JQ:BEGIN/,/RULESET_CANON_JQ:END/p' "$sh" \
            | sed -e '1d' -e '$d' | tr -d '\n' \
            | sed -E "s/^[[:space:]]*RULESET_CANON_JQ='//; s/'[[:space:]]*\$//")"
          bad=0
          if [ -z "$sh_jq" ]; then
            echo "::error file=$sh::未能从 preflight.sh 解析出 RULESET_CANON_JQ 判据"
            bad=1
          elif [ "$sh_jq" != "$RULESET_CANON_JQ" ]; then
            echo "::error::preflight.sh 与 ci/test 的规则集比对判据不一致（必须逐字相同 —— 同一判据，不是两套实现）"
            echo "--- preflight.sh ---"; printf '%s\n' "$sh_jq"
            echo "--- ci/test ---"; printf '%s\n' "$RULESET_CANON_JQ"
            bad=1
          fi
          # 判据本身必须能规范化本文件（否则 preflight 在线上拿到的判据是坏的）
          if ! jq -S "$RULESET_CANON_JQ" "$f" > /tmp/ruleset-canon.json; then
            echo "::error file=$f::RULESET_CANON_JQ 无法规范化本文件"
            bad=1
          fi
          # 声明文件里不得混入服务端只读元数据（那是线上响应的一部分，不是声明）
          if jq -e 'has("id") or has("node_id") or has("source") or has("source_type") or has("created_at") or has("updated_at") or has("current_user_can_bypass") or has("_links")' "$f" >/dev/null; then
            echo "::error file=$f::出现服务端只读元数据键（id/node_id/source/source_type/created_at/updated_at/current_user_can_bypass/_links）"
            bad=1
          fi
          # 全量键：两处参数键集必须与线上全量键**精确相等**（多一个、少一个都报错）
          want_pr='allowed_merge_methods,dismiss_stale_reviews_on_push,require_code_owner_review,require_extra_approval_for_unattributed_changes,require_last_push_approval,required_approving_review_count,required_review_thread_resolution,required_reviewers'
          pr_keys="$(jq -r '.rules[]|select(.type=="pull_request")|.parameters|keys_unsorted|sort|join(",")' "$f")"
          if [ "$pr_keys" != "$want_pr" ]; then
            echo "::error file=$f::pull_request 参数键集与线上全量键不符"
            echo "--- 期望 ---"; printf '%s\n' "$want_pr"
            echo "--- 实际 ---"; printf '%s\n' "$pr_keys"
            bad=1
          fi
          want_rsc='do_not_enforce_on_create,required_status_checks,strict_required_status_checks_policy'
          rsc_keys="$(jq -r '.rules[]|select(.type=="required_status_checks")|.parameters|keys_unsorted|sort|join(",")' "$f")"
          if [ "$rsc_keys" != "$want_rsc" ]; then
            echo "::error file=$f::required_status_checks 参数键集与线上全量键不符"
            echo "--- 期望 ---"; printf '%s\n' "$want_rsc"
            echo "--- 实际 ---"; printf '%s\n' "$rsc_keys"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "✅ 规则集判据唯一（与 preflight.sh 逐字一致）且文件全量键齐备"
      - name: 凭据隔离判据在 review.sh 与 preflight.sh 逐字一致（同一实现 + 反向样本）
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          # **必须**逐字一致：隔离判据「凭据落在工作区内 → 拒绝」在 review.sh 与 preflight.sh 两处都成立，
          # 而脚本必须**自包含**（不引共享库）→ 两处文本只能逐字相同；只改一处 = 两套实现、口径分裂。
          # 断言本身也带反向样本 —— 否则「两处都空」也算"一致"。
          a="$(sed -n '/WORKSPACE_ASSERT:BEGIN/,/WORKSPACE_ASSERT:END/p' scripts/review.sh | sed -e '1d' -e '$d')"
          b="$(sed -n '/WORKSPACE_ASSERT:BEGIN/,/WORKSPACE_ASSERT:END/p' scripts/preflight.sh | sed -e '1d' -e '$d')"
          bad=0
          if [ -z "$a" ]; then echo "::error file=scripts/review.sh::未能从 WORKSPACE_ASSERT 标记区解析出隔离判据"; bad=1; fi
          if [ -z "$b" ]; then echo "::error file=scripts/preflight.sh::未能从 WORKSPACE_ASSERT 标记区解析出隔离判据"; bad=1; fi
          if [ "$a" != "$b" ]; then
            echo "::error::review.sh 与 preflight.sh 的凭据隔离判据不一致（必须逐字相同 —— 同一判据，不是两套实现）"
            echo "--- review.sh ---"; printf '%s\n' "$a"
            echo "--- preflight.sh ---"; printf '%s\n' "$b"
            bad=1
          fi
          if [ -z "$a" ] || [ -z "$b" ]; then exit 1; fi
          # ① 功能样本：判据必须真的能分出「工作区内」与「工作区外」（防「逐字一致但一致地坏」）
          mkdir -p /tmp/ws-assert
          printf '%s\n' "$a" > /tmp/ws-assert/judge.sh
          printf 'pat_in_workspace "$1"\n' >> /tmp/ws-assert/judge.sh
          if ! bash /tmp/ws-assert/judge.sh "$(pwd -P)/scripts/review.sh"; then
            echo "::error::隔离判据没有把仓库内路径判为「工作区内」"; bad=1
          fi
          if bash /tmp/ws-assert/judge.sh "${HOME}/.config/pm4gh/reviewer.pat"; then
            echo "::error::隔离判据把工作区外路径判成了「工作区内」"; bad=1
          fi
          # ② 反向样本 A：模拟「改一处、漏一处」（把 preflight.sh 侧文本改一个字符）→ 逐字比对必须失败
          mutated="$(printf '%s\n' "$b" | sed 's/pat_in_workspace/pat_in_workspace_x/')"
          if [ "$a" = "$mutated" ]; then
            echo "::error::反向样本 A 未失败：判据文本被改动后两处仍然相等 —— 逐字断言形同虚设"; bad=1
          fi
          # ③ 反向样本 B：把判据改成永不命中（= 各自为政的空判据）→ 功能样本必须抓得住
          printf '%s\n' "$b" | sed 's#"\$ws_root"|"\$ws_root"/\*#/__never__|/__never__/*#' > /tmp/ws-assert/judge-broken.sh
          printf 'pat_in_workspace "$1"\n' >> /tmp/ws-assert/judge-broken.sh
          if bash /tmp/ws-assert/judge-broken.sh "$(pwd -P)/scripts/review.sh"; then
            echo "::error::反向样本 B 未失败：判据被改成永不命中后，仓库内路径仍被判为「工作区内」"; bad=1
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "✅ review.sh 与 preflight.sh 的凭据隔离判据逐字一致；功能样本通过；反向样本 A/B 按预期失败"
      - name: 脚本有可执行位且自包含（无共享库）
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          fail=0
          for f in scripts/*.sh; do
            [ -f "$f" ] || continue
            if ! bash -n "$f"; then
              echo "::error file=$f::bash 语法错误"
              fail=1
            fi
            if [ ! -x "$f" ]; then
              echo "::error file=$f::缺少可执行位（chmod +x ${f}）"
              fail=1
            fi
          done
          if git -C "$GITHUB_WORKSPACE" grep -nE '(^|[^A-Za-z0-9_])lib\.sh' -- scripts >/dev/null 2>&1; then
            git grep -nE '(^|[^A-Za-z0-9_])lib\.sh' -- scripts
            echo "::error::scripts/ 引用了共享库 lib.sh —— 脚本必须自包含（见 SKILL.md）"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✅ scripts/*.sh 语法通过、有可执行位、且不依赖共享库"
      - name: PR 模板六段齐备 + CODEOWNERS 至少两名 owner
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          n="$(grep -cE '^## [1-6]\.' .github/PULL_REQUEST_TEMPLATE.md || true)"
          if [ "$n" -ne 6 ]; then
            echo "::error file=.github/PULL_REQUEST_TEMPLATE.md::需要 6 段，当前 ${n}"
            exit 1
          fi
          owners="$(awk '/^\*/ { for (i = 2; i <= NF; i++) print $i }' .github/CODEOWNERS | sort -u | grep -c . || true)"
          if [ "$owners" -lt 2 ]; then
            echo "::error file=.github/CODEOWNERS::默认规则必须至少 2 名 owner（否则作者路径会永久无法合并）"
            exit 1
          fi
          echo "✅ PR 模板六段齐备；CODEOWNERS 默认规则有 ${owners} 名 owner"
      - name: 开放 Issue 恰好 0 或 1 个合法状态标签
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          allowed="status/ready status/in-progress status/in-review"
          gh issue list -R "$REPO" --state open --limit 200 --json number,labels \
            --jq '.[] | "\(.number)\t\([.labels[].name | select(startswith("status/"))] | join(","))"' > /tmp/status.tsv
          bad=0
          while IFS="$(printf '\t')" read -r n labels; do
            [ -n "$n" ] || continue
            [ -n "$labels" ] || continue
            cnt="$(printf '%s' "$labels" | tr ',' '\n' | grep -c . || true)"
            if [ "$cnt" -gt 1 ]; then
              echo "::error::Issue #${n} 有多个状态标签（${labels}）—— 用 scripts/status.sh 修正"
              bad=1
              continue
            fi
            case " ${allowed} " in
              *" ${labels} "*) : ;;
              *) echo "::error::Issue #${n} 使用了未定义的状态标签 ${labels}"; bad=1 ;;
            esac
          done < /tmp/status.tsv
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "✅ 全部开放 Issue 恰好 0 或 1 个合法状态标签"
      - name: 机器消费的标签在平台上存在（与 preflight.sh 同一判据 + 反向样本）
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          # 断言"机器消费 + Issue 表单预置的标签必须存在"，不新增必需检查：标签是仓库级对象，不在版本库里、没有清单；
          # status.sh 的 --add-label 遇到不存在的标签会直接失败，start.sh 靠 type/* 推导分支类型（缺标签就静默退化），
          # Issue 表单的 labels: 指向不存在的标签时用该表单建单直接失败（D2 假绿）。
          # 判据只有一套：权威副本是下面的 heredoc，scripts/preflight.sh 的副本必须逐字一致；
          # 判据从 .github/ISSUE_TEMPLATE/*.yml 解析预置标签（不手抄）；
          # 反向样本（抽掉 type/hotfix = 手写项、抽掉 role/dev = 模板解析项）证明判据本身不是空断言。
          cat > /tmp/label-assert.sh <<'EOS'
          #   ① 机器消费（手写清单 MACHINE_LABELS）：status/* ×3（status.sh 迁移）+ type/* ×4（start.sh 推导）；
          #   ② Issue 表单预置（**从模板解析，不手抄**）：.github/ISSUE_TEMPLATE/*.yml 里每个 `labels:` 的值。
          # fail-closed：模板解析不出任何标签 → 判据报错；**不许**"解析不到就算通过"。
          MACHINE_LABELS="status/ready status/in-progress status/in-review type/bug type/hotfix type/spike type/chore"
          TEMPLATE_GLOB=".github/ISSUE_TEMPLATE/*.yml"
          
          # 从模板解析全部 `labels:` 值：flow 形式（labels: ["a", "b"]）与块序列（labels: 换行 "- a"）都支持。
          # 解析不出任何标签（模板缺失 / 没有顶层 labels: 键 / 值认不出）→ 非零退出 + 原因写 stderr。
          template_labels() {
            awk '
              BEGIN { sq = sprintf("%c", 39); inblk = 0; keys = 0; got = 0; keygot = 0; bad = 0 }
              function trim(s) { sub(/^[ \t]+/, "", s); sub(/[ \t]+$/, "", s); return s }
              function err(m) { printf "标签判据：%s\n", m > "/dev/stderr"; bad++ }
              function emit(v,   n, i, a, t, c) {
                gsub(/[]["]/, "", v); gsub(sq, "", v)
                n = split(v, a, ","); c = 0
                for (i = 1; i <= n; i++) { t = trim(a[i]); if (t != "") { print t; got++; c++ } }
                keygot += c
                if (c == 0) err("labels: 键的值解析不出标签")
              }
              function close_key() { if (inblk && keygot == 0) err("块序列形式的 labels: 键解析不出标签"); inblk = 0 }
              {
                if (inblk) {
                  if ($0 ~ /^[ \t]+-[ \t]/) { v = $0; sub(/^[ \t]+-[ \t]+/, "", v); sub(/[ \t]+#.*$/, "", v); emit(v); next }
                  close_key()
                }
                if ($0 ~ /^labels[ \t]*:/) {
                  close_key(); keys++; keygot = 0
                  v = $0; sub(/^labels[ \t]*:[ \t]*/, "", v); sub(/[ \t]+#.*$/, "", v)
                  if (trim(v) != "") emit(v); else inblk = 1
                }
              }
              END {
                close_key()
                if (keys == 0) err("模板里没有顶层的 labels: 键（Issue 表单格式不对？）")
                if (got == 0) err("未从模板解析出任何标签")
                if (bad > 0) exit 4
              }
            ' $TEMPLATE_GLOB
          }
          
          assert_machine_labels() {
            tpl="$(template_labels 2>&1)" || { printf '[FAIL] 表单预置标签的解析判据失败：\n%s\n' "$tpl" >&2; return 1; }
            required="$(printf '%s\n%s\n' "$MACHINE_LABELS" "$tpl" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ' | sed -E 's/[[:space:]]+$//')"
            missing=""
            for l in $required; do
              grep -qxF "$l" <<<"${1:-}" || missing="${missing} ${l}"
            done
            if [ -n "$missing" ]; then
              printf '[FAIL] 标签在平台上不存在：%s\n' "$missing" >&2
              printf '       后果：status.sh 迁移直接失败 / start.sh 静默退化 / 用 Issue 表单建单直接失败。标签是仓库级对象 —— 缺就建：gh label create "<name>" -R <slug>，不要靠删断言绕过\n' >&2
              return 1
            fi
            printf '[ OK ] 机器消费与表单预置的标签全部存在（%s）\n' "$required"
            return 0
          }
          EOS
          bad=0
          # ① 判据唯一：preflight.sh 的 LABEL_ASSERT 标记区必须与本步骤的权威副本一致（忽略缩进/空行）
          have="$(sed -n '/LABEL_ASSERT:BEGIN/,/LABEL_ASSERT:END/p' scripts/preflight.sh | sed -e '1d' -e '$d' | sed -E 's/^[[:space:]]+//' | grep -v '^$')"
          want="$(sed -E 's/^[[:space:]]+//' /tmp/label-assert.sh | grep -v '^$')"
          if [ -z "$have" ]; then
            echo "::error file=scripts/preflight.sh::未能从 LABEL_ASSERT 标记区解析出判据"
            bad=1
          elif [ "$have" != "$want" ]; then
            echo "::error::preflight.sh 与 ci/test 的标签判据不一致（必须逐字相同 —— 同一判据，不是两套实现）"
            echo "--- preflight.sh ---"; printf '%s\n' "$have"
            echo "--- ci/test ---"; printf '%s\n' "$want"
            bad=1
          fi
          . /tmp/label-assert.sh
          # ② 线上标签：机器消费的每一个都必须存在
          live="$(gh label list -R "$REPO" --limit 200 --json name --jq '.[].name')"
          if [ -z "$live" ]; then
            echo "::error::读不到线上标签清单（gh label list 返回空）"
            bad=1
          elif ! assert_machine_labels "$live"; then
            bad=1
          fi
          # ③ 反向样本：抽掉 type/hotfix（手写清单项）后断言**必须失败**（退化成空断言会被这一步抓住）
          if [ -n "$live" ] && assert_machine_labels "$(printf '%s\n' "$live" | grep -vxF 'type/hotfix')"; then
            echo "::error::反向样本未失败：缺 type/hotfix 时断言仍然通过 —— 判据形同虚设"
            bad=1
          fi
          # ④ 反向样本（D2）：抽掉**模板解析出来的** role/dev 后断言必须失败 ——
          #    这一项证明「从 .github/ISSUE_TEMPLATE/*.yml 解析」真的接进了判据，而不是手抄清单碰巧覆盖。
          if [ -n "$live" ] && assert_machine_labels "$(printf '%s\n' "$live" | grep -vxF 'role/dev')"; then
            echo "::error::反向样本未失败：缺表单预置标签 role/dev 时断言仍然通过 —— 模板解析没接进判据"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "✅ 机器消费 + 表单预置的标签全部存在；判据与 preflight.sh 逐字一致；反向样本（缺 type/hotfix、缺模板解析出的 role/dev）按预期失败"
      - name: Issue 表单完整性（DoR 五项 + 缺陷证据字段；动态枚举 + 与 preflight.sh 同一判据 + 反向样本）
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          # ── #157：契约要求 `ready` 的 Issue「DoR 五项齐备」，但两个表单只满足一半 ——
          #   `slice.yml` 有 DoR 五项、**没有**复现/证据字段；`bug.yml` 有缺陷证据、**没有** DoR 五项。
          #   → **缺陷轨道**建的 Issue 过不了 W1（同一契约，两张表单只满足一张；#144 盲测第 6 条）。
          # 本步骤把「哪张表单都不许缺项」变成机器可判：
          #   ① **全部** Issue 表单（**动态枚举**：`.github/ISSUE_TEMPLATE/*.yml` 里含顶层 `body:` 键的文件；
          #      `config.yml` 选择器没有 `body:` → 不参与）都必须含 DoR 五项 label（与 slice.yml **逐字一致**）；
          #   ② **至少一张**表单必须含完整缺陷证据字段集（否则缺陷轨道无处可填）；
          #   ③ 新增一张表单 → **自动落入判据**（防「新增表单绕过」），不需要改本判据。
          # 判据只有一套：它住在 `scripts/preflight.sh` 的 DOR_ASSERT 标记区；本步骤 `.` 它之后调用，
          #   并在下方 ⓪ 处断言两处文本**逐字一致**（忽略缩进 / 注释行 / 空行）—— 不许出现第二套实现。
          # 反向样本：(a) 删 bug.yml 的某项 DoR → FAIL；(b) 新增不含 DoR 的表单 → FAIL（证明动态枚举有效）；
          #   (c) 恢复 → 通过；(d) 改前对照 —— 同一输入在基线 b589f2c 上**不报**（证明这是新判据）。
          work="$(mktemp -d "${TMPDIR:-/tmp}/issue-forms.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          # 唯一一份实现：preflight.sh 的 DOR_ASSERT 标记区（剥掉注释行后就是可执行的判据本体）
          sed -n '/# DOR_ASSERT:BEGIN/,/# DOR_ASSERT:END/p' scripts/preflight.sh \
            | sed -e '1d' -e '$d' | grep -v '^[[:space:]]*#' > "$work/dor-assert.sh"
          if [ ! -s "$work/dor-assert.sh" ]; then
            echo "::error file=scripts/preflight.sh::未能从 DOR_ASSERT 标记区解析出表单完整性判据"
            exit 1
          fi
          if ! grep -q 'assert_forms_complete' "$work/dor-assert.sh"; then
            echo "::error file=scripts/preflight.sh::DOR_ASSERT 区里没有 assert_forms_complete —— 判据不成立（fail-closed）"
            exit 1
          fi
          bad=0
          # ⓪ 判据唯一：判据本体只住在 `scripts/preflight.sh` 的 DOR_ASSERT 标记区（上面已抽取）；
          #    本步骤**不复制**判据正文，只 `.` 它之后调用 —— 因此不可能出现"两套实现各自漂移"。
          #    这里断言抽取结果非空且含判据本体与两项常量（防"抽取静默变空 = 空断言通过"）。
          for need in assert_forms_complete form_labels form_files DOR_LABELS DEFECT_LABELS; do
            if ! grep -q "$need" "$work/dor-assert.sh"; then
              echo "::error file=scripts/preflight.sh::DOR_ASSERT 区里缺 ${need} —— 判据不成立（fail-closed）"
              exit 1
            fi
          done
          printf '  [ OK ] 判据唯一：判据本体只住在 preflight.sh 的 DOR_ASSERT 区（%s 行），ci/test 只调用不复制\n' "$(grep -c . "$work/dor-assert.sh")"
          # ① 正向：真实仓库
          if . "$work/dor-assert.sh" && assert_forms_complete "$PWD"; then
            printf '  [ OK ] 正向：真实仓库的表单全部含 DoR 五项，且存在完整缺陷证据字段集\n'
          else
            printf '  [FAIL] 正向未通过：表单不完整（见上方原文）\n' >&2
            bad=1
          fi
          # ② 反向样本 (a)：临时副本删掉 bug.yml 的某一项 DoR label → 断言**必须** FAIL
          mkdir -p "$work/a/.github/ISSUE_TEMPLATE"
          cp .github/ISSUE_TEMPLATE/*.yml "$work/a/.github/ISSUE_TEMPLATE/"
          if grep -q 'label: ③ 边界（明确不改什么）' "$work/a/.github/ISSUE_TEMPLATE/bug.yml"; then
            grep -v 'label: ③ 边界（明确不改什么）' "$work/a/.github/ISSUE_TEMPLATE/bug.yml" > "$work/a/bug.tmp" \
              && mv "$work/a/bug.tmp" "$work/a/.github/ISSUE_TEMPLATE/bug.yml"
          else
            printf '  [FAIL] 取不到样本：bug.yml 里没有 `label: ③ 边界（明确不改什么）`（判据样本缺失）\n' >&2
            bad=1
          fi
          ar=0; (. "$work/dor-assert.sh" && assert_forms_complete "$work/a") > "$work/a.log" 2>&1 || ar=$?
          if [ "$ar" -ne 0 ] && grep -q '缺 DoR 字段 label' "$work/a.log"; then
            printf '  [ OK ] 反向样本 (a)：删掉 bug.yml 的 `③ 边界（明确不改什么）` → 判据按预期 FAIL\n'
            sed 's/^/     /' "$work/a.log"
          else
            printf '  [FAIL] 反向样本 (a) 未失败：删掉一项 DoR 后判据仍然通过 —— 判据形同虚设\n' >&2
            sed 's/^/     /' "$work/a.log" >&2
            bad=1
          fi
          # ③ 反向样本 (b)：临时副本新增一个**不含 DoR**的表单文件 → 断言**必须** FAIL（证明动态枚举有效）
          rm -rf "$work/b"; mkdir -p "$work/b/.github/ISSUE_TEMPLATE"
          cp .github/ISSUE_TEMPLATE/*.yml "$work/b/.github/ISSUE_TEMPLATE/"
          cat > "$work/b/.github/ISSUE_TEMPLATE/zzz-newform.yml" <<'YML'
          name: 反向样本表单
          description: 故意不含 DoR 五项
          title: "[X] "
          labels: ["type/task", "role/dev"]
          body:
            - type: textarea
              attributes:
                label: 随手一填
              validations:
                required: true
          YML
          brc=0; (. "$work/dor-assert.sh" && assert_forms_complete "$work/b") > "$work/b.log" 2>&1 || brc=$?
          if [ "$brc" -ne 0 ] && grep -q 'zzz-newform.yml' "$work/b.log" && grep -q '缺 DoR 字段 label' "$work/b.log"; then
            printf '  [ OK ] 反向样本 (b)：新增不含 DoR 的表单 zzz-newform.yml → 判据按预期 FAIL（动态枚举有效）\n'
            sed 's/^/     /' "$work/b.log"
          else
            printf '  [FAIL] 反向样本 (b) 未失败：新增的不合规表单没被枚举到 —— 判据写死了文件名？\n' >&2
            sed 's/^/     /' "$work/b.log" >&2
            bad=1
          fi
          # ④ 反向样本 (c)：恢复（同一份未改动副本）→ 断言**必须**通过
          rm -rf "$work/c"; mkdir -p "$work/c/.github"
          cp -R .github/ISSUE_TEMPLATE "$work/c/.github/ISSUE_TEMPLATE"
          crc=0; (. "$work/dor-assert.sh" && assert_forms_complete "$work/c") > "$work/c.log" 2>&1 || crc=$?
          if [ "$crc" -eq 0 ] && grep -q 'Issue 表单完整性' "$work/c.log"; then
            printf '  [ OK ] 反向样本 (c)：恢复后判据通过（%s）\n' "$(tail -n 1 "$work/c.log")"
          else
            printf '  [FAIL] 反向样本 (c) 未通过：恢复后判据仍失败\n' >&2
            sed 's/^/     /' "$work/c.log" >&2
            bad=1
          fi
          # ⑤ 反向样本 (d) 改前对照：同一份输入（(a) 删项 + (b) 新增表单的副本）在**改前**的判据上
          #    **不报** —— 证明这是本片新加的判据，而不是"本来就会红"。做法：把基线 preflight.sh 的
          #    **既有**判据（LABEL_ASSERT 区）抽出来，在**同一份** (a) 副本上跑一次：基线判据只看
          #    `labels:` 平台标签，看不到 DoR 字段，因此同一输入在改前给出 `[ OK ]`（不报）。
          # 基线候选（取**第一个可解析且不含 DOR_ASSERT 区**的）：`HEAD^`（完整检出里 = 目标分支上的
          #    父提交）→ `origin/main`（PR 事件检出里通常就是目标分支）→ `b589f2c`（本片声明的基线）。
          #    浅检出（默认 `actions/checkout` 只有 1 个提交）三个都取不到时，**取一次**基线对象
          #    （`git fetch --depth=1 origin <sha>`，只取那一个提交）→ 仍取不到才 `[ SKIP ]` 并打印原因
          #    （**不计入通过**；不假红也不假绿）。
          # 注意：本文件禁止「管道 + 静默 grep」（pipefail 下会 EPIPE，#131 的静态扫描会抓）——
          #    所以这里**不把 git show 接进管道**，改成先取回文本、再用 here-string。
          base=""
          for cand in HEAD^ origin/main b589f2c; do
            if git cat-file -e "${cand}:scripts/preflight.sh" 2>/dev/null; then
              base_pf="$(git show "${cand}:scripts/preflight.sh" 2>/dev/null || true)"
              if [ -n "$base_pf" ] && ! grep -q 'DOR_ASSERT:BEGIN' <<<"$base_pf"; then
                base="$cand"; break
              fi
            fi
          done
          if [ -z "$base" ]; then
            # 浅检出兼容：先按**基分支 ref** 取（`main` 是受 ref 保护的名字，GitHub 一定拿得到），
            # 再退到按**本片声明的基线 SHA** 取（服务器策略可能拒绝按 SHA 取 —— 实测在 runner 上被拒）。
            printf '  · 浅检出里三个候选都取不到 → 尝试取一次基线对象（git fetch --depth=1 origin main / b589f2c）\n'
            for fs in main b589f2c; do
              git fetch --depth=1 origin "$fs" >/dev/null 2>&1 || continue
              if git cat-file -e b589f2c:scripts/preflight.sh 2>/dev/null; then
                base="b589f2c"
                printf '  · 已取回基线对象（git fetch --depth=1 origin %s）→ b589f2c 可解析（浅检出兼容；只取那一个提交）\n' "$fs"
                break
              fi
            done
          fi
          if [ -n "$base" ]; then
            base_sha="$(git rev-parse --short "$base" 2>/dev/null || printf '%s' "$base")"
            git show "${base}:scripts/preflight.sh" | sed -n '/# LABEL_ASSERT:BEGIN/,/# LABEL_ASSERT:END/p' \
              | sed -e '1d' -e '$d' | grep -v '^[[:space:]]*#' > "$work/base-label-assert.sh"
            n_dor="$(git show "${base}:scripts/preflight.sh" | sed -n '/# DOR_ASSERT:BEGIN/,/# DOR_ASSERT:END/p' | grep -c 'assert_forms_complete' || true)"
            printf '  · 改前对照：基线 %s；输入 = 反向样本 (a) 的副本（bug.yml 删掉 `③ 边界（明确不改什么）`）\n' "$base_sha"
            if [ "${n_dor:-0}" -eq 0 ] && [ -s "$work/base-label-assert.sh" ]; then
              drc=0
              (
                cd "$work/a" || exit 9
                . "$work/base-label-assert.sh"
                printf '%s\n' "status/ready" "status/in-progress" "status/in-review" "type/bug" "type/hotfix" "type/spike" "type/chore" "type/task" "role/dev" \
                  | assert_machine_labels "$(cat)"
              ) > "$work/d.log" 2>&1 || drc=$?
              printf '     [基线 %s 的既有判据 / (a) 副本] 退出码 %s：%s\n' "$base_sha" "$drc" "$(head -n 1 "$work/d.log")"
              if [ "$drc" -eq 0 ]; then
                printf '  [ OK ] 反向样本 (d) 改前对照：同一输入在基线 %s 上**不报**（基线无表单完整性判据，assert_forms_complete 命中 0 次）—— 本判据是新加的\n' "$base_sha"
              else
                printf '  [FAIL] 反向样本 (d) 改前对照不成立：同一输入在基线 %s 上已报错（说明这是既有行为，不是新判据）\n' "$base_sha" >&2
                sed 's/^/     /' "$work/d.log" >&2
                bad=1
              fi
            else
              printf '  [FAIL] 反向样本 (d) 改前对照无法构造：基线 %s 的 LABEL_ASSERT 区抽取为空，或基线已含 assert_forms_complete\n' "$base_sha" >&2
              bad=1
            fi
          else
            printf '  [ SKIP ] 反向样本 (d) 改前对照：取不到基线（浅检出 / 无父提交；`HEAD^` / `origin/main` / `b589f2c` 三个候选都不可解析，且 `git fetch --depth=1 origin b589f2c` 也失败）—— **不计入通过**（不假红也不假绿）\n'
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "✅ Issue 表单完整性：动态枚举的每张表单都含 DoR 五项（逐字，与 slice.yml 一致）+ 至少一张含完整缺陷证据字段集；判据与 preflight.sh 的 DOR_ASSERT 区同源；反向样本 (a) 删项 / (b) 新增不合规表单 / (c) 恢复 / (d) 基线改前对照 全部按预期"
      - name: references/status-machine.md 状态机转换表与 scripts/status.sh 逐字一致（防文档漂移）
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          # 转换表只有一处权威定义（status.sh）；references/status-machine.md 的表由本步断言逐字一致：
          # 状态集（VALID_STATES vs 转换表首列）与边集（TRANSITIONS vs 标记区每行的 to 列）都逐字比对。
          # 表是唯一权威，**禁止**画图（图带语法开销、隐式节点易漏）。
          sh=scripts/status.sh
          md=references/status-machine.md
          sh_states="$(grep -m1 '^VALID_STATES=' "$sh" | sed -E 's/^VALID_STATES="//; s/"$//' | tr ' ' '\n' | sort -u)"
          sh_edges="$(sed -nE 's/^TRANSITIONS="(.*)"$/\1/p' "$sh" | tr ' ' '\n' \
            | grep -E '^[a-z-]+->[a-z-]+$' | sort -u)"
          # 状态集取自 <!-- TRANSITIONS:BEGIN/END --> 标记区的**第一列**（每行一个 from），
          # 不再依赖第二份逐状态表 —— 同一事实只留一处载体。
          md_states="$(sed -n '/TRANSITIONS:BEGIN/,/TRANSITIONS:END/p' "$md" \
            | sed -nE 's/^`([a-z-]+)`[[:space:]]*\|.*/\1/p' | sort -u)"
          # 转换表 = 文档里 <!-- TRANSITIONS:BEGIN --> 与 END 之间的表；每行形如
          #   `from` | `to1` `to2` ...（行首是 `from`，其余反引号里的都是出边）
          md_edges="$(sed -n '/TRANSITIONS:BEGIN/,/TRANSITIONS:END/p' "$md" \
            | grep -E '^`' \
            | while IFS= read -r line; do
                from="$(printf '%s' "$line" | sed -E 's/^`([a-z-]+)`.*/\1/')"
                rest="$(printf '%s' "$line" | sed -E 's/^`[a-z-]+`[[:space:]]*\|[[:space:]]*//')"
                for to in $(printf '%s\n' "$rest" | tr '`' '\n' | grep -E '^[a-z-]+$'); do
                  [ "$to" = "$from" ] && continue
                  printf '%s->%s\n' "$from" "$to"
                done
              done | sort -u)"
          bad=0
          # 自检：表里每条边的 from/to 都必须是状态集里的状态（防手写笔误，例如 backlog->redy）
          for e in $(printf '%s\n' "$sh_edges"); do
            f="${e%%->*}"; t="${e##*->}"
            grep -qxF "$f" <<<"$sh_states" || { echo "::error file=$sh::转换表里的状态 ${f} 不在 VALID_STATES 内"; bad=1; }
            grep -qxF "$t" <<<"$sh_states" || { echo "::error file=$sh::转换表里的状态 ${t} 不在 VALID_STATES 内"; bad=1; }
          done
          [ -n "$sh_states" ] || { echo "::error file=$sh::未能解析出 VALID_STATES"; bad=1; }
          [ -n "$sh_edges" ]  || { echo "::error file=$sh::未能解析出 TRANSITIONS"; bad=1; }
          [ -n "$md_states" ] || { echo "::error file=$md::未能解析出转换表首列（状态集）"; bad=1; }
          [ -n "$md_edges" ]  || { echo "::error file=$md::未能解析出转换表（TRANSITIONS 标记区内的 from→to 行）"; bad=1; }
          if [ "$sh_states" != "$md_states" ]; then
            echo "::error file=$md::状态集与 scripts/status.sh 不一致"
            echo "--- status.sh ---"; printf '%s\n' "$sh_states"
            echo "--- references/status-machine.md ---"; printf '%s\n' "$md_states"
            bad=1
          fi
          if [ "$sh_edges" != "$md_edges" ]; then
            echo "::error file=$md::转换表与 scripts/status.sh 不一致（文档漂移）"
            echo "--- status.sh 独有 ---"; comm -23 <(printf '%s\n' "$sh_edges") <(printf '%s\n' "$md_edges")
            echo "--- references/status-machine.md 独有 ---"; comm -13 <(printf '%s\n' "$sh_edges") <(printf '%s\n' "$md_edges")
            bad=1
          fi
          # 自检：终态不得有出边（done/canceled 是终态；迁出只能靠 gh issue reopen 后走合法边）
          for t in done canceled; do
            if grep -qE "^${t}->" <<<"$sh_edges"; then
              echo "::error file=$sh::终态 ${t} 不应有出边"; bad=1
            fi
          done
          # 自检：每个状态都必须有到 canceled 的出口（「不做」的通用终止边），done/canceled 除外
          for st in $(printf '%s\n' "$sh_states"); do
            case "$st" in done|canceled) continue ;; esac
            grep -qxF "${st}->canceled" <<<"$sh_edges" || {
              echo "::error file=$sh::状态 ${st} 缺少 -> canceled 终止边"; bad=1; }
          done
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "✅ 状态集与转换表逐字一致（$(printf '%s\n' "$sh_edges" | grep -c .) 条边，$(printf '%s\n' "$sh_states" | grep -c .) 个状态）"
          printf '%s\n' "$sh_edges"

      - name: 状态迁移是 HTTP 层单请求：恰好 1 次标签写请求 + 载荷含全部非 status/* 标签（stub gh + 反向样本）
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          # ── 状态迁移的判据：「HTTP 层单请求」（#115）──────────────────────────────────
          # 带标签→带标签的迁移**必须**是 REST `PUT …/labels` **整份替换**（HTTP 层 1 次请求）；
          # **禁止** `gh issue edit` 或多次调用：HTTP 层是 add/remove 两个**并发** mutation，
          # 中间态可以是 0 个或 2 个 status/*，policy/branch-name 对两者都判失败（失败 SHA 不可逆）。
          # 断言必须常驻 ci/test，而不是在 /tmp 跑一次：
          #   ① 非终态迁移**恰好 1 次**标签写请求（stub gh 记录；`gh issue edit` 一次都不许有）
          #   ② 替换请求的载荷**包含全部非 status/ 标签** —— 整份替换会静默删掉没带上的标签
          #   ③ 读回校验：写后再 GET 一次比对非 status/* 集合；被他人改动 → 报告且**不重试覆盖**
          # 反向样本内置：反例 A（两次写请求）→ 断言必须失败；反例 B（载荷漏带 type/*）→ 断言必须失败。
          ST=/tmp/status-put-check
          rm -rf "$ST"; mkdir -p "$ST/bin" "$ST/s"

          # ① 被测逻辑的唯一来源是 scripts/status.sh 的标记区（不复制第二份实现；标记区消失也报错）
          sed -n '/STATUS_LABELS_PUT:BEGIN/,/STATUS_LABELS_PUT:END/p' scripts/status.sh > "$ST/region.txt"
          if ! grep -q 'put_status_labels' "$ST/region.txt"; then
            echo "::error file=scripts/status.sh::未能从 STATUS_LABELS_PUT 标记区解析出「单次 HTTP 写请求」实现"
            exit 1
          fi
          if ! grep -q 'TEST_ANCHOR:PUT' "$ST/region.txt"; then
            echo "::error file=scripts/status.sh::标记区缺少反向样本锚点 TEST_ANCHOR:PUT —— 反向样本会退化成空断言"
            exit 1
          fi

          # ② stub gh：把「平台」状态放进文件，记录每一次调用与每一次写请求的载荷
          cat > "$ST/bin/gh" <<'EOS'
          #!/usr/bin/env bash
          set -eu
          S="${STUB_STATE:?stub gh 需要 STUB_STATE}"
          mkdir -p "$S"
          printf '%s\n' "$*" >> "$S/calls.log"

          issue_json() {
            st="$(cat "$S/state.txt" 2>/dev/null || printf 'OPEN')"
            rs="$(cat "$S/reason.txt" 2>/dev/null || printf 'COMPLETED')"
            printf '{"number":%s,"state":"%s","stateReason":"%s","labels":[' "$1" "$st" "$rs"
            first=1
            while IFS= read -r l; do
              [ -n "$l" ] || continue
              if [ "$first" = 1 ]; then first=0; else printf ','; fi
              printf '{"name":"%s"}' "$l"
            done < "$S/labels.txt"
            printf ']}'
          }

          bump() {
            n=0; [ -f "$1" ] && n="$(cat "$1")"
            printf '%s\n' "$((n + 1))" > "$1"
          }

          labels_json() {
            first=1
            printf '['
            while IFS= read -r l; do
              [ -n "$l" ] || continue
              if [ "$first" = 1 ]; then first=0; else printf ','; fi
              printf '{"name":"%s"}' "$l"
            done < "$S/labels.txt"
            printf ']'
          }

          case "${1:-}" in
            repo)
              printf 'yes8080/pm4gh\n' ;;
            api)
              shift
              method=GET; path=""; jqexpr=""
              while [ $# -gt 0 ]; do
                case "$1" in
                  -X) method="$2"; shift 2 ;;
                  --jq) jqexpr="$2"; shift 2 ;;
                  --input) shift; [ "${1:-}" = "-" ] && shift ;;
                  --paginate) shift ;;
                  -*) shift ;;
                  *) path="$1"; shift ;;
                esac
              done
              case "$path" in
                user)
                  # #141 D1：stub 平台让「身份」可观测 —— 返回哪个登录名**只取决于 GH_TOKEN**，
                  # 从而证明 status.sh --as 真的切换了凭据（而不是打印一句口号）。
                  case "${GH_TOKEN:-}" in
                    "${STUB_AUTHOR_TOKEN:-__absent__}")   printf 'yes8080-dev-bot\n' ;;
                    "${STUB_REVIEWER_TOKEN:-__absent__}") printf 'yes8080-reviewer-bot\n' ;;
                    *) printf 'yes8080\n' ;;
                  esac
                  ;;
                */issues/*/labels)
                  if [ "$method" = "PUT" ]; then
                    bump "$S/writes.count"
                    idx="$(cat "$S/writes.count")"
                    cat > "$S/put-${idx}.json"
                    jq -r '.[]' "$S/put-${idx}.json" > "$S/labels.txt"
                    # 并发窗口模拟：本次 PUT 之后，他人又改了一次非 status/* 标签
                    [ "${STUB_TAMPER:-0}" = "1" ] && printf 'area/other\n' >> "$S/labels.txt"
                  else
                    bump "$S/get-labels.count"
                    if [ -n "$jqexpr" ]; then
                      labels_json | jq -r "$jqexpr"
                    else
                      labels_json
                    fi
                  fi
                  ;;
                *) printf 'stub gh: 未实现的 api 路径 %s\n' "$path" >&2; exit 9 ;;
              esac
              ;;
            issue)
              shift
              sub="${1:-}"; shift || true
              num="${1:-0}"; shift || true
              jqexpr=""; reason=""
              while [ $# -gt 0 ]; do
                case "$1" in
                  --jq) jqexpr="$2"; shift 2 ;;
                  --reason) reason="$2"; shift 2 ;;
                  --json) shift 2 ;;
                  -R) shift 2 ;;
                  *) shift ;;
                esac
              done
              case "$sub" in
                view)
                  obj="$(issue_json "$num")"
                  if [ -n "$jqexpr" ]; then printf '%s' "$obj" | jq -r "$jqexpr"; else printf '%s\n' "$obj"; fi
                  ;;
                close)
                  printf 'CLOSED\n' > "$S/state.txt"
                  case "${reason:-}" in
                    "not planned"|not_planned) printf 'NOT_PLANNED\n' > "$S/reason.txt" ;;
                    *) printf 'COMPLETED\n' > "$S/reason.txt" ;;
                  esac
                  ;;
                edit)
                  # 回归护栏：标签迁移**不得**再走 `gh issue edit`（它的 HTTP 层不是单请求）
                  bump "$S/issue-edit.count"
                  ;;
                *) printf 'stub gh: 未实现的 issue 子命令 %s\n' "$sub" >&2; exit 9 ;;
              esac
              ;;
            *) printf 'stub gh: 未实现的子命令 %s\n' "$*" >&2; exit 9 ;;
          esac
          exit 0
          EOS
          chmod +x "$ST/bin/gh"

          # ③ 反例 A 的插入行：先发一次「只保留非 status/*」的写请求（= #93 的 remove），锚点行使是 add → 两次写
          cat > "$ST/ins-a.txt" <<'EOS'
            printf '%s' "$(printf '%s' "$sp_payload" | jq -c '[.[] | select(startswith("status/") | not)]')" | put_status_labels "$sp_repo" "$sp_issue" || return 1
          EOS
          INS_A="$(cat "$ST/ins-a.txt")" awk 'index($0, "TEST_ANCHOR:PUT") { print ENVIRON["INS_A"] } { print }' scripts/status.sh > "$ST/impl-2calls.sh"

          # ④ 反例 B：载荷只发目标 status 标签（漏掉全部非 status/* 标签）
          cat > "$ST/repl-b.txt" <<'EOS'
            sp_payload="$(printf '%s\n' "$sp_target" | jq -R . | jq -cs .)"   # TEST_ANCHOR:PAYLOAD（反例 B）
          EOS
          REPL_B="$(cat "$ST/repl-b.txt")" awk 'index($0, "TEST_ANCHOR:PAYLOAD") { print ENVIRON["REPL_B"]; next } { print }' scripts/status.sh > "$ST/impl-nokeep.sh"

          # ⑤ 把真实 status.sh（或其变异副本）跑在 stub 平台上：in-progress → in-review
          # #141 D1：写迁移**必须**带 --as；stub 作者凭据只存在于测试目录（**不读任何真实凭据**）。
          printf 'stub-author-token\n' > "$ST/dev.pat"
          printf 'stub-reviewer-token\n' > "$ST/reviewer.pat"
          run_case() { # run_case <实现文件> <tamper 0|1>
            impl="$1"; tamper="${2:-0}"
            S="$ST/s"; rm -rf "$S"; mkdir -p "$S"
            printf 'type/bug\narea/ci\nrole/dev\nprio/P2\nstatus/in-progress\n' > "$S/labels.txt"
            printf 'OPEN\n' > "$S/state.txt"; printf 'COMPLETED\n' > "$S/reason.txt"
            : > "$S/calls.log"
            printf '0\n' > "$S/writes.count"; printf '0\n' > "$S/get-labels.count"; printf '0\n' > "$S/issue-edit.count"
            rc=0
            PATH="$ST/bin:$PATH" STUB_STATE="$S" STUB_TAMPER="$tamper" \
              DEVELOPER_PAT_FILE="$ST/dev.pat" STUB_AUTHOR_TOKEN=stub-author-token \
              bash "$impl" 999 in-review --as author > "$S/out.log" 2>&1 || rc=$?
          }

          assert_transition() { # assert_transition <样本名>
            name="$1"; bad=0
            writes="$(cat "$ST/s/writes.count")"
            if [ "$writes" = "1" ]; then
              printf '  [ OK ] %s：标签写请求次数 = 1（HTTP 层单请求）\n' "$name"
            else
              printf '  [FAIL] %s：标签写请求次数 = %s（必须恰好 1：HTTP 层单请求）\n' "$name" "$writes"
              bad=1
            fi
            edits="$(cat "$ST/s/issue-edit.count")"
            if [ "$edits" = "0" ]; then
              printf '  [ OK ] %s：未使用 gh issue edit（HTTP 层非单请求的实现）\n' "$name"
            else
              printf '  [FAIL] %s：出现了 %s 次 gh issue edit —— 判据是 HTTP 层单请求，不是「一次 CLI 调用」\n' "$name" "$edits"
              bad=1
            fi
            last="$ST/s/put-${writes}.json"; have=""
            [ -f "$last" ] && have="$(jq -r '.[]' "$last")"
            for l in type/bug area/ci role/dev prio/P2; do
              if grep -qxF "$l" <<<"$have"; then
                printf '  [ OK ] %s：载荷含非 status/ 标签 %s\n' "$name" "$l"
              else
                printf '  [FAIL] %s：载荷缺少非 status/ 标签 %s（整份替换会静默删掉它）\n' "$name" "$l"
                bad=1
              fi
            done
            sn="$(printf '%s\n' "$have" | grep -c '^status/' || true)"
            if [ "$sn" = "1" ] && grep -qxF 'status/in-review' <<<"$have"; then
              printf '  [ OK ] %s：载荷的 status/* 恰好 1 个 = status/in-review\n' "$name"
            else
              printf '  [FAIL] %s：载荷的 status/* 不是恰好 1 个目标标签（实测 %s 个）\n' "$name" "$sn"
              bad=1
            fi
            gets="$(cat "$ST/s/get-labels.count")"
            if [ "$gets" = "2" ]; then
              printf '  [ OK ] %s：标签端点 GET = 2（写前读 + 写后读回校验）\n' "$name"
            else
              printf '  [FAIL] %s：标签端点 GET = %s（应为 2：写前读 + 写后读回校验）\n' "$name" "$gets"
              bad=1
            fi
            [ "$bad" -ne 0 ] && return 1
            return 0
          }

          fail=0
          printf '\n== 正向样本：非终态迁移（in-progress → in-review），恰好 1 次写请求 ==\n'
          run_case scripts/status.sh 0
          rc_fwd="$rc"
          assert_transition 正向 || fail=$((fail + 1))
          if [ "$rc_fwd" = "0" ] && grep -q '读回校验一致' "$ST/s/out.log"; then
            printf '  [ OK ] 正向：status.sh 退出码 0 且输出读回校验结论\n'
          else
            printf '  [FAIL] 正向：status.sh 退出码 %s（应为 0）或缺少读回校验结论\n' "$rc_fwd"
            cat "$ST/s/out.log"; fail=$((fail + 1))
          fi
          printf '  —— status.sh 原文：\n'
          sed 's/^/     /' "$ST/s/out.log"
          printf '  —— 写请求载荷 put-1.json：%s\n' "$(cat "$ST/s/put-1.json")"

          printf '\n== 反向样本 A：两次写请求（remove → add）必须让断言失败 ==\n'
          run_case "$ST/impl-2calls.sh" 0
          if assert_transition 反例A; then
            printf '  [FAIL] 反向样本 A 未失败：两次写请求仍通过了「恰好 1 次」断言 —— 断言形同虚设\n'
            fail=$((fail + 1))
          else
            printf '  [ OK ] 反向样本 A 按预期失败（上方 [FAIL] 行）\n'
          fi

          printf '\n== 反向样本 B：载荷漏带非 status/ 标签必须让断言失败 ==\n'
          run_case "$ST/impl-nokeep.sh" 0
          if assert_transition 反例B; then
            printf '  [FAIL] 反向样本 B 未失败：漏带 type/* 仍通过了载荷断言 —— 断言形同虚设\n'
            fail=$((fail + 1))
          else
            printf '  [ OK ] 反向样本 B 按预期失败（上方 [FAIL] 行）\n'
          fi

          printf '\n== 读回校验：写后非 status/ 标签被他人改动 → 报告且不重试覆盖 ==\n'
          run_case scripts/status.sh 1
          rb=0
          if [ "$rc" != "0" ]; then printf '  [ OK ] 读回校验抓到并发改动（status.sh 退出码 %s）\n' "$rc"; else printf '  [FAIL] 读回校验没抓到并发改动（退出码 0）\n'; rb=1; fi
          if grep -q '读回校验不一致' "$ST/s/out.log"; then printf '  [ OK ] 报告原文含「读回校验不一致」\n'; else printf '  [FAIL] 报告原文缺少「读回校验不一致」\n'; rb=1; fi
          if [ "$(cat "$ST/s/writes.count")" = "1" ]; then printf '  [ OK ] 未重试覆盖（写请求仍为 1 次）\n'; else printf '  [FAIL] 发生了重试覆盖（写请求 %s 次）\n' "$(cat "$ST/s/writes.count")"; rb=1; fi
          if grep -q '不重试覆盖' "$ST/s/out.log"; then printf '  [ OK ] 报告原文含「不重试覆盖」的动作说明\n'; else printf '  [FAIL] 报告原文未说明不重试覆盖\n'; rb=1; fi
          printf '  —— status.sh 原文：\n'
          sed 's/^/     /' "$ST/s/out.log"
          [ "$rb" = 0 ] || fail=$((fail + 1))

          printf '\n== 闭环回归：backlog → ready → in-progress → in-review → in-progress → in-review → done ==\n'
          S="$ST/loop"; rm -rf "$S"; mkdir -p "$S"
          printf 'type/bug\narea/ci\nrole/dev\n' > "$S/labels.txt"; printf 'OPEN\n' > "$S/state.txt"; printf 'COMPLETED\n' > "$S/reason.txt"
          : > "$S/calls.log"
          printf '0\n' > "$S/writes.count"; printf '0\n' > "$S/get-labels.count"; printf '0\n' > "$S/issue-edit.count"
          loop_bad=0
          for step in ready in-progress in-review in-progress in-review done; do
            lrc=0
            PATH="$ST/bin:$PATH" STUB_STATE="$S" STUB_TAMPER=0 \
              DEVELOPER_PAT_FILE="$ST/dev.pat" STUB_AUTHOR_TOKEN=stub-author-token \
              bash scripts/status.sh 999 "$step" --as author > "$S/out-$step.log" 2>&1 || lrc=$?
            cnt="$(grep -c '^status/' "$S/labels.txt" || true)"
            st="$(cat "$S/state.txt")"
            keep="$(grep -v '^status/' "$S/labels.txt" | grep -c . || true)"
            if [ "$step" = "done" ]; then
              if [ "$lrc" = 0 ] && [ "$cnt" = 0 ] && [ "$st" = "CLOSED" ] && [ "$keep" = 3 ]; then
                printf '  [ OK ] → %-11s 退出码 0；status/* = 0 且 Issue CLOSED（终态载体）；非 status/* 保留 %s 个\n' "$step" "$keep"
              else
                printf '  [FAIL] → %-11s 退出码 %s；status/* = %s；state = %s；非 status/* = %s（应 3）\n' "$step" "$lrc" "$cnt" "$st" "$keep"; loop_bad=1
              fi
            else
              if [ "$lrc" = 0 ] && [ "$cnt" = 1 ] && [ "$keep" = 3 ] && grep -qxF "status/$step" "$S/labels.txt"; then
                printf '  [ OK ] → %-11s 退出码 0；status/* 恰好 1 个 = status/%s；非 status/* 保留 %s 个\n' "$step" "$step" "$keep"
              else
                printf '  [FAIL] → %-11s 退出码 %s；status/* = %s（应为恰好 1 个 status/%s）；非 status/* = %s（应 3）\n' "$step" "$lrc" "$cnt" "$step" "$keep"; loop_bad=1
              fi
            fi
          done
          [ "$loop_bad" = 0 ] || fail=$((fail + 1))
          if [ "$(cat "$S/issue-edit.count")" = "0" ] && [ "$(cat "$S/writes.count")" = "6" ]; then
            printf '  [ OK ] 闭环 6 次迁移 = 6 次标签写请求（每次恰好 1 次），gh issue edit 0 次\n'
          else
            printf '  [FAIL] 闭环写请求 %s 次 / gh issue edit %s 次（应为 6 / 0）\n' "$(cat "$S/writes.count")" "$(cat "$S/issue-edit.count")"
            fail=$((fail + 1))
          fi
          printf '  —— 每步写请求载荷：\n'
          for i in 1 2 3 4 5 6; do printf '     put-%s.json = %s\n' "$i" "$(cat "$S/put-${i}.json")"; done
          printf '  —— 终态标签（应为 3 个非 status/*，无空串标签）：%s\n' "$(tr '\n' ' ' < "$S/labels.txt")"

          # ── #141 D1：写迁移必须带**显式身份**；只读模式不需要 ──────────────────────
          # 判据（常驻 ci/test，不新增必需检查）：
          #   ① 写迁移缺 --as → 拒绝（exit 非 0）且**零写请求**（fail-closed，不产生任何身份归属）
          #   ② --as author|reviewer|dispatcher → 各自用**对应凭据**执行：stub 平台读到的登录名
          #      随 GH_TOKEN 变化，从而证明凭据真的被切换（不是只打印一句口号）
          #   ③ 只读模式（--check-transition）不带 --as → exit 0 且**一次 gh 调用都没有**（零副作用）
          # 凭据只存在于测试目录（$ST/dev.pat、$ST/reviewer.pat 是 stub 文本，**不读任何真实凭据**）。
          printf '\n== 身份开关（#141 D1）：写迁移必须 --as；只读模式不需要 ==\n'
          id_state() {
            S="$ST/id"; rm -rf "$S"; mkdir -p "$S"
            printf 'type/bug\narea/ci\nrole/dev\nstatus/in-progress\n' > "$S/labels.txt"
            printf 'OPEN\n' > "$S/state.txt"; printf 'COMPLETED\n' > "$S/reason.txt"
            : > "$S/calls.log"
            printf '0\n' > "$S/writes.count"; printf '0\n' > "$S/get-labels.count"; printf '0\n' > "$S/issue-edit.count"
          }
          id_bad=0

          # ① 缺 --as 的写迁移
          id_state
          irc=0
          PATH="$ST/bin:$PATH" STUB_STATE="$ST/id" DEVELOPER_PAT_FILE="$ST/dev.pat" STUB_AUTHOR_TOKEN=stub-author-token \
            bash scripts/status.sh 999 in-review > "$ST/id/out.log" 2>&1 || irc=$?
          if [ "$irc" != "0" ] && [ "$(cat "$ST/id/writes.count")" = "0" ] && grep -q '写迁移必须显式指定身份' "$ST/id/out.log"; then
            printf '  [ OK ] 缺 --as：拒绝（exit %s）、零写请求、给出修法\n' "$irc"
          else
            printf '  [FAIL] 缺 --as：exit %s（应非 0）/ 写请求 %s（应 0）\n' "$irc" "$(cat "$ST/id/writes.count")"; id_bad=1
          fi
          sed 's/^/       /' "$ST/id/out.log"

          # ② 三个身份各自用对应凭据执行（stub：登录名只由 GH_TOKEN 决定）
          for spec in "author|$ST/dev.pat|stub-author-token|yes8080-dev-bot|作者" \
                      "reviewer|$ST/reviewer.pat|stub-reviewer-token|yes8080-reviewer-bot|评审" \
                      "dispatcher|||yes8080|dispatcher / 合并"; do
            IFS='|' read -r who pat tok want label <<EOF
          $spec
          EOF
            id_state
            irc=0
            if [ "$who" = "author" ]; then
              PATH="$ST/bin:$PATH" STUB_STATE="$ST/id" DEVELOPER_PAT_FILE="$pat" STUB_AUTHOR_TOKEN="$tok" \
                bash scripts/status.sh 999 in-review --as author > "$ST/id/out.log" 2>&1 || irc=$?
            elif [ "$who" = "reviewer" ]; then
              PATH="$ST/bin:$PATH" STUB_STATE="$ST/id" REVIEWER_PAT_FILE="$pat" STUB_REVIEWER_TOKEN="$tok" \
                bash scripts/status.sh 999 in-review --as reviewer > "$ST/id/out.log" 2>&1 || irc=$?
            else
              PATH="$ST/bin:$PATH" STUB_STATE="$ST/id" \
                bash scripts/status.sh 999 in-review --as dispatcher > "$ST/id/out.log" 2>&1 || irc=$?
            fi
            if [ "$irc" = "0" ] && grep -q "本次执行身份（${label}）：${want}" "$ST/id/out.log" \
               && grep -q "身份 --as ${who} = ${want}" "$ST/id/out.log" \
               && [ "$(cat "$ST/id/writes.count")" = "1" ]; then
              printf '  [ OK ] --as %-10s → 用对应凭据执行（stub 平台读到 %s），恰好 1 次标签写请求\n' "$who" "$want"
            else
              printf '  [FAIL] --as %-10s → exit %s / 写请求 %s / 期望身份 %s\n' "$who" "$irc" "$(cat "$ST/id/writes.count")" "$want"
              sed 's/^/       /' "$ST/id/out.log"; id_bad=1
            fi
          done

          # ③ 只读模式不需要 --as（且零副作用：连一次 gh 调用都没有）
          id_state
          irc=0
          PATH="$ST/bin:$PATH" STUB_STATE="$ST/id" \
            bash scripts/status.sh --check-transition in-progress in-review > "$ST/id/out.log" 2>&1 || irc=$?
          id_calls="$(grep -c . "$ST/id/calls.log" || true)"
          if [ "$irc" = "0" ] && [ "$id_calls" = "0" ] && [ "$(cat "$ST/id/writes.count")" = "0" ]; then
            printf '  [ OK ] 只读模式（--check-transition）不带 --as：exit 0、gh 调用 0 次、写请求 0 次\n'
          else
            printf '  [FAIL] 只读模式：exit %s（应 0）/ gh 调用 %s（应 0）/ 写请求 %s（应 0）\n' "$irc" "$id_calls" "$(cat "$ST/id/writes.count")"; id_bad=1
          fi
          [ "$id_bad" = 0 ] || fail=$((fail + 1))

          printf '\n'
          if [ "$fail" -ne 0 ]; then
            printf '❌ 状态迁移单请求断言失败（%s 项）—— 见上方 [FAIL]\n' "$fail"
            exit 1
          fi
          printf '✅ 非终态迁移恰好 1 次标签写请求 + 载荷含全部非 status/ 标签 + 读回校验不重试覆盖；反向样本 A/B 按预期失败；闭环回归 6 步每步 status/* 恰好 1 个；身份开关：缺 --as 拒绝、三个 --as 各用对应凭据、只读模式无需 --as\n'
      - name: 未提交任何凭据
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          if git -C "$GITHUB_WORKSPACE" grep -nE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ; then
            echo "::error::检测到疑似凭据被提交进仓库"
            exit 1
          fi
          echo "✅ 未发现凭据"
      - name: 关闭关键字判据对大正文不误报（双向反向样本 >40KB + 静态扫描零管道）
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          # #131 回归靶子：`printf` 经管道接 `grep -q` 在 pipefail 下 —— grep -q 命中即退出 → printf 收到 EPIPE
          # → 整条管道被判失败 → `if !` 取反 → 误报「缺少关闭关键字」（正文 >32KB 才稳定触发）。
          # 判据**只有一处**（linked-issue 步骤的 LINKED_ISSUE_ASSERT 标记区）：本步骤抽出**实现本身**，
          # **禁止**在这里复写第二份正则（复写 = 两套判据，会漂移）。
          wf=.github/workflows/required-checks.yml
          judge=/tmp/linked-issue-assert.sh
          fail=0
          awk '/^[[:space:]]*# LINKED_ISSUE_ASSERT:BEGIN/ { on=1; next } /^[[:space:]]*# LINKED_ISSUE_ASSERT:END/ { on=0 } on' "$wf" > "$judge"
          if ! grep -q 'grep -qiE' "$judge"; then
            echo "::error file=$wf::未能从 LINKED_ISSUE_ASSERT 标记区解析出判据 —— 抽不到 = 断言无意义"
            fail=1
          elif [ "$(grep -c . "$judge" || true)" -lt 3 ]; then
            echo "::error file=$wf::LINKED_ISSUE_ASSERT 标记区过短（$(grep -c . "$judge" || true) 行）"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          . "$judge"
          command -v linked_issue_ok >/dev/null || { echo "::error file=$wf::标记区未定义 linked_issue_ok"; exit 1; }
          # ① 静态扫描：本文件禁止再出现「管道接 grep -q」（#131 的唯一触发形态）
          if grep -nE '\|[[:space:]]*grep -q' "$wf"; then
            echo "::error file=$wf::出现「管道接 grep -q」—— pipefail 下会 EPIPE（#131），改用 here-string"
            exit 1
          fi
          printf '✅ 静态扫描：%s 零命中「管道接 grep -q」\n' "$wf"
          # ② 大正文样本：>40KB（Linux runner 上 >32KB 才稳定触发 EPIPE，样本必须跨过该阈值）
          big_with=/tmp/linked-issue-big-with.md
          big_without=/tmp/linked-issue-big-without.md
          {
            printf 'Closes #1\n\n'
            awk 'BEGIN { for (i = 1; i <= 800; i++) printf "填充行 %04d：大正文样本，用于跨过 runner 管道缓冲（>32KB），暴露 grep -q 的 EPIPE 误报。\n", i }'
          } > "$big_with"
          grep -vxF 'Closes #1' "$big_with" > "$big_without"
          [ "$(grep -c '^Closes #1$' "$big_with" || true)" = 1 ] || { echo "::error::正向样本未恰好含 1 行 Closes #1"; fail=1; }
          [ "$(grep -c '^Closes #1$' "$big_without" || true)" = 0 ] || { echo "::error::反向样本仍含 Closes #1（两样本必须只差这一行）"; fail=1; }
          for f in "$big_with" "$big_without"; do
            b="$(wc -c < "$f" | tr -d ' ')"
            printf '  样本 %s：%s 字节\n' "$f" "$b"
            if [ "$b" -lt 40960 ]; then
              echo "::error::$f 只有 ${b} 字节（<40KB）—— 靶子样本无效，必须跨过 32KB 阈值"
              fail=1
            fi
          done
          # ③ 双向断言：同一段判据（linked_issue_ok）在两种大正文上必须给出相反结论
          if linked_issue_ok "$(cat "$big_with")"; then
            printf '  [ OK ] 大正文（含关闭关键字）→ 判据通过，不误报\n'
          else
            printf '  [FAIL] 大正文（含关闭关键字）→ 判据误报「缺少关闭关键字」—— #131 回归\n'
            fail=1
          fi
          if linked_issue_ok "$(cat "$big_without")"; then
            printf '  [FAIL] 大正文（不含关闭关键字）→ 判据仍然通过 —— 判据形同虚设（空断言）\n'
            fail=1
          else
            printf '  [ OK ] 大正文（不含关闭关键字）→ 判据按预期失败，仍能识别缺失\n'
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✅ #131：判据与实现同一段（LINKED_ISSUE_ASSERT 标记区）；大正文双向反向样本通过；工作流零「管道接 grep -q」"
      - name: 收尾恢复锚点及查询失败回归（真实 closeout + Git fixture；失败保全）
        run: |
          cd "$PM4GH_SKILL_ROOT"
          python3 - scripts/closeout.sh <<'PY_CLOSEOUT_TEST'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          script = Path(sys.argv[1]).resolve()
          stub = r'''#!/usr/bin/env python3
          import json, os
          from pathlib import Path
          import subprocess, sys
          root = Path(os.environ['FIXTURE'])
          d = json.loads((root/'pr.json').read_text())
          a = sys.argv[1:]
          if a[:2] == ['repo','view']:
              print('fixture/repo')
          elif a[:2] == ['api','user']:
              print('dispatcher')
          elif a[:2] == ['pr','view']:
              key = a[a.index('--json')+1]
              value = d[key]
              print(' '.join(map(str,value)) if isinstance(value,list) else value)
          elif a[:2] == ['issue','view']:
              key = a[a.index('--json')+1]
              if key == 'labels' and os.environ.get('LABEL_FAIL'): sys.exit(1)
              if key == 'labels' and os.environ.get('AFTER_CLEANUP'):
                  count_file = root/('label-reads-'+a[2])
                  count = int(count_file.read_text())+1 if count_file.exists() else 1
                  count_file.write_text(str(count))
                  if count > 1: sys.exit(1)
                  print('status/in-review')
                  sys.exit(0)
              print('CLOSED' if key == 'state' else '')
          elif a[0] == 'api' and a[1].endswith('/comments'):
              if os.environ.get('FETCH_FAIL'): sys.exit(1)
              n = a[1].split('/')[-2]
              p = root/('comments-'+n)
              if p.exists(): sys.stdout.write(p.read_text())
          elif a[:2] == ['issue','comment']:
              if os.environ.get('WRITE_FAIL'): sys.exit(1)
              n = a[2]
              body = Path(a[a.index('--body-file')+1]).read_text()
              local = subprocess.run(['git','show-ref','--verify','--quiet','refs/heads/'+d['headRefName']]).returncode == 0
              with (root/'writes').open('a') as f: f.write(n+' local='+str(int(local))+'\n')
              if not os.environ.get('DROP_WRITE'):
                  with (root/('comments-'+n)).open('a') as f: f.write(body+'\n')
          else:
              print('unexpected gh arguments: '+repr(a),file=sys.stderr)
              sys.exit(2)
          '''

          def git(root, *args):
              return subprocess.run(['git', *args], cwd=root, check=True, capture_output=True, text=True).stdout.strip()

          def case(name, *, local=False, expected=0, flags=(), env_extra=None, metadata=None, again=False):
              with tempfile.TemporaryDirectory(prefix='pm4gh-closeout-test-') as t:
                  root = Path(t)
                  repo = root/'repo'; repo.mkdir()
                  git(repo,'init','-b','main')
                  (repo/'seed').write_text('seed\n')
                  git(repo,'add','seed')
                  git(repo,'-c','user.name=fixture','-c','user.email=fixture@example.com','commit','-m','seed')
                  sha = git(repo,'rev-parse','HEAD')
                  remote = root/'origin.git'
                  subprocess.run(['git','init','--bare',str(remote)],check=True,capture_output=True)
                  git(repo,'remote','add','origin',str(remote))
                  (repo/'.github/rulesets').mkdir(parents=True)
                  (repo/'.github/rulesets/main-protection.json').write_text('{}')
                  data={'state':'MERGED','headRefName':'slice/1-fixture','headRefOid':sha,'mergeCommit':sha,'closingIssuesReferences':[1,2]}
                  data.update(metadata or {})
                  (root/'pr.json').write_text(json.dumps(data))
                  if local: git(repo,'branch',data['headRefName'])
                  bin_dir=root/'bin'; bin_dir.mkdir()
                  gh=bin_dir/'gh'; gh.write_text(stub); gh.chmod(0o755)
                  env=dict(os.environ,PATH=str(bin_dir)+os.pathsep+os.environ['PATH'],FIXTURE=str(root),PM4GH_LOCK_DIR=str(root/'locks'))
                  real_git = subprocess.run(['which','git'],capture_output=True,text=True,check=True).stdout.strip()
                  git_stub = bin_dir/'git'
                  git_stub.write_text('#!/usr/bin/env python3\nimport os, sys\nif sys.argv[1:2] == ["ls-remote"] and os.environ.get("REMOTE_FAIL"): sys.exit(128)\nos.execv(os.environ["REAL_GIT"], ["git", *sys.argv[1:]])\n')
                  git_stub.chmod(0o755)
                  env['REAL_GIT'] = real_git
                  env.update(env_extra or {})
                  fixture_script = script
                  if env.get('AFTER_CLEANUP'):
                      fixture_dir = root/'scripts'; fixture_dir.mkdir()
                      fixture_script = fixture_dir/'closeout.sh'
                      fixture_script.write_bytes(script.read_bytes())
                      status_stub = fixture_dir/'status.sh'
                      status_stub.write_text('#!/usr/bin/env bash\nexit 0\n'); status_stub.chmod(0o755)
                  p=subprocess.run(['bash',str(fixture_script),'9',*flags],cwd=repo,env=env,capture_output=True,text=True)
                  assert p.returncode == expected, f'{name}: expected exit {expected}, got {p.returncode}\n{p.stdout}{p.stderr}'
                  writes=(root/'writes').read_text().splitlines() if (root/'writes').exists() else []
                  if expected == 0:
                      for n in [1,2]:
                          body=(root/f'comments-{n}').read_text() if (root/f'comments-{n}').exists() else ''
                          assert sha in body and 'refs/pull/9/head' in body, f'{name}: Issue #{n} lacks recovery record'
                      assert len(writes)==2, f'{name}: expected one write per linked Issue, got {writes}'
                      if local:
                          assert all('local=1' in w for w in writes), f'{name}: deleted before recording'
                          assert subprocess.run(['git','show-ref','--verify','--quiet','refs/heads/'+data['headRefName']],cwd=repo).returncode != 0
                      if again:
                          q=subprocess.run(['bash',str(script),'9'],cwd=repo,env=env,capture_output=True,text=True)
                          assert q.returncode==0, q.stdout+q.stderr
                          assert (root/'writes').read_text().splitlines()==writes, f'{name}: rerun duplicated recovery comments'
                          dry=subprocess.run(['bash',str(script),'9','--dry-run'],cwd=repo,env=env,capture_output=True,text=True)
                          assert dry.returncode==0, dry.stdout+dry.stderr
                          assert (root/'writes').read_text().splitlines()==writes, f'{name}: dry run wrote comments'
                  else:
                      if '--dry-run' in flags or env_extra and any(env_extra.get(k) for k in ['FETCH_FAIL','WRITE_FAIL','REMOTE_FAIL','LABEL_FAIL','AFTER_CLEANUP']) or metadata:
                          assert not writes, f'{name}: unexpected writes {writes}'
                      if local:
                          assert subprocess.run(['git','show-ref','--verify','--quiet','refs/heads/'+data['headRefName']],cwd=repo).returncode == 0, f'{name}: deleted branch on failure'
                  print('PASS: '+name)

          case('merge already deleted local branch; all linked Issues recorded; rerun/dry-run idempotent',again=True)
          case('local branch retained until both recovery comments verified',local=True)
          case('dry-run missing anchor is FAIL and zero writes',expected=1,flags=('--dry-run',))
          case('dry-run local branch is FAIL and preserves branch',local=True,expected=1,flags=('--dry-run',))
          case('comment read failure is FAIL and zero writes',local=True,expected=1,env_extra={'FETCH_FAIL':'1'})
          case('comment write failure is FAIL and preserves branch',local=True,expected=1,env_extra={'WRITE_FAIL':'1'})
          case('successful API without persisted record is FAIL and preserves branch',local=True,expected=1,env_extra={'DROP_WRITE':'1'})
          case('missing PR head SHA is FAIL and zero writes',expected=1,metadata={'headRefOid':''})
          case('missing merge SHA is FAIL and zero writes',expected=1,metadata={'mergeCommit':''})
          case('unmerged PR cannot write anchors or delete branch',local=True,expected=1,metadata={'state':'OPEN'})
          case('remote query failed must not count as absent',local=True,expected=1,env_extra={'REMOTE_FAIL':'1'})
          case('Issue label query failed must not count as clear',expected=1,env_extra={'LABEL_FAIL':'1'})
          case('label readback after cleanup failure preserves local branch',local=True,expected=1,env_extra={'AFTER_CLEANUP':'1'})
          print('PASS: 13 closeout regression scenarios')
          PY_CLOSEOUT_TEST

      - name: 开工与交付提示随真实 skill 路径生成
        run: |
          cd "$PM4GH_SKILL_ROOT"
          python3 - <<'PY_HINT_PATH'
          import os
          import shlex
          from pathlib import Path
          import subprocess
          for name, leaves in [('start', ['/*.sh', '/status.sh', '/deliver.sh']), ('deliver', ['/deliver.sh', '/status.sh', '/review.sh', '/closeout.sh'])]:
              source = Path('scripts/'+name+'.sh').read_text()
              fragments = [line for line in source.splitlines() if 'printf ' in line and '"$SCRIPT_DIR"' in line]
              assert len(fragments) == (2 if name == 'start' else 4), (name, 'hint coverage lost')
              for prefix in ['scripts', '.agents/skills/pm4gh/scripts', '/tmp/skill with spaces/scripts']:
                  env = dict(os.environ, SCRIPT_DIR=prefix, ISSUE='17', PR_NUM='42', AS='author')
                  output = subprocess.check_output(['bash', '-c', '\n'.join(fragments)], env=env, text=True)
                  for leaf in leaves:
                      assert prefix+leaf in "\n".join(shlex.split(output)), (name, prefix, leaf, output)
                  assert 'scripts/scripts/' not in output
                  print('PASS: '+name+' next-step hints resolve under '+prefix)
          print('PASS: 6 real hint-fragment executions cover root, installed and spaced paths')
          PY_HINT_PATH
      - name: 项目自身测试套件 tests/run.sh（约定：exit 0 = 通过）
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # D6：门禁必须跑**项目自己的**交付物测试，否则 5 个必需检查在采用者仓库里
          # 只自检了工作流/规则集/标签/状态机，会给出「测试被验证过」的假印象。
          # 约定（**唯一一套**，不发明第二套）：tests/run.sh 存在且可执行 = 项目声明了测试套件，
          # 运行它，**退出码 0 = 通过**；tests/ 不存在 = 本项目未声明测试套件。
          # 本步骤**必须**明确打印「跑了」还是「未声明」——**不允许**静默跳过。
          # 反绕过：删掉 tests/ 就能绕过本步骤 → 由 preflight.sh 第 3 段与 ci/test 同源的断言
          # 堵住「有 tests/ 却没有合法入口（缺失 / 不可执行）」。
          if [ ! -e tests ]; then
            printf '[ OK ] 本项目未声明测试套件（无 tests/ 目录；约定：tests/run.sh，exit 0 = 通过）—— 本步骤未运行任何项目测试\n'
            exit 0
          fi
          if [ ! -d tests ]; then
            echo "::error file=tests::tests 存在但不是目录 —— 约定：测试入口固定为 tests/run.sh（exit 0 = 通过）"
            exit 1
          fi
          if [ ! -f tests/run.sh ]; then
            echo "::error file=tests/run.sh::tests/ 存在但缺少 tests/run.sh —— 约定：测试入口固定为 tests/run.sh（exit 0 = 通过）；缺入口 = 有测试却没接线门禁"
            exit 1
          fi
          if [ ! -x tests/run.sh ]; then
            echo "::error file=tests/run.sh::tests/run.sh 没有可执行位 —— 修复：chmod +x tests/run.sh"
            exit 1
          fi
          printf '[ OK ] 本项目声明了测试套件 tests/run.sh（约定 exit 0 = 通过）→ 现在运行它（完整输出见下）\n'
          log="$(mktemp "${TMPDIR:-/tmp}/project-tests.XXXXXX")"
          rc=0
          set +e
          ./tests/run.sh 2>&1 | tee "$log"
          rc="${PIPESTATUS[0]}"
          set -e
          printf '\n──── tests/run.sh 原始输出尾部（最后 20 行）────\n'
          tail -n 20 "$log"
          rm -f "$log"
          if [ "$rc" -ne 0 ]; then
            echo "::error file=tests/run.sh::项目测试套件失败：tests/run.sh 退出码 ${rc}（约定：exit 0 = 通过）"
            exit 1
          fi
          printf '✅ 项目测试套件 tests/run.sh 通过（退出码 0）—— 本次交付物的测试由门禁真实执行过\n'
      - name: references/ 与 SKILL.md 路由双向一致（(a) 无孤儿 .md / (b) 无悬空链接 + 反向样本）
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          # D5 回归靶子：#126 重构把「异常处理」整节弄丢，而当时的 ci/test 只断言「标记区逐字一致」，
          # **没有**任何断言把 references/ 与 SKILL.md 的对应关系变成机器可判 → 整节丢失 / 孤儿文件 /
          # 悬空链接都能静默过关。本步骤补上这条**结构判据**：
          #   (a) references/ 下每个 .md 都必须被 SKILL.md 引用（防孤儿文件）
          #   (b) SKILL.md 里每个 references/xxx.md 链接都必须存在（防悬空链接）
          # 判据只有一处（下面的三个函数），**禁止**在别处复写第二份；任何一侧解析不出集合 → FAIL
          # （fail-closed：不允许"解析不到就算通过"）。
          skill=SKILL.md
          refs_dir=references
          links_of() { grep -oE 'references/[A-Za-z0-9._/-]+\.md' "$1" 2>/dev/null | sort -u; }
          files_of() { ( cd "$1" 2>/dev/null && find . -type f -name '*.md' | sed -E 's#^\./##; s#^#references/#' ) | sort -u; }
          orphans_of() {   # $1=SKILL.md  $2=references 目录 → 未被 $1 引用的 .md
            l="$(links_of "$1")"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              grep -qxF "$f" <<<"$l" || printf '%s\n' "$f"
            done <<<"$(files_of "$2")"
          }
          dangling_of() {  # $1=SKILL.md  $2=仓库根 → 指向不存在文件的链接
            while IFS= read -r l; do
              [ -n "$l" ] || continue
              [ -e "$2/$l" ] || printf '%s\n' "$l"
            done <<<"$(links_of "$1")"
          }
          bad=0
          links="$(links_of "$skill")"
          files="$(files_of "$refs_dir")"
          if [ -z "$links" ]; then
            echo "::error file=$skill::解析不出任何 references/xxx.md 链接 —— 判据不成立（fail-closed）"
            bad=1
          fi
          if [ -z "$files" ]; then
            echo "::error file=$refs_dir::解析不出任何 .md 文件 —— 判据不成立（fail-closed）"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          printf 'SKILL.md 解析出 %s 个链接：%s\n' "$(printf '%s\n' "$links" | grep -c .)" "$(printf '%s' "$links" | tr '\n' ' ')"
          printf 'references/ 实际 %s 个 .md：%s\n' "$(printf '%s\n' "$files" | grep -c .)" "$(printf '%s' "$files" | tr '\n' ' ')"
          # ① 正向：真实仓库上两条断言都必须通过
          o="$(orphans_of "$skill" "$refs_dir")"
          d="$(dangling_of "$skill" ".")"
          if [ -n "$o" ]; then
            printf '  [FAIL] (a) references/ 下存在未被 SKILL.md 引用的孤儿文件：\n%s\n' "$o" >&2
            bad=1
          else
            printf '  [ OK ] (a) 无孤儿：references/ 下 %s 个 .md 全部被 SKILL.md 引用\n' "$(printf '%s\n' "$files" | grep -c .)"
          fi
          if [ -n "$d" ]; then
            printf '  [FAIL] (b) SKILL.md 里存在指向不存在文件的悬空链接：\n%s\n' "$d" >&2
            bad=1
          else
            printf '  [ OK ] (b) 无悬空：SKILL.md 里 %s 个 references/xxx.md 链接全部存在\n' "$(printf '%s\n' "$links" | grep -c .)"
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          # ② 反向样本：在**临时副本**里做（不动工作区），两条断言各自都必须**能失败**。
          #    样本目标从真实链接里取（first / last），**不写死文档名** —— 采用者改了文件名依然有效。
          target=""; dtarget=""
          while IFS= read -r l; do
            [ -n "$l" ] || continue
            [ -n "$target" ] || target="$l"
            dtarget="$l"
          done <<<"$links"
          T="$(mktemp -d "${TMPDIR:-/tmp}/doc-routes.XXXXXX")"
          trap 'rm -rf "$T"' EXIT
          reset_copy() {
            rm -rf "$T/references"; mkdir -p "$T/references"
            cp "$skill" "$T/SKILL.md"
            cp "$refs_dir"/*.md "$T/references/"
          }
          # (a) 删掉一处引用（含该链接的整行）→ 该文件变孤儿 → 断言 (a) 必须 FAIL
          reset_copy
          grep -vF "$target" "$T/SKILL.md" > "$T/SKILL.md.tmp"; mv "$T/SKILL.md.tmp" "$T/SKILL.md"
          rs="$(orphans_of "$T/SKILL.md" "$T/references")"
          if grep -qxF "$target" <<<"$rs"; then
            printf '  [ OK ] 反向样本 (a) 删掉 `%s` 的引用 → 断言 (a) 按预期 FAIL（孤儿：%s）\n' "$target" "$(printf '%s' "$rs" | tr '\n' ' ')"
          else
            printf '  [FAIL] 反向样本 (a) 未按预期失败：删掉 `%s` 的引用后未报孤儿（实际 [%s]）\n' "$target" "$(printf '%s' "$rs" | tr '\n' ' ')" >&2
            bad=1
          fi
          # (b) 新建一个未被引用的 references/zzz.md → 断言 (a) 必须 FAIL
          reset_copy
          printf '# zzz\n\n反向样本：本文件故意不被 SKILL.md 引用。\n' > "$T/references/zzz.md"
          rs="$(orphans_of "$T/SKILL.md" "$T/references")"
          if [ "$rs" = "references/zzz.md" ]; then
            printf '  [ OK ] 反向样本 (b) 新建未被引用的 `references/zzz.md` → 断言 (a) 按预期 FAIL（孤儿：%s）\n' "$rs"
          else
            printf '  [FAIL] 反向样本 (b) 未按预期失败：期望孤儿 references/zzz.md，实际 [%s]\n' "$(printf '%s' "$rs" | tr '\n' ' ')" >&2
            bad=1
          fi
          # (c) 删掉一处被引用的文件（链接仍在）→ 断言 (b) 必须 FAIL
          reset_copy
          rm -f "$T/$dtarget"
          rs="$(dangling_of "$T/SKILL.md" "$T")"
          if [ "$rs" = "$dtarget" ]; then
            printf '  [ OK ] 反向样本 (c) 删掉被引用文件 `%s`（链接仍在）→ 断言 (b) 按预期 FAIL（悬空：%s）\n' "$dtarget" "$rs"
          else
            printf '  [FAIL] 反向样本 (c) 未按预期失败：期望悬空 %s，实际 [%s]\n' "$dtarget" "$(printf '%s' "$rs" | tr '\n' ' ')" >&2
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          printf '✅ 路由判据：references/ 无孤儿 .md + SKILL.md 无悬空链接；反向样本 (a) 删引用 `%s` / (b) 新建未引用 `references/zzz.md` / (c) 删被引用 `%s` 三例均按预期 FAIL\n' "$target" "$dtarget"
      - name: 文档命令可执行性 + 启动清单全量覆盖（与脚本参数解析/权威清单逐条对齐 + 反向样本）
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          # ── C3②｜文档命令可执行性：文档里的 scripts/*.sh 命令形态 vs 脚本的**真实参数解析** ──
          # 抽取范围：SKILL.md + references/*.md 里「看起来是命令行」的片段（行内 code span / fenced 代码块）。
          # 契约：每个接受参数的脚本都提供 `--parse-only` **零副作用解析路径**（见各脚本参数解析区注释）——
          #   它只做参数解析 + 参数级取值域校验，在**任何**仓库 / 凭据 / 网络 / 写操作之前 exit 0。
          #   本步骤喂给脚本的**永远**是 `--parse-only`，因此不可能真正执行写操作。
          # 为什么需要它（#147）：文档与「脚本实际接受的形态」是同一事实的两处载体；没有逐字断言时，
          #   改脚本参数而忘改文档**不会被任何检查发现** —— 直到有人照抄文档、被拒（C1 在「命令」上的表现）。
          # 判定（三态显式，C2）：[ OK ] 解析通过 ／ [FAIL] 不一致（file:line + 原文 + 修法）／
          #   [ SKIP ] 显式标记 `<!-- 非可执行示例 -->` 的行 —— **打印且不计入通过**。
          # 无参数形态（如 `scripts/preflight.sh`）：只断言「存在 + 可执行位」，**不执行**。
          work="$(mktemp -d "${TMPDIR:-/tmp}/doc-cmd.XXXXXX")"
          trap 'rm -rf "$work"' EXIT

          cat > "$work/extract.awk" <<'AWK'
          BEGIN { fence = 0 }
          {
            raw = $0
            gsub(/\t/, " ", raw)
            if (raw ~ /<!--[ \t]*非可执行示例[ \t]*-->[ \t]*$/) { printf "%s\t%d\tSKIP\t-\t%s\n", FILENAME, FNR, raw; next }
            if (raw ~ /^[ \t]*(```|~~~)/) { fence = 1 - fence; next }
            n = 0
            if (fence) { frag[n++] = raw }
            else {
              m = split(raw, parts, "`")
              for (i = 2; i <= m; i += 2) frag[n++] = parts[i]
            }
            for (k = 0; k < n; k++) scan(frag[k], FNR)
          }
          function scan(s, ln,   rest, name, c) {
            while (match(s, /scripts\/[a-z-]+\.sh/)) {
              name = substr(s, RSTART, RLENGTH)
              rest = substr(s, RSTART + RLENGTH)
              c = substr(rest, 1, 1)
              if (c == ":" || (c != "" && c != " " && c != "\t")) { s = rest; continue }
              sub(/^[ \t]+/, "", rest)
              sub(/[ \t]*(&&|\|\||;).*$/, "", rest)
              sub(/[ \t]+$/, "", rest)
              printf "%s\t%d\tCMD\t%s\t%s\n", FILENAME, FNR, name, rest
              s = rest
            }
          }
          AWK

          cat > "$work/normalize.awk" <<'AWK'
          function fill(v) {
            if (v == "<n>" || v == "<issue#>" || v == "<pr#>" || v == "<pr#>") return "999"
            if (v == "<state>") return "in-progress"
            if (v == "<from>") return "backlog"
            if (v == "<to>") return "ready"
            if (v == "<身份>") return "author"
            if (v == "<文件>") return ENVIRON["PROBE_BODY"]
            if (v == "<分支名>") return "chore/147-probe"
            if (v == "<原因>" || v == "<说明>") return "probe"
            if (v == "<type>") return "hotfix"
            return v
          }
          {
            n = split($0, t, /[ \t]+/); out = ""
            for (i = 1; i <= n; i++) { if (t[i] == "") continue; v = fill(t[i]); out = (out == "" ? v : out " " v) }
            print out
          }
          AWK

          # 占位符 → 具体值（占位符是本仓库文档的既有约定，见 SKILL.md「输入」）。
          # `<文件>` 指向一个**真的存在**的正文文件，避免把「文件不存在」误判成参数错。
          printf '## 1. 变更摘要\n探针占位正文（只用于 --body-file 的取值形态，不会被真正使用）。\n' > "$work/body.md"
          PROBE_BODY="$work/body.md"; export PROBE_BODY
          normalize() { printf '%s' "$1" | awk -f "$work/normalize.awk"; }

          # ── 判据本体：$1 = 根目录（其下有 SKILL.md 与 references/）；返回 0 = 全通过 ──
          # 逐条结果写 stdout；明细写 $work/last-rows；计数写 $work/last-summary。
          # **唯一一份实现**：正向与全部反向样本都调用它（不允许第二套）。
          judge() {
            root="$1"
            rows="$work/last-rows"
            ( cd "$root" && awk -f "$work/extract.awk" SKILL.md references/*.md ) > "$rows" || return 1
            if ! grep -q 'scripts/' "$rows"; then
              printf '::error::%s 下抽不出任何 scripts/*.sh 命令形态 —— 判据不成立（fail-closed：解析不到 ≠ 通过）\n' "$root" >&2
              printf '0 0 1 0\n' > "$work/last-summary"
              return 1
            fi
            jtotal=0; jok=0; jbad=0; jskip=0
            while IFS="$(printf '\t')" read -r f l kind sc ar; do
              [ -n "$f" ] || continue
              jtotal=$((jtotal + 1))
              if [ "$kind" = "SKIP" ]; then
                jskip=$((jskip + 1))
                printf '[ SKIP ] %s:%s 显式标记为非可执行示例（**不计入通过**）：%s\n' "$f" "$l" "$ar"
                continue
              fi
              # 无参数形态：只断言存在 + 可执行位（不执行 —— 零副作用）
              if [ -z "$ar" ]; then
                if [ -f "$root/$sc" ] && [ -x "$root/$sc" ]; then
                  jok=$((jok + 1))
                  printf '[ OK ]  %s:%s %s —— 无参数形态：存在且可执行（未执行）\n' "$f" "$l" "$sc"
                else
                  jbad=$((jbad + 1))
                  printf '::error file=%s,line=%s::文档引用了不存在（或不可执行）的脚本：%s\n' "$f" "$l" "$sc"
                fi
                continue
              fi
              # `a|b` 不是可执行形态（shell 会当管道）—— 必须改写或显式标记
              if grep -q '|' <<<"$ar"; then
                jbad=$((jbad + 1))
                printf '::error file=%s,line=%s::`%s %s` 不是可执行形态：`|` 在 shell 里是管道，不是「二选一」\n' "$f" "$l" "$sc" "$ar"
                printf '       修法（首选）：改写成单值形态，把其它取值放进文字（例：`%s <n> approve --body-file <文件>`）；\n' "$sc"
                printf '       或在该行末尾加 `<!-- 非可执行示例 -->` 显式标记（标记行会在本步骤日志里逐条打印、不计入通过）。\n'
                continue
              fi
              # 契约闸门：**绝不执行**没有 `--parse-only` 解析路径的脚本 ——
          # 这是「严禁真正执行写操作」的可证形式：为了校验文档而真跑命令是不允许的。
          if ! grep -q -- '--parse-only' "$root/$sc"; then
            jbad=$((jbad + 1))
            printf '::error file=%s,line=%s::脚本 %s **没有** --parse-only 零副作用解析路径 —— 判据拒绝执行它\n' "$f" "$l" "$sc"
            printf '       修法：给 %s 加解析路径（参数解析 + 参数级取值域校验后 exit 0，见其它脚本的「参数级校验」段）；或把该行标为非可执行示例。\n' "$sc"
            continue
          fi
          argv="$(normalize "$ar")"
              rc=0
              out="$(bash "$root/$sc" --parse-only $argv < /dev/null 2>&1)" || rc=$?
              if [ "$rc" -eq 0 ] && grep -q '参数解析通过' <<<"$out"; then
                jok=$((jok + 1))
                printf '[ OK ]  %s:%s %s %s\n' "$f" "$l" "$sc" "$argv"
              else
                jbad=$((jbad + 1))
                printf '::error file=%s,line=%s::文档里的命令形态不被脚本参数解析接受：`%s %s`（填占位符后试算：%s %s）\n' \
                  "$f" "$l" "$sc" "$ar" "$sc" "$argv"
                printf '%s\n' "$out" | sed 's/^/        /'
                printf '       修法：① 改文档，使其与脚本参数解析一致（首选）；② 改脚本参数解析**并同步**文档（两处都是事实载体）；\n'
                printf '       ③ 确属不能执行的历史/示例片段：改写成可执行形态，或在该行末尾加 `<!-- 非可执行示例 -->`（会被打印、不计入通过）。\n'
              fi
            done < "$rows"
            printf '%s %s %s %s\n' "$jtotal" "$jok" "$jbad" "$jskip" > "$work/last-summary"
            printf '摘要：抽出命令形态 %s 条 → 通过 %s ／ 不一致 %s ／ 显式跳过 %s（跳过不计入通过）\n' \
              "$jtotal" "$jok" "$jbad" "$jskip"
            [ "$jbad" -eq 0 ] || return 1
            return 0
          }

          # ── C4② 覆盖度判据：bootstrap-checklist.md 的机器可读索引 vs 三份权威清单 ──
          # 三份权威清单的**条目数不由人手抄**：陷阱号从 traps.md 的 `**N.` 标题取，预检段号从
          # preflight.sh 的 `info "N/10` 取，替换点号从 portability.md §1 表格行取。
          # 清单里的编号少一个 / 多一个 → FAIL 并指出差在哪（防"清单悄悄过期"）。
          cov_check() { # $1 = 根目录
            root="$1"
            cf="$root/references/bootstrap-checklist.md"
            if [ ! -f "$cf" ]; then
              printf '::error file=references/bootstrap-checklist.md::启动清单缺失 —— 新项目落地无清单可抄\n' >&2
              return 1
            fi
            src_traps="$(grep -oE '^\*\*[0-9]+\.' "$root/references/traps.md" 2>/dev/null | grep -oE '[0-9]+' | sort -n | tr '\n' ' ' | sed -E 's/[[:space:]]+$//' || true)"
            src_pf="$(grep -oE '^info "[0-9]+/10 ' "$root/scripts/preflight.sh" 2>/dev/null | sed -E 's/^info "([0-9]+)\/10 .*/\1/' | sort -n | tr '\n' ' ' | sed -E 's/[[:space:]]+$//' || true)"
            src_pt="$(grep -E '^\| [0-9]+ \|' "$root/references/portability.md" 2>/dev/null | sed -E 's/^\| ([0-9]+) \|.*/\1/' | sort -n | tr '\n' ' ' | sed -E 's/[[:space:]]+$//' || true)"
            cl_traps="$(sed -n '/BOOTSTRAP_COVERAGE:BEGIN/,/BOOTSTRAP_COVERAGE:END/p' "$cf" | grep -E '^traps=' | sed -E 's/^traps=//; s/,/ /g' | tr -s ' ' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' || true)"
            cl_pf="$(sed -n '/BOOTSTRAP_COVERAGE:BEGIN/,/BOOTSTRAP_COVERAGE:END/p' "$cf" | grep -E '^preflight=' | sed -E 's/^preflight=//; s/,/ /g' | tr -s ' ' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' || true)"
            cl_pt="$(sed -n '/BOOTSTRAP_COVERAGE:BEGIN/,/BOOTSTRAP_COVERAGE:END/p' "$cf" | grep -E '^portability=' | sed -E 's/^portability=//; s/,/ /g' | tr -s ' ' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' || true)"
            cbad=0
            for spec in "traps|$src_traps|$cl_traps" "preflight|$src_pf|$cl_pf" "portability|$src_pt|$cl_pt"; do
              kind="${spec%%|*}"; rest="${spec#*|}"; src="${rest%%|*}"; cl="${rest#*|}"
              if [ -z "$src" ]; then
                printf '::error file=references/bootstrap-checklist.md::%s 的权威条目号解析为空 —— 判据不成立（fail-closed）\n' "$kind" >&2
                cbad=1; continue
              fi
              if [ "$src" != "$cl" ]; then
                printf '::error file=references/bootstrap-checklist.md::启动清单的 %s 编号与权威清单不一致（文档漂移）\n' "$kind" >&2
                printf '       权威（来自源文件）：%s\n' "$src" >&2
                printf '       清单索引（BOOTSTRAP_COVERAGE 区）：%s\n' "$cl" >&2
                printf '       修法：把漏掉/多出的编号补进 references/bootstrap-checklist.md 的对应小节与 BOOTSTRAP_COVERAGE 索引（**逐条**，不要只改计数）\n' >&2
                cbad=1; continue
              fi
              printf '[ OK ]  %s 全量覆盖：%s 条（%s）\n' "$kind" "$(printf '%s' "$src" | tr ' ' '\n' | grep -c .)" "$src"
            done
            [ "$cbad" -eq 0 ] || return 1
            return 0
          }

          # ── 正向：真实仓库 ──────────────────────────────────────────────────────
          echo "== 正向：SKILL.md + references/*.md 里的命令形态 =="
          jrc=0; judge . > "$work/main.log" 2>&1 || jrc=$?
          cat "$work/main.log"
          [ "$jrc" -eq 0 ] || { echo "❌ 判据在真实仓库上失败：见上方 ::error::（文件:行 + 修法）"; exit 1; }
          read -r m_total m_ok m_bad m_skip < "$work/last-summary"
          # 非空断言（防抽取器退化 → 恒通过）
          if [ "$m_total" -lt 10 ]; then
            echo "::error file=SKILL.md::只抽出 ${m_total} 条命令形态（<10）—— 抽取器可能已退化，判据不成立（fail-closed）"
            exit 1
          fi
          # 必须覆盖「status.sh 写迁移」这一类（本判据的核心样本：写迁移缺 --as 必须能被抓）
          if ! awk -F'\t' '$3=="CMD" && $4=="scripts/status.sh" && $5 ~ /--as/ && $5 !~ /^--check/ {found=1} END{exit !found}' "$work/last-rows"; then
            echo "::error file=SKILL.md::文档里抽不到任何 status.sh 写迁移形态（<n> <state> --as <身份>）—— 判据样本缺失（fail-closed）"
            exit 1
          fi
          printf '[ OK ]  非空断言：抽出 %s 条（含 status.sh 写迁移形态）；显式跳过 %s 条\n' "$m_total" "$m_skip"

          echo
          echo "== C4② 启动清单覆盖度（traps.md / preflight.sh / portability.md 的全量条目）=="
          crc0=0; cov_check . || crc0=$?
          [ "$crc0" -eq 0 ] || { echo "❌ 启动清单覆盖度判据失败：见上方 ::error::"; exit 1; }

          # ── 反向样本（全部在临时副本里做，不动工作区）────────────────────────────
          # 样本目标从**真实抽取结果**里选（不写死文件名/行号）—— 采用者改了文件名依然有效。
          sample="$(awk -F'\t' '$3=="CMD" && $4=="scripts/status.sh" && $5 ~ /--as/ && $5 !~ /^--check/ {print $1":"$2; exit}' "$work/last-rows")"
          [ -n "$sample" ] || { echo "::error::找不到 status.sh 写迁移样本，反向样本无法构造（fail-closed）"; exit 1; }
          sfile="${sample%%:*}"; sline="${sample##*:}"
          echo
          echo "== 反向样本（临时副本；目标 = ${sfile}:${sline}）=="
          mk_copy() { # $1 = 目标目录；把文档与脚本复制进去（判据在副本上重跑）
            rm -rf "$1"; mkdir -p "$1"
            cp SKILL.md "$1/"
            cp -R references "$1/"
            cp -R scripts "$1/"
          }

          # A：删掉该命令的 `--as <值>` → 判据**必须** FAIL（#147 要求的那一条）
          mk_copy "$work/A"
          awk -v ln="$sline" 'NR == ln { sub(/--as[ \t]+[^ \t`]+[ \t]*/, ""); print; next } { print }' \
            "$work/A/$sfile" > "$work/A/$sfile.tmp" && mv "$work/A/$sfile.tmp" "$work/A/$sfile"
          arc=0; judge "$work/A" > "$work/A.log" 2>&1 || arc=$?
          sed -n '1,12p' "$work/A.log" | sed 's/^/   /'
          if [ "$arc" -ne 0 ] && grep -q '\[FAIL\]\|::error file=' "$work/A.log"; then
            printf '  [ OK ] 反向样本 A：删掉 `--as` → 判据按预期 FAIL（原文见上）\n'
          else
            printf '  [FAIL] 反向样本 A 未失败：删掉 `--as` 后判据仍然通过 —— 判据形同虚设\n' >&2
            exit 1
          fi

          # B：恢复（同一份未改动副本）→ 判据**必须**通过
          mk_copy "$work/B"
          brc=0; judge "$work/B" > "$work/B.log" 2>&1 || brc=$?
          if [ "$brc" -eq 0 ] && grep -q '通过' "$work/B.log"; then
            printf '  [ OK ] 反向样本 B：恢复后判据通过（%s）\n' "$(tail -n 1 "$work/B.log")"
          else
            printf '  [FAIL] 反向样本 B 未通过：恢复后判据仍失败\n' >&2
            sed 's/^/   /' "$work/B.log" >&2
            exit 1
          fi

          # C：把 `--as` 的值改成非法身份 → 判据**必须** FAIL（证明「取值域校验真的接进了判据」）
          mk_copy "$work/C"
          awk -v ln="$sline" 'NR == ln { sub(/--as[ \t]+[^ \t`]+/, "--as authro"); print; next } { print }' \
            "$work/C/$sfile" > "$work/C/$sfile.tmp" && mv "$work/C/$sfile.tmp" "$work/C/$sfile"
          crc=0; judge "$work/C" > "$work/C.log" 2>&1 || crc=$?
          if [ "$crc" -ne 0 ] && grep -q '未知身份' "$work/C.log"; then
            printf '  [ OK ] 反向样本 C：`--as authro`（非法身份）→ 判据按预期 FAIL，原文含「未知身份」\n'
          else
            printf '  [FAIL] 反向样本 C 未失败：非法身份没被抓到（判据只做了形态匹配，没接真实解析）\n' >&2
            sed 's/^/   /' "$work/C.log" >&2
            exit 1
          fi

          # D：把脚本名改成不存在的脚本 → 判据**必须** FAIL（证明存在性断言不是空断言）
          mk_copy "$work/D"
          awk -v ln="$sline" 'NR == ln { gsub(/scripts\/status\.sh/, "scripts/status-typo.sh"); print; next } { print }' \
            "$work/D/$sfile" > "$work/D/$sfile.tmp" && mv "$work/D/$sfile.tmp" "$work/D/$sfile"
          drc=0; judge "$work/D" > "$work/D.log" 2>&1 || drc=$?
          if [ "$drc" -ne 0 ] && grep -q 'status-typo.sh' "$work/D.log"; then
            printf '  [ OK ] 反向样本 D：脚本名不存在 → 判据按预期 FAIL（存在性断言有效）\n'
          else
            printf '  [FAIL] 反向样本 D 未失败：不存在的脚本没被抓到\n' >&2
            sed 's/^/   /' "$work/D.log" >&2
            exit 1
          fi

          # E：把**坏**命令显式标记为非可执行示例 → 判据**必须**跳过它（打印 [ SKIP ]）且整体通过
          #    （证明 SKIP 分支有效；同时证明被跳过的行**显式打印**、不计入通过 —— C2 三态）
          mk_copy "$work/E"
          awk -v ln="$sline" 'NR == ln { sub(/--as[ \t]+[^ \t`]+[ \t]*/, ""); print $0 " <!-- 非可执行示例 -->"; next } { print }' \
            "$work/E/$sfile" > "$work/E/$sfile.tmp" && mv "$work/E/$sfile.tmp" "$work/E/$sfile"
          erc=0; judge "$work/E" > "$work/E.log" 2>&1 || erc=$?
          if [ "$erc" -eq 0 ] && grep -q '\[ SKIP \]' "$work/E.log" && grep -q '不计入通过' "$work/E.log"; then
            printf '  [ OK ] 反向样本 E：坏命令被显式标记 → 判据跳过并**打印**（不计入通过），整体通过\n'
            grep '\[ SKIP \]' "$work/E.log" | sed 's/^/   /'
          else
            printf '  [FAIL] 反向样本 E 未按预期：标记行没有被跳过或没有打印\n' >&2
            sed 's/^/   /' "$work/E.log" >&2
            exit 1
          fi


          # F：把清单索引里的最后一个陷阱号删掉 → 覆盖度判据**必须** FAIL（证明它不是空断言）
          mk_copy "$work/F"
          awk 'NR == 1 { print } /^traps=/ { sub(/,[0-9]+$/, ""); print; next } { print }' \
            "$work/F/references/bootstrap-checklist.md" > "$work/F/references/bootstrap-checklist.md.tmp" \
            && mv "$work/F/references/bootstrap-checklist.md.tmp" "$work/F/references/bootstrap-checklist.md"
          frc=0; cov_check "$work/F" > "$work/F.log" 2>&1 || frc=$?
          if [ "$frc" -ne 0 ] && grep -q 'traps 编号与权威清单不一致' "$work/F.log"; then
            printf '  [ OK ] 反向样本 F：清单漏掉最后一个陷阱号 → 覆盖度判据按预期 FAIL\n'
            sed -n '1,6p' "$work/F.log" | sed 's/^/   /'
          else
            printf '  [FAIL] 反向样本 F 未失败：清单漏条没被抓到\n' >&2
            sed 's/^/   /' "$work/F.log" >&2
            exit 1
          fi

          echo
          echo "✅ 文档命令可执行性：抽出 ${m_total} 条形态（通过 ${m_ok} ／ 跳过 ${m_skip}）全部与脚本参数解析一致；"
          echo "   反向样本 A（删 --as → FAIL）／B（恢复 → 通过）／C（非法身份 → FAIL）／D（脚本不存在 → FAIL）／E（显式标记 → 跳过并打印）／F（清单漏条 → FAIL）全部按预期"
      - name: 替换点清单的符号锚点（零 path:line + 锚点逐字存在 + 行号必须带锚点；反向样本）
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          # ── #160（C1）：需要长期准确的引用改用**符号锚点**，消灭 `file:line` 的静默漂移 ──
          # 背景：#154 向 SKILL.md / references/flow.md 插入行后，references/portability.md 的替换点清单里
          #   按 `file:line` 写的定位**全部静默漂移**（行号仍"在文件范围内"，preflight 10 组 + ci/test 全绿）——
          #   这正是「在范围内但内容已经错了」检不出来的形态（C1：单一事实多处载体）。
          # 判据（**唯一一份实现**，正向与全部反向样本共用）：
          #   (a) 静态禁令：references/portability.md 与 references/bootstrap-checklist.md 零 `path:line` 形态；
          #   (b1) 每条替换点（§1 的 `| N |` 行）必须至少有一个锚点；
          #   (b2) 锚点存在性：每个 `路径`（锚点：`字面文本`）的锚点必须在**该文件里逐字存在**（缺失 → FAIL + 条目/文件）；
          #   (c) 其余文档里含 `path:line` 的行**必须**同行带锚点（行号只做定位、锚点做判据）；围栏内的示例豁免。
          # fail-closed：抽不到锚点（<11）/ 解析不出替换点 → 直接 FAIL（不允许"解析不到就算通过"）。
          # 锚点记法：`路径`（锚点：`字面文本`；`字面文本`）—— 多条用 `；` 分隔；字面文本里不得含反引号 / 全角右括号。
          work="$(mktemp -d "${TMPDIR:-/tmp}/anchor.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          
          cat > "$work/anchor_scan.awk" <<'AWK'
          BEGIN { fence = 0 }
          FNR == 1 { fence = 0 }
          function emit(s, file, ln,   i, j, k, head, path, rest, e, inner, n, parts, p, lit) {
            while ((i = index(s, "`（锚点：")) > 0) {
              head = substr(s, 1, i - 1); j = 0
              for (k = 1; k <= length(head); k++) if (substr(head, k, 1) == "`") j = k
              rest = substr(s, i + length("`（锚点：")); e = index(rest, "）")
              if (j == 0 || e == 0) {
                printf "SYNTAX\t%s\t%d\n", file, ln
                if (e == 0) { s = "" } else { s = substr(rest, e + length("）")) }
                continue
              }
              path = substr(head, j + 1, i - 1 - j); inner = substr(rest, 1, e - 1)
              n = split(inner, parts, "；")
              for (p = 1; p <= n; p++) {
                lit = parts[p]; sub(/^`/, "", lit); sub(/`$/, "", lit)
                if (lit == "" || path == "") printf "SYNTAX\t%s\t%d\n", file, ln
                else printf "ANCHOR\t%s\t%d\t%s\t%s\n", file, ln, path, lit
              }
              s = substr(rest, e + length("）"))
            }
          }
          {
            raw = $0
            if (raw ~ /^[ \t]*(```|~~~)/) { fence = 1 - fence; next }
            emit(raw, FILENAME, FNR)
            if (!fence) {
              s = raw
              while (match(s, /[A-Za-z0-9_.\/-]+\.(md|sh|yml|json):[0-9]+/)) {
                ref = substr(s, RSTART, RLENGTH); p = ref; sub(/:[0-9]+$/, "", p)
                if (index(raw, "`" p "`（锚点：") == 0) { printf "PL\t%s\t%d\t%s\n", FILENAME, FNR, p } else { printf "PLL\t%s\t%d\t%s\t%d\n", FILENAME, FNR, p, substr(ref, length(p) + 2) }
                s = substr(s, RSTART + RLENGTH)
              }
            }
          }
          AWK
          
          STRICT="references/portability.md references/bootstrap-checklist.md"
          PLRE='[A-Za-z0-9_./-]+\.(md|sh|yml|json):[0-9]+'
          
          anchor_judge() { # $1 = 根目录；返回 0 = 全通过
            root="$1"; bad=0; scan="$work/scan.tsv"; : > "$scan"
            ( cd "$root" && LC_ALL=C awk -f "$work/anchor_scan.awk" SKILL.md references/*.md ) > "$scan" || true
          
            # (a) 静态禁令
            for f in $STRICT; do
              if [ ! -f "$root/$f" ]; then
                printf '::error file=%s::替换点清单缺失 —— 锚点判据无从成立（fail-closed）\n' "$f" >&2; bad=1; continue
              fi
              hits="$(grep -oE "$PLRE" "$root/$f" | wc -l | tr -d ' ')"
              if [ "$hits" -ne 0 ]; then
                printf '::error file=%s::(a) 静态禁令：替换点清单里不得出现 `path:line` 形态 —— 实测 %s 处\n' "$f" "$hits" >&2
                grep -nE "$PLRE" "$root/$f" | sed 's/^/       /' >&2
                printf '       修法：改成 `路径`（锚点：`该文件里逐字存在的字面文本`）—— 行号会随上游增删行静默漂移（#154 实测）\n' >&2
                bad=1
              else
                printf '[ OK ]  (a) %s 零 `path:line`\n' "$f"
              fi
            done
          
            # (c) 含 `path:line` 的行必须同行带锚点；保留行号时还要断言**锚点就在那一行**
            #     （行号只做定位、锚点做判据；扫描器已豁免围栏内的示例行）
            if awk -F'\t' '$1=="PL"{f=1} END{exit !f}' "$scan"; then
              while IFS="$(printf '\t')" read -r _ pf pln ppath; do
                [ -n "$pf" ] || continue
                printf '::error file=%s,line=%s::(c) 含 `path:line` 的行必须**同行**带锚点（行号只做定位、锚点做判据）：缺 `%s`（锚点：…）\n' "$pf" "$pln" "$ppath" >&2
                bad=1
              done <<EOF
          $(awk -F'\t' '$1=="PL"' "$scan")
          EOF
            fi
          
            # (c2) 保留了行号的行：断言锚点**就在该行号指向的那一行**（行号只做定位、锚点做判据）
            if awk -F'\t' '$1=="PLL"{f=1} END{exit !f}' "$scan"; then
              while IFS="$(printf '\t')" read -r _ pf pln ppath plno; do
                [ -n "$pf" ] || continue
                lits="$(awk -F'\t' -v f="$pf" -v l="$pln" -v p="$ppath" '$1=="ANCHOR" && $2==f && $3==l && $4==p {print $5}' "$scan")"
                while IFS= read -r lit; do
                  [ -n "$lit" ] || continue
                  tline="$(sed -n "${plno}p" "$root/$ppath" 2>/dev/null || true)"
                  if ! grep -qF -- "$lit" <<<"$tline"; then
                    printf '::error file=%s,line=%s::(c2) 锚点不在行号指向的那一行：`%s:%s` 那一行里没有 `%s`（行号只做定位，锚点做判据）\n' "$pf" "$pln" "$ppath" "$plno" "$lit" >&2
                    bad=1
                  fi
                done <<XEOF
          $lits
          XEOF
              done <<XEOF
          $(awk -F'\t' '$1=="PLL"' "$scan")
          XEOF
            fi
          
            # (b1) 每条替换点必须至少有一个锚点
            nrows=0
            while IFS= read -r rl; do
              [ -n "$rl" ] || continue
              nrows=$((nrows + 1)); rlno="${rl%%:*}"
              if ! grep -qF '（锚点：' <<<"${rl#*:}"; then
                printf '::error file=references/portability.md,line=%s::(b1) 替换点没有锚点 —— 每条必须给 `路径`（锚点：`字面文本`）\n' "$rlno" >&2
                bad=1
              fi
            done <<EOF
          $(grep -nE '^\| [0-9]+ \|' "$root/references/portability.md" 2>/dev/null || true)
          EOF
            if [ "$nrows" -eq 0 ]; then
              printf '::error file=references/portability.md::解析不出任何替换点（§1 的 `| N |` 行）—— 判据不成立（fail-closed）\n' >&2
              bad=1
            fi
          
            # (b2) 锚点存在性 + 形态
            na=0; nbad=0
            while IFS="$(printf '\t')" read -r kind df dl dpath lit; do
              [ "$kind" = "ANCHOR" ] || continue
              na=$((na + 1))
              if [ ! -f "$root/$dpath" ]; then
                printf '::error file=%s,line=%s::(b2) 锚点指向的文件不存在：`%s`（锚点：`%s`）\n' "$df" "$dl" "$dpath" "$lit" >&2
                nbad=$((nbad + 1)); continue
              fi
              if ! grep -qF -- "$lit" "$root/$dpath"; then
                printf '::error file=%s,line=%s::(b2) 锚点存在性：条目里的锚点 `%s` 在 `%s` 里**找不到**（锚点已漂移）\n' "$df" "$dl" "$lit" "$dpath" >&2
                printf '       修法：把该条目的锚点改成 `%s` 里确实存在的字面文本（标签 / 键名 / 结构标记），或改锚点所在文件\n' "$dpath" >&2
                nbad=$((nbad + 1))
              fi
            done < "$scan"
            while IFS="$(printf '\t')" read -r kind df dl; do
              [ "$kind" = "SYNTAX" ] || continue
              printf '::error file=%s,line=%s::(b2) 锚点标记形态不合规（缺路径 / 缺字面文本 / 缺全角右括号）\n' "$df" "$dl" >&2
              nbad=$((nbad + 1))
            done <<EOF
          $(awk -F'\t' '$1=="SYNTAX"' "$scan")
          EOF
            if [ "$na" -lt 11 ]; then
              printf '::error file=references/portability.md::只抽出 %s 个锚点（<11，替换点共 %s 条）—— 判据不成立（fail-closed）\n' "$na" "$nrows" >&2
              bad=1
            fi
            if [ "$nbad" -ne 0 ]; then bad=1; fi
            [ "$bad" -eq 0 ] || return 1
            printf '[ OK ]  (b) 锚点 %s 个逐字存在，覆盖 §1 的 %s 条替换点\n' "$na" "$nrows"
            return 0
          }
          
          echo "== 正向：真实仓库的符号锚点 =="
          jrc=0; anchor_judge . > "$work/main.log" 2>&1 || jrc=$?
          cat "$work/main.log"
          [ "$jrc" -eq 0 ] || { echo "❌ 锚点判据在真实仓库上失败：见上方 ::error::（条目 + 文件 + 修法）"; exit 1; }
          
          echo
          echo "== 反向样本（临时副本；判据本体与正向同一份实现）=="
          anchor_copy() { # $1 = 目标目录
            rm -rf "$1"; mkdir -p "$1"
            cp SKILL.md "$1/"
            cp -R references scripts .github "$1/"
          }
          
          # A：把某条锚点在目标文件里的字面文本改掉 → 存在性断言**必须** FAIL
          anchor_copy "$work/A"
          pick="$(while IFS="$(printf '\t')" read -r kind df dl dpath lit; do
                    [ "$kind" = "ANCHOR" ] || continue
                    [ -f "$dpath" ] || continue
                    [ "$(grep -cF -- "$lit" "$dpath" || true)" = "1" ] || continue
                    printf '%s\t%s\t%s\n' "$dpath" "$lit" "$df"
                    break
                  done < "$work/scan.tsv")"
          [ -n "$pick" ] || { echo "::error::抽不到可用于反向样本的锚点（fail-closed）"; exit 1; }
          IFS="$(printf '\t')" read -r tf tlit tdecl <<EOF
          $pick
          EOF
          LC_ALL=C awk -v lit="$tlit" -v rep="__ANCHOR_DRIFT__" '
            { p = index($0, lit); if (p > 0) $0 = substr($0, 1, p - 1) rep substr($0, p + length(lit)); print }
          ' "$work/A/$tf" > "$work/A/$tf.tmp" && mv "$work/A/$tf.tmp" "$work/A/$tf"
          arc=0; anchor_judge "$work/A" > "$work/A.log" 2>&1 || arc=$?
          if [ "$arc" -ne 0 ] && grep -q '(b2) 锚点存在性' "$work/A.log"; then
            printf '  [ OK ] 反向样本 A：把 `%s` 里的锚点 `%s` 改掉 → 判据按预期 FAIL（条目出处 %s）\n' "$tf" "$tlit" "$tdecl"
            grep -m2 -E '::error|\[ OK \]' "$work/A.log" | sed 's/^/     /'
          else
            printf '  [FAIL] 反向样本 A 未失败：改掉锚点后判据仍然通过 —— 存在性断言形同虚设\n' >&2
            sed 's/^/     /' "$work/A.log" >&2; exit 1
          fi
          
          # B：在清单里塞回一条 `path:line` → 静态禁令**必须** FAIL
          anchor_copy "$work/B"
          printf '\n- 回归样本：见 `references/identity.md:9`。\n' >> "$work/B/references/portability.md"
          brc=0; anchor_judge "$work/B" > "$work/B.log" 2>&1 || brc=$?
          if [ "$brc" -ne 0 ] && grep -q '(a) 静态禁令' "$work/B.log"; then
            printf '  [ OK ] 反向样本 B：清单里塞回 `references/identity.md:9` → 静态禁令按预期 FAIL\n'
            grep -m3 -E '::error|实测' "$work/B.log" | sed 's/^/     /'
          else
            printf '  [FAIL] 反向样本 B 未失败：清单里的 `path:line` 没被抓到\n' >&2
            sed 's/^/     /' "$work/B.log" >&2; exit 1
          fi
          
          # C：在**其它**文档里塞入不带锚点的 `path:line` → (c) **必须** FAIL（两份清单之外的漂移面同样堵住）
          anchor_copy "$work/C"
          printf '\n回归样本：见 `references/identity.md:9`。\n' >> "$work/C/references/traps.md"
          crc=0; anchor_judge "$work/C" > "$work/C.log" 2>&1 || crc=$?
          if [ "$crc" -ne 0 ] && grep -q '(c) 含 `path:line` 的行必须' "$work/C.log"; then
            printf '  [ OK ] 反向样本 C：`references/traps.md` 里塞入不带锚点的 `references/identity.md:9` → (c) 按预期 FAIL\n'
            grep -m2 -E '::error' "$work/C.log" | sed 's/^/     /'
          else
            printf '  [FAIL] 反向样本 C 未失败：清单之外的不带锚点行号没被抓到\n' >&2
            sed 's/^/     /' "$work/C.log" >&2; exit 1
          fi
          
          # D：删掉一条替换点的锚点 → (b1) **必须** FAIL
          anchor_copy "$work/D"
          LC_ALL=C awk '
            NR == 1 { print; next }
            /^\| 3 \|/ { n = index($0, "（锚点："); if (n > 0) $0 = substr($0, 1, n - 1); print; next }
            { print }
          ' "$work/D/references/portability.md" > "$work/D/references/portability.md.tmp" \
            && mv "$work/D/references/portability.md.tmp" "$work/D/references/portability.md"
          drc=0; anchor_judge "$work/D" > "$work/D.log" 2>&1 || drc=$?
          if [ "$drc" -ne 0 ] && grep -q '(b1) 替换点没有锚点' "$work/D.log"; then
            printf '  [ OK ] 反向样本 D：删掉替换点 #3 的锚点 → (b1) 按预期 FAIL（每条替换点必须有锚点）\n'
            grep -m1 -E '::error' "$work/D.log" | sed 's/^/     /'
          else
            printf '  [FAIL] 反向样本 D 未失败：没有锚点的替换点没被抓到\n' >&2
            sed 's/^/     /' "$work/D.log" >&2; exit 1
          fi
          
          # F：保留了行号、锚点也在同一行，但锚点**不在行号指向的那一行** → (c2) **必须** FAIL
          anchor_copy "$work/F"
          printf '\n回归样本：见 `references/identity.md:10`（`references/identity.md`（锚点：`拆片 + 建 Issue`））。\n' >> "$work/F/references/traps.md"
          frc=0; anchor_judge "$work/F" > "$work/F.log" 2>&1 || frc=$?
          if [ "$frc" -ne 0 ] && grep -q '(c2) 锚点不在行号指向的那一行' "$work/F.log"; then
            printf '  [ OK ] 反向样本 F：行号 `references/identity.md:10` 与锚点 `拆片 + 建 Issue` 不同行 → (c2) 按预期 FAIL\n'
            grep -m1 -E '::error' "$work/F.log" | sed 's/^/     /'
          else
            printf '  [FAIL] 反向样本 F 未失败：锚点不在行号指向的那一行没被抓到\n' >&2
            sed 's/^/     /' "$work/F.log" >&2; exit 1
          fi
          
          # E：恢复（未改动的同一份副本）→ 判据**必须**通过
          anchor_copy "$work/E"
          erc=0; anchor_judge "$work/E" > "$work/E.log" 2>&1 || erc=$?
          if [ "$erc" -eq 0 ] && grep -q '零 `path:line`' "$work/E.log" && grep -q '逐字存在' "$work/E.log"; then
            printf '  [ OK ] 反向样本 E：恢复后判据通过（%s）\n' "$(tail -n 1 "$work/E.log")"
          else
            printf '  [FAIL] 反向样本 E 未通过：未改动的副本仍失败\n' >&2
            sed 's/^/     /' "$work/E.log" >&2; exit 1
          fi
          
          echo
          echo '✅ 符号锚点判据：两份清单零 `path:line`；锚点逐字存在；保留行号时锚点必须就在那一行。'
          echo "   反向样本 A（锚点漂移 → FAIL）／B（清单塞回 path:line → FAIL）／C（其它文档不带锚点 → FAIL）／D（替换点缺锚点 → FAIL）／F（锚点不在行号那一行 → FAIL）／E（恢复 → 通过）全部按预期"
      - name: W0 分支归属文档与真实 R2 实现一致（两个合法状态 + 四个反向样本）
        run: |
          cd "$PM4GH_SKILL_ROOT"
          python3 - references/flow.md scripts/preflight.sh <<'PY_FLOW_ELIGIBILITY'
          from pathlib import Path
          import sys

          def validate(flow, preflight):
              assert flow.count('## W0 ') == 1 and flow.count('## W1 ') == 1, 'cannot locate W0/W1'
              w0 = flow.split('## W0 ', 1)[1].split('## W1 ', 1)[0]
              for anchor in ['**R2 分支归属**', '② 当前分支']:
                  lines = [line.split(anchor, 1)[1].split('**R3', 1)[0] for line in w0.splitlines() if anchor in line]
                  assert len(lines) == 1, 'missing/ambiguous R2 clause: '+anchor
                  assert all('`status/'+state+'`' in lines[0] for state in ['in-progress','in-review']), 'R2 clause omits a legal state: '+anchor
                  assert 'OPEN' in lines[0], 'R2 clause must require an open Issue'
              assert preflight.count('# ── R2 分支归属：') == 1 and preflight.count('# ── R3 ') == 1, 'cannot locate implementation'
              r2 = preflight.split('# ── R2 分支归属：',1)[1].split('# ── R3 ',1)[0]
              for state in ['in-progress','in-review']:
                  assert 'grep -qxF "status/'+state+'"' in r2, 'implementation omits legal state: '+state

          flow = Path(sys.argv[1]).read_text()
          preflight = Path(sys.argv[2]).read_text()
          validate(flow, preflight)
          print('PASS: W0 summary and failure guidance both agree with actual in-progress/in-review eligibility')
          for state in ['in-progress','in-review']:
              bad_flow = flow.replace('`status/'+state+'`', '`removed-state`')
              assert bad_flow != flow
              try:
                  validate(bad_flow, preflight)
              except AssertionError:
                  print('PASS: documentation omitting '+state+' is rejected')
              else:
                  raise AssertionError('mutated documentation escaped: '+state)
              bad_script = preflight.replace('grep -qxF "status/'+state+'"','grep -qxF "status/removed"')
              assert bad_script != preflight
              try:
                  validate(flow, bad_script)
              except AssertionError:
                  print('PASS: implementation omitting '+state+' is rejected')
              else:
                  raise AssertionError('mutated implementation escaped: '+state)
          print('PASS: eligibility contract plus four negative samples')
          PY_FLOW_ELIGIBILITY

      - name: 作者职责与「谁建 Issue」三处单一说法（SKILL.md 权威；旧措辞零命中 + 反向样本）
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          # ── #156：把「谁建 Issue」从"点"变成"类"的机器判据 ──
          # 背景：#152 把「拆片 + 建 Issue：作者身份」写进 SKILL.md「切片拆分与分发」W0.5 与
          #   references/flow.md W1，但 references/identity.md 的**作者职责行**当时没同步
          #   （#152 的边界只允许改 SKILL.md + references/flow.md）→ 回归盲测据此用
          #   **dispatcher 身份**（本机 gh 登录态）建了 3 条切片 Issue。本步骤锁死三处表述。
          # 权威 = SKILL.md；三处 = SKILL.md frontmatter description/W0.5、flow.md W1、identity.md 作者职责行。
          # 旧矛盾措辞（**实测原文**，取自 #152 之前的 git 历史 6499c39^）：
          #   references/flow.md:  `| 1 | 人/PM | 交 Issue + 验收标准（DoR 五项） |`
          #   references/identity.md 作者行: 建分支、提交、推送、开 PR、返修、`abort.sh`（**无**「建 Issue」）
          #   → 旧说法形态 =「人/PM … 交 Issue」；#152 已改 flow.md，本步骤断言它在文档里**零命中**。
          # 扫描范围 = 文档（SKILL.md + references/**/*.md + assets/**/*.md + .github/*.md +
          #   Issue 表单 .yml）—— **不含** .github/workflows/**（本判据的注释里就要写旧原文，自扫会自伤）。
          # 三态显式：通过 [ OK ] ／ 不一致 [FAIL] + ::error::（file:line + 原文 + 修法）／解析不到 = fail-closed。
          work="$(mktemp -d "${TMPDIR:-/tmp}/author-duty.XXXXXX")"
          trap 'rm -rf "$work"' EXIT

          # **唯一一份实现**：正向与全部反向样本都调用它（不允许第二套）。
          # AUTHOR_DUTY_ASSERT:BEGIN
          duty_judge() { # $1 = 根目录；0 = 通过
            root="$1"; bad=0
            # ① identity.md 作者职责行：必须含「拆片」「建 Issue」「作者身份」
            duty="$(grep -E '^\|[[:space:]]*作者[[:space:]]*\|' "$root/references/identity.md" 2>/dev/null || true)"
            if [ -z "$duty" ]; then
              printf '::error file=references/identity.md::解析不出作者职责行（`| 作者 | …` 表格行）—— 判据不成立（fail-closed）\n' >&2
              bad=1
            elif ! grep -q '拆片' <<<"$duty" || ! grep -q '建 Issue' <<<"$duty" || ! grep -q '作者身份' <<<"$duty"; then
              printf '::error file=references/identity.md::作者职责行缺「拆片 + 建 Issue（作者身份）」—— 与 SKILL.md W0.5 / flow.md W1 分叉\n' >&2
              printf '       实际：%s\n' "$duty" >&2
              printf '       修法：补成「拆片 + 建 Issue（**作者身份**）、建分支、…」（措辞以 SKILL.md 为权威；回归盲测因缺这句用 dispatcher 身份建了切片 Issue）\n' >&2
              bad=1
            else
              printf '[ OK ]  references/identity.md 作者职责行含「拆片 + 建 Issue（作者身份）」\n'
            fi
            # ② SKILL.md：frontmatter description + W0.5 正文（权威表述）
            fm="$(awk 'NR==1 && $0=="---" {on=1; next} on && $0=="---" {exit} on {print}' "$root/SKILL.md" 2>/dev/null || true)"
            w05="$(awk '/^## 切片拆分与分发/ {on=1} on && /^## / && !/^## 切片拆分与分发/ {exit} on {print}' "$root/SKILL.md" 2>/dev/null || true)"
            if [ -z "$fm" ] || [ -z "$w05" ]; then
              printf '::error file=SKILL.md::解析不出 frontmatter 或「切片拆分与分发（W0.5）」小节 —— 判据不成立（fail-closed）\n' >&2
              bad=1
            else
              if grep -qF '拆片 + 建 Issue（作者身份）' <<<"$fm"; then
                printf '[ OK ]  SKILL.md frontmatter description 含「拆片 + 建 Issue（作者身份）」\n'
              else
                printf '::error file=SKILL.md::frontmatter description 缺「拆片 + 建 Issue（作者身份）」—— 「谁建 Issue」少一处说法\n' >&2
                printf '       修法：在 description 的工作流链里补「拆片 + 建 Issue（作者身份）→ 认领 Issue（DoR 五项）」\n' >&2
                bad=1
              fi
              if grep -q '谁建 Issue' <<<"$w05" && grep -q '作者身份' <<<"$w05"; then
                printf '[ OK ]  SKILL.md W0.5 含「谁建 Issue」+「作者身份」\n'
              else
                printf '::error file=SKILL.md::「切片拆分与分发」（W0.5）缺「谁建 Issue：作者身份」—— 本文件是权威表述\n' >&2
                bad=1
              fi
            fi
            # ③ flow.md W1：必须出现「拆片 + 建 Issue」，且同一行给出「作者身份」
            w1="$(grep -n '拆片 + 建 Issue' "$root/references/flow.md" 2>/dev/null || true)"
            if [ -z "$w1" ]; then
              printf '::error file=references/flow.md::W1 缺「拆片 + 建 Issue：作者身份」—— 与 SKILL.md W0.5 分叉\n' >&2
              bad=1
            elif ! grep -q '作者身份' <<<"$w1"; then
              printf '::error file=references/flow.md::「拆片 + 建 Issue」那行没有「作者身份」：%s\n' "$w1" >&2
              bad=1
            else
              printf '[ OK ]  references/flow.md W1 含「拆片 + 建 Issue：作者身份」\n'
            fi
            # ④ #152 之前的旧矛盾措辞零命中（实测原文：「人/PM」交 Issue + 验收标准）
            old=0
            for f in "$root"/SKILL.md "$root"/references/*.md "$root"/assets/*.md "$root"/.github/*.md "$root"/.github/ISSUE_TEMPLATE/*.yml; do
              [ -f "$f" ] || continue
              hit="$(grep -nE '交[[:space:]]?Issue' "$f" 2>/dev/null || true)"
              if [ -n "$hit" ]; then
                printf '       %s:%s\n' "${f#$root/}" "$hit" >&2
                old=1
              fi
            done
            if [ "$old" -ne 0 ]; then
              printf '::error file=references/flow.md::文档里出现 #152 之前的旧矛盾措辞「交 Issue」—— 建 Issue 的人又变成人/PM\n' >&2
              printf '       修法：删掉旧说法，改指 SKILL.md W0.5「谁建 Issue：作者身份」（建单 = 作者身份）\n' >&2
              bad=1
            else
              printf '[ OK ]  文档零命中旧矛盾措辞「交 Issue」（SKILL.md + references/ + assets/ + .github/ 的 .md 与 Issue 表单）\n'
            fi
            [ "$bad" -eq 0 ] || return 1
            return 0
          }
          # AUTHOR_DUTY_ASSERT:END

          # ── 正向：真实仓库 ──
          echo "== 正向：三处「谁建 Issue」表述 + 旧措辞零命中 =="
          prc=0; duty_judge . || prc=$?
          [ "$prc" -eq 0 ] || { echo "❌ 作者职责判据在真实仓库上失败：见上方 ::error::（文件 + 原文 + 修法）"; exit 1; }

          # ── 反向样本（全部在临时副本里做，不动工作区）──
          mk_duty_copy() { # $1 = 目标目录
            rm -rf "$1"; mkdir -p "$1/.github/ISSUE_TEMPLATE"
            cp SKILL.md "$1/"
            cp -R references "$1/"
            cp -R assets "$1/" 2>/dev/null || true
            cp .github/*.md "$1/.github/" 2>/dev/null || true
            cp .github/ISSUE_TEMPLATE/*.yml "$1/.github/ISSUE_TEMPLATE/" 2>/dev/null || true
          }
          echo
          echo "== 反向样本（临时副本）=="

          # A：删掉 identity.md 作者职责行里的「建 Issue」→ 判据**必须** FAIL
          mk_duty_copy "$work/A"
          LC_ALL=C awk 'BEGIN{s="拆片 + 建 Issue（**作者身份**）、"} {p=index($0,s); if (p>0) $0=substr($0,1,p-1) substr($0,p+length(s)); print}' \
            "$work/A/references/identity.md" > "$work/A/references/identity.md.tmp" \
            && mv "$work/A/references/identity.md.tmp" "$work/A/references/identity.md"
          arc=0; duty_judge "$work/A" > "$work/A.log" 2>&1 || arc=$?
          sed -n '1,6p' "$work/A.log" | sed 's/^/   /'
          if [ "$arc" -ne 0 ] && grep -q 'identity.md::作者职责行缺' "$work/A.log"; then
            printf '  [ OK ] 反向样本 A：删掉 identity.md 的「建 Issue」→ 判据按预期 FAIL\n'
          else
            printf '  [FAIL] 反向样本 A 未失败：删掉「建 Issue」后判据仍然通过 —— 断言形同虚设\n' >&2
            exit 1
          fi

          # B：恢复（未改动的同一份副本）→ 判据**必须**通过
          mk_duty_copy "$work/B"
          brc=0; duty_judge "$work/B" > "$work/B.log" 2>&1 || brc=$?
          if [ "$brc" -eq 0 ] && grep -q '零命中旧矛盾措辞' "$work/B.log"; then
            printf '  [ OK ] 反向样本 B：恢复后判据通过（%s 条 [ OK ]）\n' "$(grep -c '\[ OK \]' "$work/B.log")"
          else
            printf '  [FAIL] 反向样本 B 未通过：恢复后判据仍失败\n' >&2
            sed 's/^/   /' "$work/B.log" >&2
            exit 1
          fi

          # C：把 #152 之前的旧原文塞回 flow.md → 「旧措辞零命中」断言**必须** FAIL（证明它非空）
          mk_duty_copy "$work/C"
          printf '| 1 | 人/PM | 交 Issue + 验收标准（DoR 五项） |\n' >> "$work/C/references/flow.md"
          crc=0; duty_judge "$work/C" > "$work/C.log" 2>&1 || crc=$?
          if [ "$crc" -ne 0 ] && grep -q '旧矛盾措辞' "$work/C.log"; then
            printf '  [ OK ] 反向样本 C：塞回旧措辞「人/PM … 交 Issue + 验收标准」→ 判据按预期 FAIL\n'
            grep -m1 '交 Issue + 验收标准' "$work/C.log" | sed 's/^/   /'
          else
            printf '  [FAIL] 反向样本 C 未失败：旧矛盾措辞没被抓到 —— 零命中断言形同虚设\n' >&2
            sed 's/^/   /' "$work/C.log" >&2
            exit 1
          fi

          echo
          echo "✅ 作者职责判据：三处「谁建 Issue」表述一致（SKILL.md frontmatter/W0.5 = 权威）；旧措辞「交 Issue」零命中；"
          echo "   反向样本 A（删「建 Issue」→ FAIL）／B（恢复 → 通过）／C（塞回旧措辞 → FAIL）全部按预期"

      - name: PR 正文证据块的 SHA 标注 == 本 PR head SHA（C7 可追溯；三态 + 反向样本）
        env:
          # 只带**短**上下文：PR 编号 + head SHA。正文**不**经 env 传递 ——
          #   env 会被 runner 逐字回显进 CI 日志（正文可能是几十 KB），且正文长度不受本步骤控制；
          #   正文改为在步骤内用 gh pr view **实时**读（见下）。
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cd "$PM4GH_SKILL_ROOT"
          set -euo pipefail
          # ── #161 C7 证据可追溯：把「照搬别处证据」从不可判定变成机器可判 ──────────────
          # 病根（回归第 2 轮 D9）：PR #154 第 4 节的 preflight 输出块**是从 PR #153 照搬的**，
          #   不是该 SHA 上的运行 —— 结论实质成立，但**取证过程不成立**；而产物上区分不出
          #   「实测」与「转述」，因为「这块证据来自哪个 SHA」没有任何载体。
          # 本步骤只判一件可判的事：正文里**每个**证据块标记声明的 SHA 必须 == 本 PR 的 head SHA。
          # 正文来源 = **实时** `gh pr view --json body`（不用事件载荷：返修路径先推送后 PATCH 正文，
          # 载荷会是旧正文 ⇒ 假 FAIL 且该 SHA 的结论不可逆；也不经 step env 传递 —— env 会被
          # runner 逐字回显进日志、且正文长度不受本步骤控制）。另见下方正向段注释。
          # 边界（**不得**过度宣称，见 references/exceptions.md §6）：验的是**标注一致性**，
          #   **不是内容真伪** —— 无法判定证据是否真来自那次运行，只能判定它**声称**来自哪个 SHA。
          # 标记形态（唯一、稳定可解析）：`<!-- evidence sha=<7-40 位小写 hex> -->`，一行一个，
          #   且必须在**围栏（``` / ~~~）之外** —— 围栏内是证据正文（粘进来的输出可能**包含标记样例**），
          #   不参与判定、也不被注入改写（否则会把「证据原文」改掉，正好违反 C7 的可追溯初衷）。
          #   围栏判定按 CommonMark 口径：**同字符且不短于**开围栏的那一行才关闭 ⇒ 嵌套围栏（外 4 内 3）不漏内容。
          #   判定 = head SHA 以标注值为**前缀**（40 位时即「相等」；7 位短 SHA 仍唯一指向同一提交）。
          #   含 evidence 的 HTML 注释形态不合规（缺 sha= / 非 hex / 超长 / 占位符未替换）→ FAIL：
          #   候选 = 「以 evidence 开头的单行 HTML 注释」（**不排除** `>`，否则 `sha=<head>` 这类
          #   占位符会变成**看不见**的标记 —— 静默通过的唯一口子）；解析不出规范形就 FAIL 并给出原文。
          # 三态（C2）：[ OK ] 全部一致 ／ [FAIL] 不一致或形态不合规（指出**哪一块**：块序号 + 正文行号 + 所在小节）
          #   ／ 零标记 → [FAIL]「未声明证据块」（**不是** SKIP，理由见下）。
          # 零标记为何判 FAIL（本片选择）：要求是「每个证据块必须带产生它的 SHA」，零标记 = 一个都没声明；
          #   若判「不适用」而放行，**删掉标记**就是唯一逃逸口（判据整体失效）。
          #   C2 的三态在此仍然成立：本步骤**从不**用通过措辞掩盖零标记，而是打印 [FAIL] 未声明证据块 + 修法。
          # 反向样本 a–g 常驻（只跑正向样本的判据等于没有判据）：a 标记=别的 SHA→FAIL／b 全部==head→通过／
          #   c 零标记→FAIL／d 形态不合规→FAIL／e 混合（一块对一块错）→FAIL／f 围栏内的样例→忽略（通过）／
          #   g **嵌套**围栏（外 4 反引号 / 内 3 反引号）内的样例→忽略（通过，锁死围栏判定口径）。
          # 判据本体**只有这一处**（下方函数）；正向与 a–g 反向样本都调用它，不在别处复写第二份实现。
          # 标记形态规则同样出现在 scripts/deliver.sh 的注入段（它要知道改哪些行才能注入）——
          #   那里**只**做注入与前置条件，**不做** head 比对；判据仍然是这里一处。
          work="$(mktemp -d "${TMPDIR:-/tmp}/evidence-sha.XXXXXX")"
          trap 'rm -rf "$work"' EXIT

          evidence_sha_judge() { # $1 = PR 正文   $2 = head SHA；返回 0 = 通过
            b="${1:-}"; head="${2:-}"
            # 用 here-string（**禁止**「管道接 grep -q」：pipefail 下会 EPIPE，见 #131 与 traps.md）
            if ! grep -qE '^[0-9a-f]{7,40}$' <<<"$head"; then
              printf '::error::取不到本 PR 的 head SHA（实测值：[%s]）—— 判据不成立（fail-closed）\n' "$head" >&2
              return 1
            fi
            # 候选 = 围栏外的证据块标记（围栏内的原样保留，不算标记、不参与判定）。
            # 围栏判定按 CommonMark 口径：只有**同字符且不短于**开围栏的那一行才关闭 ——
            # 于是「外 4 个反引号、内 3 个反引号」的嵌套围栏不会把内层内容漏到围栏外
            # （反面样本 g 锁死这一点：我的 PR 正文里就会粘含三反引号的判据输出）。
            cand="$(printf '%s\n' "$b" | awk '
              BEGIN { fence = 0; fchar = ""; flen = 0 }
              {
                line = $0
                if (line ~ /^[ \t]*(```|~~~)/) {
                  tmp = line; sub(/^[ \t]*/, "", tmp); ch = substr(tmp, 1, 1); ln = 0
                  while (substr(tmp, ln + 1, 1) == ch) ln++
                  if (fence == 0) { fence = 1; fchar = ch; flen = ln; next }
                  if (ch == fchar && ln >= flen) { fence = 0; fchar = ""; flen = 0 }
                  next
                }
                if (fence) next
                s = line
                while (match(s, /<!--[ \t]*evidence.*-->/)) { printf "%d:%s\n", FNR, substr(s, RSTART, RLENGTH); s = substr(s, RSTART + RLENGTH) }
              }
            ' || true)"
            if [ -z "$cand" ]; then
              printf '[FAIL] 未声明证据块：PR 正文的围栏之外没有任何证据块 SHA 标记\n' >&2
              printf '       后果：证据块来自哪个 SHA 无载体 —— 「照搬别处证据」无法被机器判出（C7）。\n' >&2
              printf '       修法：在每个证据块处（**围栏外**）加一行（可直接粘贴）：<!-- evidence sha=%s -->\n' "$head" >&2
              printf '       用 scripts/deliver.sh 写/更新正文时该值会被自动改写为推送后的 head SHA。\n' >&2
              return 1
            fi
            n=0; nok=0; nbad=0
            while IFS= read -r row; do
              [ -n "$row" ] || continue
              n=$((n + 1))
              lineno="${row%%:*}"
              raw="${row#*:}"
              sha="$(printf '%s' "$raw" | sed -nE 's/^<!--[[:space:]]*evidence[[:space:]]+sha=([0-9a-fA-F]{7,40})[[:space:]]*-->$/\1/p' | tr 'A-F' 'a-f')"
              where="$(printf '%s\n' "$b" | awk -v L="$lineno" 'NR<=L && /^#{1,6} /{h=$0; sub(/^#+[[:space:]]*/,"",h)} NR==L{print (h==""?"（标记在小节标题之前）":h)}')"
              if [ -z "$sha" ]; then
                printf '[FAIL] 证据块 #%s（正文第 %s 行，小节：%s）标记形态不合规：%.160s\n' "$n" "$lineno" "$where" "$raw" >&2
                printf '       期望形态（逐字，一行一个，围栏外）：<!-- evidence sha=<7-40 位小写 hex> -->\n' >&2
                printf '       可直接粘贴的规范标记：<!-- evidence sha=%s -->\n' "$head" >&2
                nbad=$((nbad + 1)); continue
              fi
              case "$head" in
                "$sha"*)
                  nok=$((nok + 1))
                  printf '[ OK ]  证据块 #%s（正文第 %s 行，小节：%s）标注 sha=%s（%s 位）是 head 的前缀\n' "$n" "$lineno" "$where" "$sha" "${#sha}"
                  ;;
                *)
                  printf '[FAIL] 证据块 #%s（正文第 %s 行，小节：%s）标注 sha=%s ！= 本 PR head SHA %s\n' "$n" "$lineno" "$where" "$sha" "$head" >&2
                  printf '       含义：这一块的证据**声称**来自 %s，而本 PR 的 head 是 %s —— 照搬别处 / 过期标记（C7）。\n' "$sha" "$head" >&2
                  printf '       修法：在该 SHA 上重跑，再 scripts/deliver.sh <issue#> --as author 重新注入并更新正文；\n' >&2
                  printf '             或把该块改成：<!-- evidence sha=%s -->\n' "$head" >&2
                  nbad=$((nbad + 1))
                  ;;
              esac
            done <<<"$cand"
            printf '摘要：证据块标记 %s 个（围栏外）→ 与 head 一致 %s ／ 失败 %s（head=%s）\n' "$n" "$nok" "$nbad" "$head"
            [ "$nbad" -eq 0 ] || return 1
            printf '[ OK ]  全部 %s 个证据块标记的 sha == 本 PR head SHA %s\n' "$nok" "$head"
            return 0
          }

          echo "本 PR head SHA（github.event.pull_request.head.sha，实测）：${HEAD_SHA:-（空）}"
          echo
          echo "== 正向：本 PR 正文（**实时**读，gh pr view）=="
          # 判据读**实时正文**，不读事件载荷 github.event.pull_request.body：
          #   ① 载荷里是**推送那一刻**的正文；返修路径 deliver.sh 是「先推送、再 REST PATCH 正文」
          #      ⇒ 用载荷会得到「新 head + 旧标记」的**假 FAIL**，而该 SHA 上的失败结论不可逆
          #      （只能再推一次提交，而那次又同样滞后）；
          #   ② 本仓库另两个读正文的 job（policy/template、policy/linked-issue）也走 gh pr view ——
          #      同一仓库只留一套口径。
          # 读不到正文 → fail-closed（不静默跳过、也不退回载荷）。
          body="$(gh pr view "${PR_NUMBER:?事件上下文里没有 PR 编号}" -R "${REPO:?缺少 REPO 环境变量}" \
            --json body --jq .body 2>/dev/null)" \
            || { echo "::error::读不到 PR 正文（gh pr view 失败）—— 判据不成立（fail-closed）"; exit 1; }
          prc=0; evidence_sha_judge "${body:-}" "${HEAD_SHA:-}" || prc=$?
          [ "$prc" -eq 0 ] || { echo "::error::PR 正文的证据块 SHA 标注与本 PR head SHA 不一致（见上方 [FAIL]）；边界：本判据验的是标注一致性，不是内容真伪（references/exceptions.md §6）"; exit 1; }

          echo
          echo "== 反向样本 a–g（同一判据函数，换输入）=="
          head40='0123456789abcdef0123456789abcdef01234567'
          other40='fedcba9876543210fedcba9876543210fedcba98'
          fence='```'
          fence4='````'
          bad=0

          # a) 标记 sha = 别的 SHA → 判据**必须** FAIL，且必须指出是证据块 #1
          printf '## 4. 验收证据\n<!-- evidence sha=%s -->\n| 1 | preflight | OK |\n' "$other40" > "$work/a.md"
          arc=0; evidence_sha_judge "$(cat "$work/a.md")" "$head40" > "$work/a.log" 2>&1 || arc=$?
          if [ "$arc" -ne 0 ] && grep -q '证据块 #1' "$work/a.log" && grep -q "$other40" "$work/a.log"; then
            printf '  [ OK ] 反向样本 a：标记 sha=%s（别的 SHA）→ 判据按预期 FAIL 并指出证据块 #1\n' "$other40"
            grep -m2 -E '\[FAIL\]|摘要' "$work/a.log" | sed 's/^/     /'
          else
            printf '  [FAIL] 反向样本 a 未按预期失败（rc=%s）\n' "$arc" >&2; sed 's/^/     /' "$work/a.log" >&2; bad=1
          fi

          # b) 全部标记 == head → 判据**必须**通过
          printf '## 4. 验收证据\n<!-- evidence sha=%s -->\n| 1 | preflight | OK |\n\n<!-- evidence sha=%s -->\n| 2 | ci | OK |\n' "$head40" "$head40" > "$work/b.md"
          brc=0; evidence_sha_judge "$(cat "$work/b.md")" "$head40" > "$work/b.log" 2>&1 || brc=$?
          if [ "$brc" -eq 0 ] && grep -q '全部 2 个证据块标记的 sha == 本 PR head SHA' "$work/b.log"; then
            printf '  [ OK ] 反向样本 b：2 块标记全部 == head → 判据按预期通过\n'
            grep -E '\[ OK \]' "$work/b.log" | sed 's/^/     /'
          else
            printf '  [FAIL] 反向样本 b 未通过（rc=%s）\n' "$brc" >&2; sed 's/^/     /' "$work/b.log" >&2; bad=1
          fi

          # c) 零标记 → 判据**必须** FAIL（fail-closed：零标记 = 未声明证据块，**不是** SKIP）
          printf '## 4. 验收证据\n| 1 | preflight | OK |\n' > "$work/c.md"
          crc=0; evidence_sha_judge "$(cat "$work/c.md")" "$head40" > "$work/c.log" 2>&1 || crc=$?
          if [ "$crc" -ne 0 ] && grep -q '未声明证据块' "$work/c.log"; then
            printf '  [ OK ] 反向样本 c：零标记 → 判据按预期 FAIL（[FAIL] 未声明证据块，不计入通过）\n'
            grep -m2 -E '\[FAIL\]|可直接粘贴' "$work/c.log" | sed 's/^/     /'
          else
            printf '  [FAIL] 反向样本 c 未按预期失败（rc=%s）—— 零标记必须 FAIL\n' "$crc" >&2; sed 's/^/     /' "$work/c.log" >&2; bad=1
          fi

          # d) 形态不合规（sha 不是 hex / 缺 sha）→ 判据**必须** FAIL（不给「写坏标记」的逃逸口）
          printf '## 4. 验收证据\n<!-- evidence sha=abc -->\n| 1 | preflight | OK |\n' > "$work/d.md"
          drc=0; evidence_sha_judge "$(cat "$work/d.md")" "$head40" > "$work/d.log" 2>&1 || drc=$?
          if [ "$drc" -ne 0 ] && grep -q '标记形态不合规' "$work/d.log"; then
            printf '  [ OK ] 反向样本 d：<!-- evidence sha=abc -->（形态不合规）→ 判据按预期 FAIL\n'
            grep -m1 '标记形态不合规' "$work/d.log" | sed 's/^/     /'
          else
            printf '  [FAIL] 反向样本 d 未按预期失败（rc=%s）\n' "$drc" >&2; sed 's/^/     /' "$work/d.log" >&2; bad=1
          fi

          # e) 混合：一块 == head、一块 = 别的 SHA → 判据**必须** FAIL（部分通过不算通过）
          printf '## 4. 验收证据\n<!-- evidence sha=%s -->\n| 1 | preflight | OK |\n\n<!-- evidence sha=%s -->\n| 2 | ci | OK |\n' "$head40" "$other40" > "$work/e.md"
          erc=0; evidence_sha_judge "$(cat "$work/e.md")" "$head40" > "$work/e.log" 2>&1 || erc=$?
          if [ "$erc" -ne 0 ] && grep -q '一致 1 ／ 失败 1' "$work/e.log" && grep -q '证据块 #2' "$work/e.log"; then
            printf '  [ OK ] 反向样本 e：一块对一块错 → 判据按预期 FAIL 并指出证据块 #2\n'
            grep -E '摘要' "$work/e.log" | sed 's/^/     /'
          else
            printf '  [FAIL] 反向样本 e 未按预期失败（rc=%s）\n' "$erc" >&2; sed 's/^/     /' "$work/e.log" >&2; bad=1
          fi

          # f) 围栏内的标记样例（例如粘进来的本判据反向样本输出）**不算标记**：
          #    围栏外一块 == head → 判据**必须**通过（否则「把输出粘进证据块」会自伤）；且只应数到 1 块。
          printf '## 4. 验收证据\n<!-- evidence sha=%s -->\n%s\n[FAIL] 证据块 #1 标记形态不合规：<!-- evidence sha=abc -->\n<!-- evidence sha=%s -->\n%s\n| 1 | preflight | OK |\n' \
            "$head40" "$fence" "$other40" "$fence" > "$work/f.md"
          frc=0; evidence_sha_judge "$(cat "$work/f.md")" "$head40" > "$work/f.log" 2>&1 || frc=$?
          if [ "$frc" -eq 0 ] && grep -q '全部 1 个证据块标记的 sha == 本 PR head SHA' "$work/f.log"; then
            printf '  [ OK ] 反向样本 f：围栏内的样例（含别的 SHA 与坏形态）被忽略 → 判据按预期通过，且只数到围栏外的 1 块\n'
            grep -E '摘要|全部 1 个' "$work/f.log" | sed 's/^/     /'
          else
            printf '  [FAIL] 反向样本 f 未按预期通过（rc=%s）—— 围栏内的样例不应参与判定\n' "$frc" >&2; sed 's/^/     /' "$work/f.log" >&2; bad=1
          fi

          # g) **嵌套**围栏：外层 4 个反引号包住内层 3 个反引号，内层里的标记样例不算标记；
          #    围栏外一块 == head → 判据**必须**通过且只数到 1 块（锁死「同字符且不短于才关闭」的口径）。
          printf '## 4. 验收证据\n<!-- evidence sha=%s -->\n%s\n<!-- evidence sha=%s -->\n%s\n<!-- evidence sha=abc -->\n%s\n%s\n\n| 1 | preflight | OK |\n' \
            "$head40" "$fence4" "$other40" "$fence" "$fence" "$fence4" > "$work/g.md"
          grc=0; evidence_sha_judge "$(cat "$work/g.md")" "$head40" > "$work/g.log" 2>&1 || grc=$?
          if [ "$grc" -eq 0 ] && grep -q '全部 1 个证据块标记的 sha == 本 PR head SHA' "$work/g.log"; then
            printf '  [ OK ] 反向样本 g：嵌套围栏（外 4 反引号 / 内 3 反引号）内的样例被忽略 → 判据按预期通过，且只数到围栏外的 1 块\n'
            grep -E '摘要|全部 1 个' "$work/g.log" | sed 's/^/     /'
          else
            printf '  [FAIL] 反向样本 g 未按预期通过（rc=%s）—— 嵌套围栏的内层内容不应参与判定\n' "$grc" >&2; sed 's/^/     /' "$work/g.log" >&2; bad=1
          fi

          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo
          echo "✅ C7：PR 正文围栏外所有证据块标记的 sha == 本 PR head SHA；反向样本 a（别的 SHA→FAIL）/ b（全部==head→通过）/"
          echo "   c（零标记→[FAIL] 未声明证据块）/ d（形态不合规→FAIL）/ e（混合→FAIL）/ f（围栏内样例→忽略）/ g（嵌套围栏→忽略）全部按预期；"
          echo "   边界：验的是**标注一致性**，不是**内容真伪**（references/exceptions.md §6）"

  linked-issue:
    name: policy/linked-issue
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: PR 必须关联同仓库 Issue
        run: |
          set -euo pipefail
          PR='${{ github.event.pull_request.number }}'
          REPO='${{ github.repository }}'
          body="$(gh pr view "$PR" -R "$REPO" --json body --jq .body)"
          # 判据**只有一处**（本标记区）：ci/test 抽出同一段文本做双向反向样本，
          # 因此正则不得在测试里复写第二份（复写 = 两套判据、会漂移）。
          # LINKED_ISSUE_ASSERT:BEGIN —— 判据：正文是否含关闭关键字；here-string 去管道 → 无 EPIPE（#131）
          linked_issue_ok() {
            grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*#[0-9]+' <<<"${1:-}"
          }
          # LINKED_ISSUE_ASSERT:END
          if ! linked_issue_ok "$body"; then
            echo "::error::PR 正文缺少关闭关键字（例如 Closes #12）。官方：关键字只在 PR 正文或提交信息中生效，PR 标题无效。"
            exit 1
          fi
          refs="$(gh pr view "$PR" -R "$REPO" --json closingIssuesReferences --jq '[.closingIssuesReferences[].number] | join(",")')"
          if [ -z "$refs" ]; then
            echo "::error::GitHub 未解析出关闭关系。官方：关闭关键字只在 PR 目标是仓库默认分支时才被解析。"
            exit 1
          fi
          echo "✅ 关联 Issue：#${refs}"

  branch-name:
    name: policy/branch-name
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 分支命名符合规范且指向存在的已进入状态机的 Issue
        run: |
          set -euo pipefail
          REPO='${{ github.repository }}'
          head='${{ github.event.pull_request.head.ref }}'
          if [[ ! "$head" =~ ^(slice|fix|hotfix|spike|chore)/[0-9]+-[a-z0-9-]+$ ]]; then
            echo "::error::分支名 '$head' 不符合 <type>/<issue#>-<slug>；type ∈ {slice,fix,hotfix,spike,chore}，slug 只允许小写字母、数字、连字符"
            exit 1
          fi
          num="${head#*/}"; num="${num%%-*}"
          state="$(gh issue view "$num" -R "$REPO" --json state --jq .state)"
          echo "分支指向 Issue #${num}（state=${state}）"
          if [ "$state" != "OPEN" ]; then
            echo "::error::Issue #${num} 已关闭，不应对它再开新 PR（返修请重开原 Issue 或新建 Bug Issue）"
            exit 1
          fi
          slabel="$(gh issue view "$num" -R "$REPO" --json labels \
            --jq '[.labels[].name | select(startswith("status/"))] | length')"
          if [ "$slabel" -eq 0 ]; then
            echo "::error::Issue #${num} 处于 Backlog（无 status/* 标签）—— 先 scripts/status.sh ${num} in-progress，再由 scripts/start.sh 开工"
            exit 1
          fi
          if [ "$slabel" -gt 1 ]; then
            echo "::error::Issue #${num} 有 ${slabel} 个状态标签 —— 状态必须唯一，用 scripts/status.sh 修正"
            exit 1
          fi
          echo "✅ 分支命名合规；Issue #${num} 处于 OPEN 且恰好一个状态标签"

  template:
    name: policy/template
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: PR 正文按模板六段填写
        run: |
          set -euo pipefail
          PR='${{ github.event.pull_request.number }}'
          REPO='${{ github.repository }}'
          gh pr view "$PR" -R "$REPO" --json body --jq .body > /tmp/pr-body.md
          ok=1
          for i in 1 2 3 4 5 6; do
            if ! grep -qE "^## ${i}\." /tmp/pr-body.md; then
              echo "::error::缺少第 ${i} 节 —— 请用 .github/PULL_REQUEST_TEMPLATE.md 的六段结构（1.变更摘要 2.影响面 3.回滚方式 4.验收证据 5.DoD自查 6.风险与破坏性变更）"
              ok=0
            fi
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi
          echo "✅ 六段齐备"

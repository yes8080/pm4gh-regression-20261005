name: required-checks

# ★ 本文件是仓库全部 **5 个必需状态检查**的唯一来源。硬约束（违反会让所有 PR 永久卡住）：
#   1. 每个 job 的 `name:` 就是必需检查的 context（官方：context = job 的 name，不是文件名、
#      不是 workflow 的 name）。一旦被规则集引用就**不得改名**。
#   2. 本文件**不得**配置 paths / branches 过滤：被跳过的工作流，其检查会永久 pending。
#   3. 只监听 pull_request —— 官方认可的必需检查事件之一（`issue_comment` 等不算）。
#   4. 不要在这里加"先失败后通过"的检查：必需检查一旦在某个 SHA 上留下失败结论，
#      后续同名检查通过也无法解除阻塞（见 references/traps.md 陷阱 1）。
#   5. 若将来启用 Merge Queue，必须同时给这 5 个 job 接上 merge_group 事件。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: required-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: ci/lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 脚本语法 + bash 3.2 兼容性（覆盖全部被跟踪脚本）
        run: |
          set -euo pipefail
          # 覆盖面 = **全部被跟踪的 shell 脚本**（*.sh 与带 bash/sh shebang 的文件）。
          # 用 git ls-files 而不是 glob：新增脚本目录无需改本文件，也不会静默漏检。
          list=/tmp/tracked-scripts.txt
          : > "$list"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ ! -f "$f" ]; then continue; fi
            case "$f" in
              *.sh) printf '%s\n' "$f" >> "$list" ;;
              *)
                if grep -qE '^#!.*(bash|/sh)([[:space:]]|$)' <<<"$(head -n 1 "$f" 2>/dev/null)"; then
                  printf '%s\n' "$f" >> "$list"
                fi
                ;;
            esac
          done < <(git ls-files)
          sort -u "$list" -o "$list"
          if [ ! -s "$list" ]; then
            echo "::error::git ls-files 没有产出任何脚本 —— 覆盖面为空，检查形同虚设"
            exit 1
          fi
          printf '覆盖脚本：\n'; cat "$list"
          fail=0
          # 1) bash 语法
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! bash -n "$f"; then
              echo "::error file=$f::bash 语法错误"
              fail=1
            fi
          done < "$list"
          # 2) bash 3.2 兼容性：只在**代码行**里查（注释行允许出现这些字样）
          files="$(tr '\n' ' ' < "$list")"
          code_hits() {
            grep -nHP "$1" $files 2>/dev/null | awk -F: '{
              c = $0
              sub(/^[^:]*:[0-9]+:/, "", c)
              if (c !~ /^[[:space:]]*#/) print $0
            }' || true
          }
          h1="$(code_hits '\b(mapfile|readarray)\b|declare[[:space:]]+-A|\$\{[A-Za-z_][A-Za-z0-9_]*(,,|\^\^)')"
          if [ -n "$h1" ]; then
            printf '%s\n' "$h1"
            echo "::error::使用了 bash 4 特性（mapfile / readarray / declare -A / 变量大小写改写）。macOS 自带 bash 3.2 会直接失败。"
            fail=1
          fi
          h2="$(code_hits '\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]')"
          if [ -n "$h2" ]; then
            printf '%s\n' "$h2"
            echo "::error::检测到「\$VAR 紧跟非 ASCII 字符」：bash 3.2 会把多字节序列并入变量名 → unbound variable。请写成 \${VAR}。"
            fail=1
          fi
          if [ "$fail" = 0 ]; then echo "✅ 脚本语法与 bash 3.2 兼容性通过"; fi
          exit "$fail"
      - name: JSON 文件有效性
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! jq -e . "$f" >/dev/null; then
              echo "::error file=$f::非法 JSON"
              fail=1
            fi
          done <<EOF
          $(git ls-files '*.json')
          EOF
          if [ "$fail" = 0 ]; then echo "✅ JSON 全部有效"; fi
          exit "$fail"

  test:
    name: ci/test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: 必需检查的 5 个 context 与工作流 job 名精确一致
        run: |
          set -euo pipefail
          # 官方：必需检查的 context = job 的 name；改名 = 所有 PR 永久 pending。
          # 所以这里要求三方**集合相等**（不是子集）：工作流产出的检查名 == 规则集引用集 == 这 5 个字面量。
          rs=.github/rulesets/main-protection.json
          expected="$(printf '%s\n' ci/lint ci/test policy/linked-issue policy/branch-name policy/template | sort -u)"
          wf="$(grep -hE '^[[:space:]]+name: (ci|policy)/' .github/workflows/*.yml \
            | sed -E 's/^[[:space:]]*name:[[:space:]]*//' | sort -u)"
          got="$(jq -r '.rules[]|select(.type=="required_status_checks")|.parameters.required_status_checks[].context' "$rs" | sort -u)"
          bad=0
          if [ "$wf" != "$expected" ]; then
            echo "::error file=$rs::工作流产出的检查名与 5 个必需 context 不一致"
            bad=1
          fi
          if [ "$got" != "$expected" ]; then
            echo "::error file=$rs::规则集引用的必需 context 与 5 个必需 context 不一致"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then
            echo "--- 期望 ---"; printf '%s\n' "$expected"
            echo "--- 工作流实际 ---"; printf '%s\n' "$wf"
            echo "--- 规则集实际 ---"; printf '%s\n' "$got"
            exit 1
          fi
          echo "✅ 5 个必需检查逐字一致：$(printf '%s' "$expected" | tr '\n' ' ')"
      - name: 规则集结构不变量
        run: |
          set -euo pipefail
          f=.github/rulesets/main-protection.json
          pr() { jq -r ".rules[]|select(.type==\"pull_request\")|.parameters.$1" "$f"; }
          bad=0
          if [ "$(jq -r .enforcement "$f")" != "active" ]; then echo "::error file=$f::enforcement 应为 active"; bad=1; fi
          if [ "$(jq -r '.bypass_actors|length' "$f")" != "0" ]; then echo "::error file=$f::bypass 名单必须为空（无人可绕过）"; bad=1; fi
          refs="$(jq -r '.conditions.ref_name.include[]' "$f")"
          if [ "$refs" != "~DEFAULT_BRANCH" ]; then echo "::error file=$f::目标分支必须只有 ~DEFAULT_BRANCH（当前：${refs}）"; bad=1; fi
          case "$refs" in *'*'*) echo "::error file=$f::目标含通配符 * —— 官方：会导致合并后无法自动删除头分支"; bad=1 ;; esac
          if [ "$(pr required_approving_review_count)" != "1" ]; then echo "::error file=$f::required_approving_review_count 应为 1"; bad=1; fi
          if [ "$(pr require_code_owner_review)" != "true" ]; then echo "::error file=$f::require_code_owner_review 应为 true（三身份隔离靠它）"; bad=1; fi
          if [ "$(pr require_last_push_approval)" != "true" ]; then echo "::error file=$f::require_last_push_approval 应为 true"; bad=1; fi
          if [ "$(pr require_extra_approval_for_unattributed_changes)" != "true" ]; then
            echo "::error file=$f::require_extra_approval_for_unattributed_changes 应为 true（线上真实值；含无法归属到 GitHub 身份的提交时需额外批准）"
            bad=1
          fi
          if [ "$(jq -rc '.rules[]|select(.type=="pull_request")|.parameters.required_reviewers' "$f")" != '[]' ]; then
            echo "::error file=$f::required_reviewers 应为 []（线上真实值：不指定具体评审人）"
            bad=1
          fi
          if [ "$(pr dismiss_stale_reviews_on_push)" != "true" ]; then echo "::error file=$f::dismiss_stale_reviews_on_push 应为 true"; bad=1; fi
          if [ "$(jq -rc '.rules[]|select(.type=="pull_request")|.parameters.allowed_merge_methods' "$f")" != '["squash"]' ]; then
            echo "::error file=$f::allowed_merge_methods 只能是 [\"squash\"]"
            bad=1
          fi
          if [ "$(jq -r '.rules[]|select(.type=="required_status_checks")|.parameters.strict_required_status_checks_policy' "$f")" != "true" ]; then
            echo "::error file=$f::strict_required_status_checks_policy 应为 true"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "✅ 规则集结构不变量通过"
      - name: 规则集全量 diff 判据唯一 + 文件全量键齐备（与 preflight.sh 同一判据）
        run: |
          set -euo pipefail
          sh=scripts/preflight.sh
          f=.github/rulesets/main-protection.json
          # 判据必须与 scripts/preflight.sh 里的 RULESET_CANON_JQ **逐字一致**：
          # preflight.sh 用它对线上规则集做整份 diff，这里断言不存在第二套实现。
          # 新增/删除线上键时，两个地方一起改（并同步下面的全量键集），这是有意的摩擦。
          # RULESET_CANON_JQ:BEGIN
          RULESET_CANON_JQ='def canon: with_entries(select(.key|startswith("_comment")|not)) | del(.id,.node_id,.source_type,.source,.created_at,.updated_at,.current_user_can_bypass,._links) | .conditions.ref_name.include = ((.conditions.ref_name.include // [])|sort) | .conditions.ref_name.exclude = ((.conditions.ref_name.exclude // [])|sort) | .bypass_actors = ((.bypass_actors // [])|sort_by(.actor_id|tostring)) | .rules = ((.rules // []) | map(if (.type == "required_status_checks" and .parameters) then .parameters.required_status_checks = ((.parameters.required_status_checks // [])|sort_by(.context)) else . end) | sort_by(.type)); canon'
          # RULESET_CANON_JQ:END
          sh_jq="$(sed -n '/RULESET_CANON_JQ:BEGIN/,/RULESET_CANON_JQ:END/p' "$sh" \
            | sed -e '1d' -e '$d' | tr -d '\n' \
            | sed -E "s/^[[:space:]]*RULESET_CANON_JQ='//; s/'[[:space:]]*\$//")"
          bad=0
          if [ -z "$sh_jq" ]; then
            echo "::error file=$sh::未能从 preflight.sh 解析出 RULESET_CANON_JQ 判据"
            bad=1
          elif [ "$sh_jq" != "$RULESET_CANON_JQ" ]; then
            echo "::error::preflight.sh 与 ci/test 的规则集比对判据不一致（必须逐字相同 —— 同一判据，不是两套实现）"
            echo "--- preflight.sh ---"; printf '%s\n' "$sh_jq"
            echo "--- ci/test ---"; printf '%s\n' "$RULESET_CANON_JQ"
            bad=1
          fi
          # 判据本身必须能规范化本文件（否则 preflight 在线上拿到的判据是坏的）
          if ! jq -S "$RULESET_CANON_JQ" "$f" > /tmp/ruleset-canon.json; then
            echo "::error file=$f::RULESET_CANON_JQ 无法规范化本文件"
            bad=1
          fi
          # 声明文件里不得混入服务端只读元数据（那是线上响应的一部分，不是声明）
          if jq -e 'has("id") or has("node_id") or has("source") or has("source_type") or has("created_at") or has("updated_at") or has("current_user_can_bypass") or has("_links")' "$f" >/dev/null; then
            echo "::error file=$f::出现服务端只读元数据键（id/node_id/source/source_type/created_at/updated_at/current_user_can_bypass/_links）"
            bad=1
          fi
          # 全量键：两处参数键集必须与线上全量键**精确相等**（多一个、少一个都报错）
          want_pr='allowed_merge_methods,dismiss_stale_reviews_on_push,require_code_owner_review,require_extra_approval_for_unattributed_changes,require_last_push_approval,required_approving_review_count,required_review_thread_resolution,required_reviewers'
          pr_keys="$(jq -r '.rules[]|select(.type=="pull_request")|.parameters|keys_unsorted|sort|join(",")' "$f")"
          if [ "$pr_keys" != "$want_pr" ]; then
            echo "::error file=$f::pull_request 参数键集与线上全量键不符"
            echo "--- 期望 ---"; printf '%s\n' "$want_pr"
            echo "--- 实际 ---"; printf '%s\n' "$pr_keys"
            bad=1
          fi
          want_rsc='do_not_enforce_on_create,required_status_checks,strict_required_status_checks_policy'
          rsc_keys="$(jq -r '.rules[]|select(.type=="required_status_checks")|.parameters|keys_unsorted|sort|join(",")' "$f")"
          if [ "$rsc_keys" != "$want_rsc" ]; then
            echo "::error file=$f::required_status_checks 参数键集与线上全量键不符"
            echo "--- 期望 ---"; printf '%s\n' "$want_rsc"
            echo "--- 实际 ---"; printf '%s\n' "$rsc_keys"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "✅ 规则集判据唯一（与 preflight.sh 逐字一致）且文件全量键齐备"
      - name: 凭据隔离判据在 review.sh 与 preflight.sh 逐字一致（同一实现 + 反向样本）
        run: |
          set -euo pipefail
          # **必须**逐字一致：隔离判据「凭据落在工作区内 → 拒绝」在 review.sh 与 preflight.sh 两处都成立，
          # 而脚本必须**自包含**（不引共享库）→ 两处文本只能逐字相同；只改一处 = 两套实现、口径分裂。
          # 断言本身也带反向样本 —— 否则「两处都空」也算"一致"。
          a="$(sed -n '/WORKSPACE_ASSERT:BEGIN/,/WORKSPACE_ASSERT:END/p' scripts/review.sh | sed -e '1d' -e '$d')"
          b="$(sed -n '/WORKSPACE_ASSERT:BEGIN/,/WORKSPACE_ASSERT:END/p' scripts/preflight.sh | sed -e '1d' -e '$d')"
          bad=0
          if [ -z "$a" ]; then echo "::error file=scripts/review.sh::未能从 WORKSPACE_ASSERT 标记区解析出隔离判据"; bad=1; fi
          if [ -z "$b" ]; then echo "::error file=scripts/preflight.sh::未能从 WORKSPACE_ASSERT 标记区解析出隔离判据"; bad=1; fi
          if [ "$a" != "$b" ]; then
            echo "::error::review.sh 与 preflight.sh 的凭据隔离判据不一致（必须逐字相同 —— 同一判据，不是两套实现）"
            echo "--- review.sh ---"; printf '%s\n' "$a"
            echo "--- preflight.sh ---"; printf '%s\n' "$b"
            bad=1
          fi
          if [ -z "$a" ] || [ -z "$b" ]; then exit 1; fi
          # ① 功能样本：判据必须真的能分出「工作区内」与「工作区外」（防「逐字一致但一致地坏」）
          mkdir -p /tmp/ws-assert
          printf '%s\n' "$a" > /tmp/ws-assert/judge.sh
          printf 'pat_in_workspace "$1"\n' >> /tmp/ws-assert/judge.sh
          if ! bash /tmp/ws-assert/judge.sh "$(pwd -P)/scripts/review.sh"; then
            echo "::error::隔离判据没有把仓库内路径判为「工作区内」"; bad=1
          fi
          if bash /tmp/ws-assert/judge.sh "${HOME}/.config/pm4gh/reviewer.pat"; then
            echo "::error::隔离判据把工作区外路径判成了「工作区内」"; bad=1
          fi
          # ② 反向样本 A：模拟「改一处、漏一处」（把 preflight.sh 侧文本改一个字符）→ 逐字比对必须失败
          mutated="$(printf '%s\n' "$b" | sed 's/pat_in_workspace/pat_in_workspace_x/')"
          if [ "$a" = "$mutated" ]; then
            echo "::error::反向样本 A 未失败：判据文本被改动后两处仍然相等 —— 逐字断言形同虚设"; bad=1
          fi
          # ③ 反向样本 B：把判据改成永不命中（= 各自为政的空判据）→ 功能样本必须抓得住
          printf '%s\n' "$b" | sed 's#"\$ws_root"|"\$ws_root"/\*#/__never__|/__never__/*#' > /tmp/ws-assert/judge-broken.sh
          printf 'pat_in_workspace "$1"\n' >> /tmp/ws-assert/judge-broken.sh
          if bash /tmp/ws-assert/judge-broken.sh "$(pwd -P)/scripts/review.sh"; then
            echo "::error::反向样本 B 未失败：判据被改成永不命中后，仓库内路径仍被判为「工作区内」"; bad=1
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "✅ review.sh 与 preflight.sh 的凭据隔离判据逐字一致；功能样本通过；反向样本 A/B 按预期失败"
      - name: 脚本有可执行位且自包含（无共享库）
        run: |
          set -euo pipefail
          fail=0
          for f in scripts/*.sh; do
            [ -f "$f" ] || continue
            if ! bash -n "$f"; then
              echo "::error file=$f::bash 语法错误"
              fail=1
            fi
            if [ ! -x "$f" ]; then
              echo "::error file=$f::缺少可执行位（chmod +x ${f}）"
              fail=1
            fi
          done
          if git grep -nE '(^|[^A-Za-z0-9_])lib\.sh' -- scripts >/dev/null 2>&1; then
            git grep -nE '(^|[^A-Za-z0-9_])lib\.sh' -- scripts
            echo "::error::scripts/ 引用了共享库 lib.sh —— 脚本必须自包含（见 SKILL.md）"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✅ scripts/*.sh 语法通过、有可执行位、且不依赖共享库"
      - name: PR 模板六段齐备 + CODEOWNERS 至少两名 owner
        run: |
          set -euo pipefail
          n="$(grep -cE '^## [1-6]\.' .github/PULL_REQUEST_TEMPLATE.md || true)"
          if [ "$n" -ne 6 ]; then
            echo "::error file=.github/PULL_REQUEST_TEMPLATE.md::需要 6 段，当前 ${n}"
            exit 1
          fi
          owners="$(awk '/^\*/ { for (i = 2; i <= NF; i++) print $i }' .github/CODEOWNERS | sort -u | grep -c . || true)"
          if [ "$owners" -lt 2 ]; then
            echo "::error file=.github/CODEOWNERS::默认规则必须至少 2 名 owner（否则作者路径会永久无法合并）"
            exit 1
          fi
          echo "✅ PR 模板六段齐备；CODEOWNERS 默认规则有 ${owners} 名 owner"
      - name: 开放 Issue 恰好 0 或 1 个合法状态标签
        run: |
          set -euo pipefail
          allowed="status/ready status/in-progress status/in-review"
          gh issue list -R "$REPO" --state open --limit 200 --json number,labels \
            --jq '.[] | "\(.number)\t\([.labels[].name | select(startswith("status/"))] | join(","))"' > /tmp/status.tsv
          bad=0
          while IFS="$(printf '\t')" read -r n labels; do
            [ -n "$n" ] || continue
            [ -n "$labels" ] || continue
            cnt="$(printf '%s' "$labels" | tr ',' '\n' | grep -c . || true)"
            if [ "$cnt" -gt 1 ]; then
              echo "::error::Issue #${n} 有多个状态标签（${labels}）—— 用 scripts/status.sh 修正"
              bad=1
              continue
            fi
            case " ${allowed} " in
              *" ${labels} "*) : ;;
              *) echo "::error::Issue #${n} 使用了未定义的状态标签 ${labels}"; bad=1 ;;
            esac
          done < /tmp/status.tsv
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "✅ 全部开放 Issue 恰好 0 或 1 个合法状态标签"
      - name: 机器消费的标签在平台上存在（与 preflight.sh 同一判据 + 反向样本）
        run: |
          set -euo pipefail
          # 断言"机器消费的标签必须存在"，不新增必需检查：标签是仓库级对象，不在版本库里、没有清单；
          # status.sh 的 --add-label 遇到不存在的标签会直接失败，start.sh 靠 type/* 推导分支类型
          # （缺标签就静默退化）。
          # 判据只有一套：权威副本是下面的 heredoc，scripts/preflight.sh 的副本必须逐字一致；
          # 反向样本（抽掉 type/hotfix）证明判据本身不是空断言。
          cat > /tmp/label-assert.sh <<'EOS'
          MACHINE_LABELS="status/ready status/in-progress status/in-review type/bug type/hotfix type/spike type/chore"
          assert_machine_labels() {
            missing=""
            for l in $MACHINE_LABELS; do
              grep -qxF "$l" <<<"${1:-}" || missing="${missing} ${l}"
            done
            if [ -n "$missing" ]; then
              printf '[FAIL] 机器消费的标签在平台上不存在：%s\n' "$missing" >&2
              printf '       后果：status.sh 迁移直接失败 / start.sh 静默退化。标签是仓库级对象 —— 报告 dispatcher，不要自行删改线上标签\n' >&2
              return 1
            fi
            printf '[ OK ] 机器消费的标签全部存在（%s）\n' "$MACHINE_LABELS"
            return 0
          }
          EOS
          bad=0
          # ① 判据唯一：preflight.sh 的 LABEL_ASSERT 标记区必须与本步骤的权威副本一致（忽略缩进/空行）
          have="$(sed -n '/LABEL_ASSERT:BEGIN/,/LABEL_ASSERT:END/p' scripts/preflight.sh | sed -e '1d' -e '$d' | sed -E 's/^[[:space:]]+//' | grep -v '^$')"
          want="$(sed -E 's/^[[:space:]]+//' /tmp/label-assert.sh | grep -v '^$')"
          if [ -z "$have" ]; then
            echo "::error file=scripts/preflight.sh::未能从 LABEL_ASSERT 标记区解析出判据"
            bad=1
          elif [ "$have" != "$want" ]; then
            echo "::error::preflight.sh 与 ci/test 的标签判据不一致（必须逐字相同 —— 同一判据，不是两套实现）"
            echo "--- preflight.sh ---"; printf '%s\n' "$have"
            echo "--- ci/test ---"; printf '%s\n' "$want"
            bad=1
          fi
          . /tmp/label-assert.sh
          # ② 线上标签：机器消费的每一个都必须存在
          live="$(gh label list -R "$REPO" --limit 200 --json name --jq '.[].name')"
          if [ -z "$live" ]; then
            echo "::error::读不到线上标签清单（gh label list 返回空）"
            bad=1
          elif ! assert_machine_labels "$live"; then
            bad=1
          fi
          # ③ 反向样本：抽掉 type/hotfix 后断言**必须失败**（退化成空断言会被这一步抓住）
          if [ -n "$live" ] && assert_machine_labels "$(printf '%s\n' "$live" | grep -vxF 'type/hotfix')"; then
            echo "::error::反向样本未失败：缺 type/hotfix 时断言仍然通过 —— 判据形同虚设"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "✅ 机器消费的标签全部存在；判据与 preflight.sh 逐字一致；反向样本（缺 type/hotfix）按预期失败"
      - name: references/status-machine.md 状态机转换表与 scripts/status.sh 逐字一致（防文档漂移）
        run: |
          set -euo pipefail
          # 转换表只有一处权威定义（status.sh）；references/status-machine.md 的表由本步断言逐字一致：
          # 状态集（VALID_STATES vs 转换表首列）与边集（TRANSITIONS vs 标记区每行的 to 列）都逐字比对。
          # 表是唯一权威，**禁止**画图（图带语法开销、隐式节点易漏）。
          sh=scripts/status.sh
          md=references/status-machine.md
          sh_states="$(grep -m1 '^VALID_STATES=' "$sh" | sed -E 's/^VALID_STATES="//; s/"$//' | tr ' ' '\n' | sort -u)"
          sh_edges="$(sed -nE 's/^TRANSITIONS="(.*)"$/\1/p' "$sh" | tr ' ' '\n' \
            | grep -E '^[a-z-]+->[a-z-]+$' | sort -u)"
          # 状态集取自 <!-- TRANSITIONS:BEGIN/END --> 标记区的**第一列**（每行一个 from），
          # 不再依赖第二份逐状态表 —— 同一事实只留一处载体。
          md_states="$(sed -n '/TRANSITIONS:BEGIN/,/TRANSITIONS:END/p' "$md" \
            | sed -nE 's/^`([a-z-]+)`[[:space:]]*\|.*/\1/p' | sort -u)"
          # 转换表 = 文档里 <!-- TRANSITIONS:BEGIN --> 与 END 之间的表；每行形如
          #   `from` | `to1` `to2` ...（行首是 `from`，其余反引号里的都是出边）
          md_edges="$(sed -n '/TRANSITIONS:BEGIN/,/TRANSITIONS:END/p' "$md" \
            | grep -E '^`' \
            | while IFS= read -r line; do
                from="$(printf '%s' "$line" | sed -E 's/^`([a-z-]+)`.*/\1/')"
                rest="$(printf '%s' "$line" | sed -E 's/^`[a-z-]+`[[:space:]]*\|[[:space:]]*//')"
                for to in $(printf '%s\n' "$rest" | tr '`' '\n' | grep -E '^[a-z-]+$'); do
                  [ "$to" = "$from" ] && continue
                  printf '%s->%s\n' "$from" "$to"
                done
              done | sort -u)"
          bad=0
          # 自检：表里每条边的 from/to 都必须是状态集里的状态（防手写笔误，例如 backlog->redy）
          for e in $(printf '%s\n' "$sh_edges"); do
            f="${e%%->*}"; t="${e##*->}"
            grep -qxF "$f" <<<"$sh_states" || { echo "::error file=$sh::转换表里的状态 ${f} 不在 VALID_STATES 内"; bad=1; }
            grep -qxF "$t" <<<"$sh_states" || { echo "::error file=$sh::转换表里的状态 ${t} 不在 VALID_STATES 内"; bad=1; }
          done
          [ -n "$sh_states" ] || { echo "::error file=$sh::未能解析出 VALID_STATES"; bad=1; }
          [ -n "$sh_edges" ]  || { echo "::error file=$sh::未能解析出 TRANSITIONS"; bad=1; }
          [ -n "$md_states" ] || { echo "::error file=$md::未能解析出转换表首列（状态集）"; bad=1; }
          [ -n "$md_edges" ]  || { echo "::error file=$md::未能解析出转换表（TRANSITIONS 标记区内的 from→to 行）"; bad=1; }
          if [ "$sh_states" != "$md_states" ]; then
            echo "::error file=$md::状态集与 scripts/status.sh 不一致"
            echo "--- status.sh ---"; printf '%s\n' "$sh_states"
            echo "--- references/status-machine.md ---"; printf '%s\n' "$md_states"
            bad=1
          fi
          if [ "$sh_edges" != "$md_edges" ]; then
            echo "::error file=$md::转换表与 scripts/status.sh 不一致（文档漂移）"
            echo "--- status.sh 独有 ---"; comm -23 <(printf '%s\n' "$sh_edges") <(printf '%s\n' "$md_edges")
            echo "--- references/status-machine.md 独有 ---"; comm -13 <(printf '%s\n' "$sh_edges") <(printf '%s\n' "$md_edges")
            bad=1
          fi
          # 自检：终态不得有出边（done/canceled 是终态；迁出只能靠 gh issue reopen 后走合法边）
          for t in done canceled; do
            if grep -qE "^${t}->" <<<"$sh_edges"; then
              echo "::error file=$sh::终态 ${t} 不应有出边"; bad=1
            fi
          done
          # 自检：每个状态都必须有到 canceled 的出口（「不做」的通用终止边），done/canceled 除外
          for st in $(printf '%s\n' "$sh_states"); do
            case "$st" in done|canceled) continue ;; esac
            grep -qxF "${st}->canceled" <<<"$sh_edges" || {
              echo "::error file=$sh::状态 ${st} 缺少 -> canceled 终止边"; bad=1; }
          done
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "✅ 状态集与转换表逐字一致（$(printf '%s\n' "$sh_edges" | grep -c .) 条边，$(printf '%s\n' "$sh_states" | grep -c .) 个状态）"
          printf '%s\n' "$sh_edges"

      - name: 状态迁移是 HTTP 层单请求：恰好 1 次标签写请求 + 载荷含全部非 status/* 标签（stub gh + 反向样本）
        run: |
          set -euo pipefail
          # ── 状态迁移的判据：「HTTP 层单请求」（#115）──────────────────────────────────
          # 带标签→带标签的迁移**必须**是 REST `PUT …/labels` **整份替换**（HTTP 层 1 次请求）；
          # **禁止** `gh issue edit` 或多次调用：HTTP 层是 add/remove 两个**并发** mutation，
          # 中间态可以是 0 个或 2 个 status/*，policy/branch-name 对两者都判失败（失败 SHA 不可逆）。
          # 断言必须常驻 ci/test，而不是在 /tmp 跑一次：
          #   ① 非终态迁移**恰好 1 次**标签写请求（stub gh 记录；`gh issue edit` 一次都不许有）
          #   ② 替换请求的载荷**包含全部非 status/ 标签** —— 整份替换会静默删掉没带上的标签
          #   ③ 读回校验：写后再 GET 一次比对非 status/* 集合；被他人改动 → 报告且**不重试覆盖**
          # 反向样本内置：反例 A（两次写请求）→ 断言必须失败；反例 B（载荷漏带 type/*）→ 断言必须失败。
          ST=/tmp/status-put-check
          rm -rf "$ST"; mkdir -p "$ST/bin" "$ST/s"

          # ① 被测逻辑的唯一来源是 scripts/status.sh 的标记区（不复制第二份实现；标记区消失也报错）
          sed -n '/STATUS_LABELS_PUT:BEGIN/,/STATUS_LABELS_PUT:END/p' scripts/status.sh > "$ST/region.txt"
          if ! grep -q 'put_status_labels' "$ST/region.txt"; then
            echo "::error file=scripts/status.sh::未能从 STATUS_LABELS_PUT 标记区解析出「单次 HTTP 写请求」实现"
            exit 1
          fi
          if ! grep -q 'TEST_ANCHOR:PUT' "$ST/region.txt"; then
            echo "::error file=scripts/status.sh::标记区缺少反向样本锚点 TEST_ANCHOR:PUT —— 反向样本会退化成空断言"
            exit 1
          fi

          # ② stub gh：把「平台」状态放进文件，记录每一次调用与每一次写请求的载荷
          cat > "$ST/bin/gh" <<'EOS'
          #!/usr/bin/env bash
          set -eu
          S="${STUB_STATE:?stub gh 需要 STUB_STATE}"
          mkdir -p "$S"
          printf '%s\n' "$*" >> "$S/calls.log"

          issue_json() {
            st="$(cat "$S/state.txt" 2>/dev/null || printf 'OPEN')"
            rs="$(cat "$S/reason.txt" 2>/dev/null || printf 'COMPLETED')"
            printf '{"number":%s,"state":"%s","stateReason":"%s","labels":[' "$1" "$st" "$rs"
            first=1
            while IFS= read -r l; do
              [ -n "$l" ] || continue
              if [ "$first" = 1 ]; then first=0; else printf ','; fi
              printf '{"name":"%s"}' "$l"
            done < "$S/labels.txt"
            printf ']}'
          }

          bump() {
            n=0; [ -f "$1" ] && n="$(cat "$1")"
            printf '%s\n' "$((n + 1))" > "$1"
          }

          labels_json() {
            first=1
            printf '['
            while IFS= read -r l; do
              [ -n "$l" ] || continue
              if [ "$first" = 1 ]; then first=0; else printf ','; fi
              printf '{"name":"%s"}' "$l"
            done < "$S/labels.txt"
            printf ']'
          }

          case "${1:-}" in
            repo)
              printf 'yes8080/pm4gh\n' ;;
            api)
              shift
              method=GET; path=""; jqexpr=""
              while [ $# -gt 0 ]; do
                case "$1" in
                  -X) method="$2"; shift 2 ;;
                  --jq) jqexpr="$2"; shift 2 ;;
                  --input) shift; [ "${1:-}" = "-" ] && shift ;;
                  --paginate) shift ;;
                  -*) shift ;;
                  *) path="$1"; shift ;;
                esac
              done
              case "$path" in
                user) printf 'yes8080-dev-bot\n' ;;
                */issues/*/labels)
                  if [ "$method" = "PUT" ]; then
                    bump "$S/writes.count"
                    idx="$(cat "$S/writes.count")"
                    cat > "$S/put-${idx}.json"
                    jq -r '.[]' "$S/put-${idx}.json" > "$S/labels.txt"
                    # 并发窗口模拟：本次 PUT 之后，他人又改了一次非 status/* 标签
                    [ "${STUB_TAMPER:-0}" = "1" ] && printf 'area/other\n' >> "$S/labels.txt"
                  else
                    bump "$S/get-labels.count"
                    if [ -n "$jqexpr" ]; then
                      labels_json | jq -r "$jqexpr"
                    else
                      labels_json
                    fi
                  fi
                  ;;
                *) printf 'stub gh: 未实现的 api 路径 %s\n' "$path" >&2; exit 9 ;;
              esac
              ;;
            issue)
              shift
              sub="${1:-}"; shift || true
              num="${1:-0}"; shift || true
              jqexpr=""; reason=""
              while [ $# -gt 0 ]; do
                case "$1" in
                  --jq) jqexpr="$2"; shift 2 ;;
                  --reason) reason="$2"; shift 2 ;;
                  --json) shift 2 ;;
                  -R) shift 2 ;;
                  *) shift ;;
                esac
              done
              case "$sub" in
                view)
                  obj="$(issue_json "$num")"
                  if [ -n "$jqexpr" ]; then printf '%s' "$obj" | jq -r "$jqexpr"; else printf '%s\n' "$obj"; fi
                  ;;
                close)
                  printf 'CLOSED\n' > "$S/state.txt"
                  case "${reason:-}" in
                    "not planned"|not_planned) printf 'NOT_PLANNED\n' > "$S/reason.txt" ;;
                    *) printf 'COMPLETED\n' > "$S/reason.txt" ;;
                  esac
                  ;;
                edit)
                  # 回归护栏：标签迁移**不得**再走 `gh issue edit`（它的 HTTP 层不是单请求）
                  bump "$S/issue-edit.count"
                  ;;
                *) printf 'stub gh: 未实现的 issue 子命令 %s\n' "$sub" >&2; exit 9 ;;
              esac
              ;;
            *) printf 'stub gh: 未实现的子命令 %s\n' "$*" >&2; exit 9 ;;
          esac
          exit 0
          EOS
          chmod +x "$ST/bin/gh"

          # ③ 反例 A 的插入行：先发一次「只保留非 status/*」的写请求（= #93 的 remove），锚点行使是 add → 两次写
          cat > "$ST/ins-a.txt" <<'EOS'
            printf '%s' "$(printf '%s' "$sp_payload" | jq -c '[.[] | select(startswith("status/") | not)]')" | put_status_labels "$sp_repo" "$sp_issue" || return 1
          EOS
          INS_A="$(cat "$ST/ins-a.txt")" awk 'index($0, "TEST_ANCHOR:PUT") { print ENVIRON["INS_A"] } { print }' scripts/status.sh > "$ST/impl-2calls.sh"

          # ④ 反例 B：载荷只发目标 status 标签（漏掉全部非 status/* 标签）
          cat > "$ST/repl-b.txt" <<'EOS'
            sp_payload="$(printf '%s\n' "$sp_target" | jq -R . | jq -cs .)"   # TEST_ANCHOR:PAYLOAD（反例 B）
          EOS
          REPL_B="$(cat "$ST/repl-b.txt")" awk 'index($0, "TEST_ANCHOR:PAYLOAD") { print ENVIRON["REPL_B"]; next } { print }' scripts/status.sh > "$ST/impl-nokeep.sh"

          # ⑤ 把真实 status.sh（或其变异副本）跑在 stub 平台上：in-progress → in-review
          run_case() { # run_case <实现文件> <tamper 0|1>
            impl="$1"; tamper="${2:-0}"
            S="$ST/s"; rm -rf "$S"; mkdir -p "$S"
            printf 'type/bug\narea/ci\nrole/dev\nprio/P2\nstatus/in-progress\n' > "$S/labels.txt"
            printf 'OPEN\n' > "$S/state.txt"; printf 'COMPLETED\n' > "$S/reason.txt"
            : > "$S/calls.log"
            printf '0\n' > "$S/writes.count"; printf '0\n' > "$S/get-labels.count"; printf '0\n' > "$S/issue-edit.count"
            rc=0
            PATH="$ST/bin:$PATH" STUB_STATE="$S" STUB_TAMPER="$tamper" \
              bash "$impl" 999 in-review > "$S/out.log" 2>&1 || rc=$?
          }

          assert_transition() { # assert_transition <样本名>
            name="$1"; bad=0
            writes="$(cat "$ST/s/writes.count")"
            if [ "$writes" = "1" ]; then
              printf '  [ OK ] %s：标签写请求次数 = 1（HTTP 层单请求）\n' "$name"
            else
              printf '  [FAIL] %s：标签写请求次数 = %s（必须恰好 1：HTTP 层单请求）\n' "$name" "$writes"
              bad=1
            fi
            edits="$(cat "$ST/s/issue-edit.count")"
            if [ "$edits" = "0" ]; then
              printf '  [ OK ] %s：未使用 gh issue edit（HTTP 层非单请求的实现）\n' "$name"
            else
              printf '  [FAIL] %s：出现了 %s 次 gh issue edit —— 判据是 HTTP 层单请求，不是「一次 CLI 调用」\n' "$name" "$edits"
              bad=1
            fi
            last="$ST/s/put-${writes}.json"; have=""
            [ -f "$last" ] && have="$(jq -r '.[]' "$last")"
            for l in type/bug area/ci role/dev prio/P2; do
              if grep -qxF "$l" <<<"$have"; then
                printf '  [ OK ] %s：载荷含非 status/ 标签 %s\n' "$name" "$l"
              else
                printf '  [FAIL] %s：载荷缺少非 status/ 标签 %s（整份替换会静默删掉它）\n' "$name" "$l"
                bad=1
              fi
            done
            sn="$(printf '%s\n' "$have" | grep -c '^status/' || true)"
            if [ "$sn" = "1" ] && grep -qxF 'status/in-review' <<<"$have"; then
              printf '  [ OK ] %s：载荷的 status/* 恰好 1 个 = status/in-review\n' "$name"
            else
              printf '  [FAIL] %s：载荷的 status/* 不是恰好 1 个目标标签（实测 %s 个）\n' "$name" "$sn"
              bad=1
            fi
            gets="$(cat "$ST/s/get-labels.count")"
            if [ "$gets" = "2" ]; then
              printf '  [ OK ] %s：标签端点 GET = 2（写前读 + 写后读回校验）\n' "$name"
            else
              printf '  [FAIL] %s：标签端点 GET = %s（应为 2：写前读 + 写后读回校验）\n' "$name" "$gets"
              bad=1
            fi
            [ "$bad" -ne 0 ] && return 1
            return 0
          }

          fail=0
          printf '\n== 正向样本：非终态迁移（in-progress → in-review），恰好 1 次写请求 ==\n'
          run_case scripts/status.sh 0
          rc_fwd="$rc"
          assert_transition 正向 || fail=$((fail + 1))
          if [ "$rc_fwd" = "0" ] && grep -q '读回校验一致' "$ST/s/out.log"; then
            printf '  [ OK ] 正向：status.sh 退出码 0 且输出读回校验结论\n'
          else
            printf '  [FAIL] 正向：status.sh 退出码 %s（应为 0）或缺少读回校验结论\n' "$rc_fwd"
            cat "$ST/s/out.log"; fail=$((fail + 1))
          fi
          printf '  —— status.sh 原文：\n'
          sed 's/^/     /' "$ST/s/out.log"
          printf '  —— 写请求载荷 put-1.json：%s\n' "$(cat "$ST/s/put-1.json")"

          printf '\n== 反向样本 A：两次写请求（remove → add）必须让断言失败 ==\n'
          run_case "$ST/impl-2calls.sh" 0
          if assert_transition 反例A; then
            printf '  [FAIL] 反向样本 A 未失败：两次写请求仍通过了「恰好 1 次」断言 —— 断言形同虚设\n'
            fail=$((fail + 1))
          else
            printf '  [ OK ] 反向样本 A 按预期失败（上方 [FAIL] 行）\n'
          fi

          printf '\n== 反向样本 B：载荷漏带非 status/ 标签必须让断言失败 ==\n'
          run_case "$ST/impl-nokeep.sh" 0
          if assert_transition 反例B; then
            printf '  [FAIL] 反向样本 B 未失败：漏带 type/* 仍通过了载荷断言 —— 断言形同虚设\n'
            fail=$((fail + 1))
          else
            printf '  [ OK ] 反向样本 B 按预期失败（上方 [FAIL] 行）\n'
          fi

          printf '\n== 读回校验：写后非 status/ 标签被他人改动 → 报告且不重试覆盖 ==\n'
          run_case scripts/status.sh 1
          rb=0
          if [ "$rc" != "0" ]; then printf '  [ OK ] 读回校验抓到并发改动（status.sh 退出码 %s）\n' "$rc"; else printf '  [FAIL] 读回校验没抓到并发改动（退出码 0）\n'; rb=1; fi
          if grep -q '读回校验不一致' "$ST/s/out.log"; then printf '  [ OK ] 报告原文含「读回校验不一致」\n'; else printf '  [FAIL] 报告原文缺少「读回校验不一致」\n'; rb=1; fi
          if [ "$(cat "$ST/s/writes.count")" = "1" ]; then printf '  [ OK ] 未重试覆盖（写请求仍为 1 次）\n'; else printf '  [FAIL] 发生了重试覆盖（写请求 %s 次）\n' "$(cat "$ST/s/writes.count")"; rb=1; fi
          if grep -q '不重试覆盖' "$ST/s/out.log"; then printf '  [ OK ] 报告原文含「不重试覆盖」的动作说明\n'; else printf '  [FAIL] 报告原文未说明不重试覆盖\n'; rb=1; fi
          printf '  —— status.sh 原文：\n'
          sed 's/^/     /' "$ST/s/out.log"
          [ "$rb" = 0 ] || fail=$((fail + 1))

          printf '\n== 闭环回归：backlog → ready → in-progress → in-review → in-progress → in-review → done ==\n'
          S="$ST/loop"; rm -rf "$S"; mkdir -p "$S"
          printf 'type/bug\narea/ci\nrole/dev\n' > "$S/labels.txt"; printf 'OPEN\n' > "$S/state.txt"; printf 'COMPLETED\n' > "$S/reason.txt"
          : > "$S/calls.log"
          printf '0\n' > "$S/writes.count"; printf '0\n' > "$S/get-labels.count"; printf '0\n' > "$S/issue-edit.count"
          loop_bad=0
          for step in ready in-progress in-review in-progress in-review done; do
            lrc=0
            PATH="$ST/bin:$PATH" STUB_STATE="$S" STUB_TAMPER=0 \
              bash scripts/status.sh 999 "$step" > "$S/out-$step.log" 2>&1 || lrc=$?
            cnt="$(grep -c '^status/' "$S/labels.txt" || true)"
            st="$(cat "$S/state.txt")"
            keep="$(grep -v '^status/' "$S/labels.txt" | grep -c . || true)"
            if [ "$step" = "done" ]; then
              if [ "$lrc" = 0 ] && [ "$cnt" = 0 ] && [ "$st" = "CLOSED" ] && [ "$keep" = 3 ]; then
                printf '  [ OK ] → %-11s 退出码 0；status/* = 0 且 Issue CLOSED（终态载体）；非 status/* 保留 %s 个\n' "$step" "$keep"
              else
                printf '  [FAIL] → %-11s 退出码 %s；status/* = %s；state = %s；非 status/* = %s（应 3）\n' "$step" "$lrc" "$cnt" "$st" "$keep"; loop_bad=1
              fi
            else
              if [ "$lrc" = 0 ] && [ "$cnt" = 1 ] && [ "$keep" = 3 ] && grep -qxF "status/$step" "$S/labels.txt"; then
                printf '  [ OK ] → %-11s 退出码 0；status/* 恰好 1 个 = status/%s；非 status/* 保留 %s 个\n' "$step" "$step" "$keep"
              else
                printf '  [FAIL] → %-11s 退出码 %s；status/* = %s（应为恰好 1 个 status/%s）；非 status/* = %s（应 3）\n' "$step" "$lrc" "$cnt" "$step" "$keep"; loop_bad=1
              fi
            fi
          done
          [ "$loop_bad" = 0 ] || fail=$((fail + 1))
          if [ "$(cat "$S/issue-edit.count")" = "0" ] && [ "$(cat "$S/writes.count")" = "6" ]; then
            printf '  [ OK ] 闭环 6 次迁移 = 6 次标签写请求（每次恰好 1 次），gh issue edit 0 次\n'
          else
            printf '  [FAIL] 闭环写请求 %s 次 / gh issue edit %s 次（应为 6 / 0）\n' "$(cat "$S/writes.count")" "$(cat "$S/issue-edit.count")"
            fail=$((fail + 1))
          fi
          printf '  —— 每步写请求载荷：\n'
          for i in 1 2 3 4 5 6; do printf '     put-%s.json = %s\n' "$i" "$(cat "$S/put-${i}.json")"; done
          printf '  —— 终态标签（应为 3 个非 status/*，无空串标签）：%s\n' "$(tr '\n' ' ' < "$S/labels.txt")"

          printf '\n'
          if [ "$fail" -ne 0 ]; then
            printf '❌ 状态迁移单请求断言失败（%s 项）—— 见上方 [FAIL]\n' "$fail"
            exit 1
          fi
          printf '✅ 非终态迁移恰好 1 次标签写请求 + 载荷含全部非 status/ 标签 + 读回校验不重试覆盖；反向样本 A/B 按预期失败；闭环回归 6 步每步 status/* 恰好 1 个\n'
      - name: 未提交任何凭据
        run: |
          set -euo pipefail
          if git grep -nE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ; then
            echo "::error::检测到疑似凭据被提交进仓库"
            exit 1
          fi
          echo "✅ 未发现凭据"
      - name: 关闭关键字判据对大正文不误报（双向反向样本 >40KB + 静态扫描零管道）
        run: |
          set -euo pipefail
          # #131 回归靶子：`printf` 经管道接 `grep -q` 在 pipefail 下 —— grep -q 命中即退出 → printf 收到 EPIPE
          # → 整条管道被判失败 → `if !` 取反 → 误报「缺少关闭关键字」（正文 >32KB 才稳定触发）。
          # 判据**只有一处**（linked-issue 步骤的 LINKED_ISSUE_ASSERT 标记区）：本步骤抽出**实现本身**，
          # **禁止**在这里复写第二份正则（复写 = 两套判据，会漂移）。
          wf=.github/workflows/required-checks.yml
          judge=/tmp/linked-issue-assert.sh
          fail=0
          awk '/^[[:space:]]*# LINKED_ISSUE_ASSERT:BEGIN/ { on=1; next } /^[[:space:]]*# LINKED_ISSUE_ASSERT:END/ { on=0 } on' "$wf" > "$judge"
          if ! grep -q 'grep -qiE' "$judge"; then
            echo "::error file=$wf::未能从 LINKED_ISSUE_ASSERT 标记区解析出判据 —— 抽不到 = 断言无意义"
            fail=1
          elif [ "$(grep -c . "$judge" || true)" -lt 3 ]; then
            echo "::error file=$wf::LINKED_ISSUE_ASSERT 标记区过短（$(grep -c . "$judge" || true) 行）"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          . "$judge"
          command -v linked_issue_ok >/dev/null || { echo "::error file=$wf::标记区未定义 linked_issue_ok"; exit 1; }
          # ① 静态扫描：本文件禁止再出现「管道接 grep -q」（#131 的唯一触发形态）
          if grep -nE '\|[[:space:]]*grep -q' "$wf"; then
            echo "::error file=$wf::出现「管道接 grep -q」—— pipefail 下会 EPIPE（#131），改用 here-string"
            exit 1
          fi
          printf '✅ 静态扫描：%s 零命中「管道接 grep -q」\n' "$wf"
          # ② 大正文样本：>40KB（Linux runner 上 >32KB 才稳定触发 EPIPE，样本必须跨过该阈值）
          big_with=/tmp/linked-issue-big-with.md
          big_without=/tmp/linked-issue-big-without.md
          {
            printf 'Closes #1\n\n'
            awk 'BEGIN { for (i = 1; i <= 800; i++) printf "填充行 %04d：大正文样本，用于跨过 runner 管道缓冲（>32KB），暴露 grep -q 的 EPIPE 误报。\n", i }'
          } > "$big_with"
          grep -vxF 'Closes #1' "$big_with" > "$big_without"
          [ "$(grep -c '^Closes #1$' "$big_with" || true)" = 1 ] || { echo "::error::正向样本未恰好含 1 行 Closes #1"; fail=1; }
          [ "$(grep -c '^Closes #1$' "$big_without" || true)" = 0 ] || { echo "::error::反向样本仍含 Closes #1（两样本必须只差这一行）"; fail=1; }
          for f in "$big_with" "$big_without"; do
            b="$(wc -c < "$f" | tr -d ' ')"
            printf '  样本 %s：%s 字节\n' "$f" "$b"
            if [ "$b" -lt 40960 ]; then
              echo "::error::$f 只有 ${b} 字节（<40KB）—— 靶子样本无效，必须跨过 32KB 阈值"
              fail=1
            fi
          done
          # ③ 双向断言：同一段判据（linked_issue_ok）在两种大正文上必须给出相反结论
          if linked_issue_ok "$(cat "$big_with")"; then
            printf '  [ OK ] 大正文（含关闭关键字）→ 判据通过，不误报\n'
          else
            printf '  [FAIL] 大正文（含关闭关键字）→ 判据误报「缺少关闭关键字」—— #131 回归\n'
            fail=1
          fi
          if linked_issue_ok "$(cat "$big_without")"; then
            printf '  [FAIL] 大正文（不含关闭关键字）→ 判据仍然通过 —— 判据形同虚设（空断言）\n'
            fail=1
          else
            printf '  [ OK ] 大正文（不含关闭关键字）→ 判据按预期失败，仍能识别缺失\n'
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✅ #131：判据与实现同一段（LINKED_ISSUE_ASSERT 标记区）；大正文双向反向样本通过；工作流零「管道接 grep -q」"

  linked-issue:
    name: policy/linked-issue
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: PR 必须关联同仓库 Issue
        run: |
          set -euo pipefail
          PR='${{ github.event.pull_request.number }}'
          REPO='${{ github.repository }}'
          body="$(gh pr view "$PR" -R "$REPO" --json body --jq .body)"
          # 判据**只有一处**（本标记区）：ci/test 抽出同一段文本做双向反向样本，
          # 因此正则不得在测试里复写第二份（复写 = 两套判据、会漂移）。
          # LINKED_ISSUE_ASSERT:BEGIN —— 判据：正文是否含关闭关键字；here-string 去管道 → 无 EPIPE（#131）
          linked_issue_ok() {
            grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*#[0-9]+' <<<"${1:-}"
          }
          # LINKED_ISSUE_ASSERT:END
          if ! linked_issue_ok "$body"; then
            echo "::error::PR 正文缺少关闭关键字（例如 Closes #12）。官方：关键字只在 PR 正文或提交信息中生效，PR 标题无效。"
            exit 1
          fi
          refs="$(gh pr view "$PR" -R "$REPO" --json closingIssuesReferences --jq '[.closingIssuesReferences[].number] | join(",")')"
          if [ -z "$refs" ]; then
            echo "::error::GitHub 未解析出关闭关系。官方：关闭关键字只在 PR 目标是仓库默认分支时才被解析。"
            exit 1
          fi
          echo "✅ 关联 Issue：#${refs}"

  branch-name:
    name: policy/branch-name
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 分支命名符合规范且指向存在的已进入状态机的 Issue
        run: |
          set -euo pipefail
          REPO='${{ github.repository }}'
          head='${{ github.event.pull_request.head.ref }}'
          if [[ ! "$head" =~ ^(slice|fix|hotfix|spike|chore)/[0-9]+-[a-z0-9-]+$ ]]; then
            echo "::error::分支名 '$head' 不符合 <type>/<issue#>-<slug>；type ∈ {slice,fix,hotfix,spike,chore}，slug 只允许小写字母、数字、连字符"
            exit 1
          fi
          num="${head#*/}"; num="${num%%-*}"
          state="$(gh issue view "$num" -R "$REPO" --json state --jq .state)"
          echo "分支指向 Issue #${num}（state=${state}）"
          if [ "$state" != "OPEN" ]; then
            echo "::error::Issue #${num} 已关闭，不应对它再开新 PR（返修请重开原 Issue 或新建 Bug Issue）"
            exit 1
          fi
          slabel="$(gh issue view "$num" -R "$REPO" --json labels \
            --jq '[.labels[].name | select(startswith("status/"))] | length')"
          if [ "$slabel" -eq 0 ]; then
            echo "::error::Issue #${num} 处于 Backlog（无 status/* 标签）—— 先 scripts/status.sh ${num} in-progress，再由 scripts/start.sh 开工"
            exit 1
          fi
          if [ "$slabel" -gt 1 ]; then
            echo "::error::Issue #${num} 有 ${slabel} 个状态标签 —— 状态必须唯一，用 scripts/status.sh 修正"
            exit 1
          fi
          echo "✅ 分支命名合规；Issue #${num} 处于 OPEN 且恰好一个状态标签"

  template:
    name: policy/template
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: PR 正文按模板六段填写
        run: |
          set -euo pipefail
          PR='${{ github.event.pull_request.number }}'
          REPO='${{ github.repository }}'
          gh pr view "$PR" -R "$REPO" --json body --jq .body > /tmp/pr-body.md
          ok=1
          for i in 1 2 3 4 5 6; do
            if ! grep -qE "^## ${i}\." /tmp/pr-body.md; then
              echo "::error::缺少第 ${i} 节 —— 请用 .github/PULL_REQUEST_TEMPLATE.md 的六段结构（1.变更摘要 2.影响面 3.回滚方式 4.验收证据 5.DoD自查 6.风险与破坏性变更）"
              ok=0
            fi
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi
          echo "✅ 六段齐备"
